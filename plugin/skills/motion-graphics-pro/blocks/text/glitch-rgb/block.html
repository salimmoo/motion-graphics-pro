<!-- Block text/glitch-rgb · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/glitch-rgb" data-start="0" data-duration="4" data-track-index="10" class="blk blk-text-glitch-rgb">
<script type="application/json" data-block-props>
{"text": "SINYAL *HILANG*", "font": "Archivo:wght@800;900", "size": 140, "weight": 900, "color": "#f4f4f4", "accent_color": "#ff3b5c", "position_y": 50, "width": 80, "align": "center", "mode": "jitter", "color_1": "#ff2a4d", "color_2": "#18e0ff", "slide": 14, "strength": 1, "window": [[0.15, 0.4], [1.0, 1.3], [2.1, 2.4], [3.0, 3.2]], "ribbon_start": 0.9, "ribbon_duration": 1.3, "ribbon_width": 18, "angle": 18}
</script>
<div class="blk-tk"><div class="blk-l blk-r"></div><div class="blk-l blk-c"></div><div class="blk-l blk-dasar"></div><div class="blk-l blk-g"></div></div>
</div>
<style>
.blk-text-glitch-rgb {position:absolute;inset:0;pointer-events:none}
.blk-text-glitch-rgb .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-glitch-rgb .blk-kunci{color:var(--aksen)}
.blk-text-glitch-rgb .blk-l{position:absolute;left:0;top:0;width:100%}
.blk-text-glitch-rgb .blk-dasar{position:relative}
.blk-text-glitch-rgb .blk-r,.blk-text-glitch-rgb .blk-c{mix-blend-mode:screen}
.blk-text-glitch-rgb .blk-r .blk-kunci,.blk-text-glitch-rgb .blk-c .blk-kunci{color:inherit}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk");
  gayaTeks(el);
  var L = {}; ["r", "c", "dasar", "g"].forEach(function (n) { L[n] = el.querySelector(".blk-" + n); L[n].innerHTML = markupKunci(P.text); });
  L.r.style.color = P.color_1; L.c.style.color = P.color_2;
  var g = P.slide * k.s * P.strength, W = el.offsetWidth, H = el.offsetHeight;
  function acak(a, b) { var h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
  function band(c, bw, evenodd) {
    var sk = Math.tan(P.angle * Math.PI / 180) * H / W * 50;
    var pts = [(c - bw / 2 + sk) + "% 0", (c + bw / 2 + sk) + "% 0", (c + bw / 2 - sk) + "% 100%", (c - bw / 2 - sk) + "% 100%"];
    return "polygon(" + (evenodd ? "evenodd, -50% -50%, 150% -50%, 150% 150%, -50% 150%, -50% -50%, " : "") + pts.join(", ") + ")";
  }
  var Ep = gsap.parseEase("power1.inOut");
  BLOCK.onTime(tl, function (t) {
    if (P.mode === "ribbon") {
      var u = (t - P.ribbon_start) / P.ribbon_duration;
      if (u <= 0 || u >= 1) { L.r.style.opacity = L.c.style.opacity = L.g.style.opacity = 0; L.dasar.style.clipPath = "none"; return; }
      var c = -30 + 160 * Ep(u), bw = P.ribbon_width, jt = (acak(Math.floor(t * 30), 3) - 0.5) * 0.4 * g;
      L.r.style.cssText = "opacity:1;clip-path:" + band(c, bw) + ";transform:translateX(" + (g + jt) + "px)";
      L.c.style.cssText = "opacity:1;clip-path:" + band(c, bw) + ";transform:translateX(" + (-g + jt) + "px)";
      L.g.style.cssText = "opacity:1;clip-path:" + band(c, bw) + ";transform:translateX(" + (g * 0.45) + "px) skewX(-6deg)";
      L.dasar.style.clipPath = band(c, bw, true);
      return;
    }
    var aktif = (P.window || []).some(function (w) { return t >= w[0] && t < w[1]; });
    L.g.style.opacity = 0;
    if (!aktif) { L.r.style.cssText = L.c.style.cssText = "opacity:0"; L.dasar.style.transform = "none"; L.dasar.style.clipPath = "none"; return; }
    var f = Math.floor(t * 24);
    var rx = (acak(f, 1) - 0.5) * 2 * g, ry = (acak(f, 2) - 0.5) * 0.5 * g, cx = (acak(f, 4) - 0.5) * 2 * g;
    var a = acak(f, 5) * 70, b = a + 8 + acak(f, 6) * 30;
    var iris = "inset(" + a.toFixed(1) + "% 0 " + Math.max(0, 100 - b).toFixed(1) + "% 0)";
    L.r.style.cssText = "opacity:1;transform:translate(" + rx + "px," + ry + "px)";
    L.c.style.cssText = "opacity:1;transform:translate(" + (cx - g * 0.6) + "px," + (-ry) + "px);clip-path:" + (acak(f, 7) < 0.5 ? iris : "none");
    var sx = acak(f, 8) < 0.45 ? (acak(f, 9) - 0.5) * 1.6 * g : 0;
    L.dasar.style.transform = "translateX(" + sx + "px)";
    L.dasar.style.clipPath = "none";
  }, k.dur);
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.1);
  tl.to(el, { opacity: 0, duration: 0.3, ease: "power2.in" }, k.dur - 0.35);
  });
}, { font: true });
</script>
