<!-- Block text/blur-focus · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/blur-focus" data-start="0" data-duration="4" data-track-index="10" class="blk blk-text-blur-focus">
<script type="application/json" data-block-props>
{"text": "Fokus pada hal yang *penting*", "font": "Inter:wght@300;500;800", "size": 100, "weight": 800, "color": "#f5f3ee", "accent_color": "#ffcf4a", "position_y": 50, "width": 80, "align": "center", "mode": "words", "exit": "blur-up", "blur": 22, "distance": 40, "pause": 0.09, "enter_duration": 0.9}
</script>
<div class="blk-tk"><div class="blk-isi"></div></div>
</div>
<style>
.blk-text-blur-focus {position:absolute;inset:0;pointer-events:none}
.blk-text-blur-focus .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-blur-focus .blk-kunci{color:var(--aksen)}

</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), isi = el.querySelector(".blk-isi");
  gayaTeks(el);
  var u = BLOCK.split(isi, P.text, "words"), d = P.distance * k.s, b = P.blur * k.s, dm = P.enter_duration, n = u.length;
  var bl = function (v) { return "blur(" + (Math.round(v * 100) / 100) + "px)"; };
  if (P.mode === "soft") {
    tl.fromTo(u, { opacity: 0, y: d, filter: bl(b * 0.45) }, { opacity: 1, y: 0, filter: bl(0), duration: dm * 1.25, ease: "power3.out", stagger: P.pause * 0.6 }, 0.15);
  } else if (P.mode === "focus") {
    tl.fromTo(isi, { opacity: 0, scale: 1.12, filter: bl(b * 2) }, { opacity: 1, scale: 1, filter: bl(0), duration: dm * 1.7, ease: "expo.out" }, 0.1);
    tl.to(isi, { scale: 0.975, duration: Math.max(0.2, k.dur - 0.85 - dm * 1.7 - 0.1), ease: "sine.inOut" }, 0.1 + dm * 1.7);
  } else {
    tl.fromTo(u, { opacity: 0, y: d * 0.25, filter: bl(b) }, { opacity: 1, y: 0, filter: bl(0), duration: dm, ease: "power2.out", stagger: P.pause }, 0.15);
  }
  if (P.exit === "blur-up") {
    var sg = P.pause * 0.6, dk = 0.6;
    tl.to(u, { opacity: 0, y: -d * 1.3, filter: bl(b * 0.8), duration: dk, ease: "power2.in", stagger: sg }, k.dur - dk - sg * (n - 1) - 0.05);
  } else if (P.exit === "fade") {
    tl.to(u, { opacity: 0, duration: 0.45, ease: "power2.in", stagger: P.pause * 0.3 }, k.dur - 0.5 - P.pause * 0.3 * (n - 1));
  } else if (P.exit === "focus") {
    tl.to(isi, { opacity: 0, scale: 1.05, filter: bl(b * 1.4), duration: 0.65, ease: "power2.in" }, k.dur - 0.7);
  }
  });
}, { font: true });
</script>
