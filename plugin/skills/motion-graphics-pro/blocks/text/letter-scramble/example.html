<script>
BLOCK.mount("blk-letter-scramble", function (k) {
  var P = k.P, tl = k.tl;

  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk");
  gayaTeks(el);
  var G = { symbol: "!<>-_\\/[]{}=+*^?#%&$", binary: "01", letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", katakana: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ" }[P.glyph] || "!<>-_\\/[]{}=+*^?#";

      else {

        if (P.exit === "random" && t >= eS) { if (t < eL) { s = glif(i + 31, t); col = P.random_color; op = 0.85 * (1 - (t - eS) / 0.35); glow = 0; } else op = 0; }

      c.el.style.color = col || P.color;
      c.el.style.textShadow = glow > 0 ? "0 0 " + (0.25 * glow).toFixed(3) + "em " + BLOCK.rgba(P.random_color, 0.9 * glow) : "none";
