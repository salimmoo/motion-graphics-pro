<script>
BLOCK.mount("blk-word-swap", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});

  gayaTeks(el);
  var pil = (P.options || []).map(function (s) { return String(s).replace(/\*/g, ""); }), n = pil.length;
  el.innerHTML = (P.prefix ? markupKunci(P.prefix) + " " : "") + '<span class="blk-slot' + (P.mode === "roll" ? " blk-m" : "") + '"></span>' + (P.suffix ? " " + markupKunci(P.suffix) : "");
  var slot = el.querySelector(".blk-slot"), fs = P.size * k.s, lh = 1.15 * fs;
  // lebar slot = kata terlebar (diukur setelah font siap)
  var ukur = BLOCK.el("span", { style: "position:absolute;visibility:hidden;white-space:nowrap" }, slot), lw = 0;
  pil.forEach(function (s) { ukur.textContent = s; lw = Math.max(lw, ukur.offsetWidth); });

    pil.forEach(function (s) { BLOCK.el("div", null, kol).textContent = s; });
    for (var i = 1; i < n; i++) {

    }
  } else {
    slot.style.filter = "url(#" + k.id + "-leleh)";
    var W = pil.map(function (s) { var w = BLOCK.el("span", { class: "blk-lw" }, slot); w.textContent = s; return w; });
    W.forEach(function (w, i) { if (i) BLOCK.initial(tl, w, { opacity: 0 }); });
    var b = Math.round(9 * k.s);
    for (var j = 1; j < n; j++) {
      var dd = dt * 1.6;
      tl.fromTo(W[j - 1], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(" + b + "px)", duration: dd, ease: "power1.inOut" }, T(j));
      tl.fromTo(W[j], { opacity: 0, filter: "blur(" + b + "px)" }, { opacity: 1, filter: "blur(0px)", duration: dd, ease: "power1.inOut" }, T(j));
