<!-- Block text/colorama · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/colorama" data-start="0" data-duration="4.5" data-track-index="10" class="blk blk-text-colorama">
<script type="application/json" data-block-props>
{"text": "WARNA *BARU*", "font": "Archivo:wght@800;900", "size": 160, "weight": 900, "color": "#f7f4ee", "accent_color": "#ffcf4a", "position_y": 50, "width": 80, "align": "center", "map_color": ["#ff3d7f", "#ffb800", "#3dd6ff", "#7a5cff", "#ff3d7f"], "angle": 112, "soft": 14, "blur": 10, "start": 0.2, "sweep_duration": 1.3, "exit": true, "ease": "power2.inOut"}
</script>
<div class="blk-tk"><div class="blk-isi"><div class="blk-bersih"></div><div class="blk-warna"></div></div></div>
</div>
<style>
.blk-text-colorama {position:absolute;inset:0;pointer-events:none}
.blk-text-colorama .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-colorama .blk-kunci{color:var(--aksen)}
.blk-text-colorama .blk-isi{position:relative;display:inline-block}
.blk-text-colorama .blk-warna{position:absolute;inset:0;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% 100%}
.blk-text-colorama .blk-warna .blk-kunci{color:transparent}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), br = el.querySelector(".blk-bersih"), wr = el.querySelector(".blk-warna");
  gayaTeks(el);
  br.innerHTML = wr.innerHTML = markupKunci(P.text);
  var pal = (P.map_color && P.map_color.length ? P.map_color : ["#ff3d7f", "#3dd6ff"]);
  wr.style.backgroundImage = "linear-gradient(90deg," + pal.join(",") + ")";
  wr.style.filter = "blur(" + Math.round(P.blur * k.s) + "px) saturate(1.3)";
  var f = +P.soft, A = P.angle, E = gsap.parseEase(P.ease), D = +P.sweep_duration, tK = k.dur - D - 0.15;
  function mk(e, s) { e.style.webkitMaskImage = e.style.maskImage = s; }
  function lg(st) { return "linear-gradient(" + A + "deg," + st.map(function (x) { return x[0] + " " + x[1].toFixed(2) + "%"; }).join(",") + ")"; }
  BLOCK.onTime(tl, function (t) {
    var keluar = P.exit && t >= tK, u = E(BLOCK.clamp((t - (keluar ? tK : P.start)) / D, 0, 1)), F = -2 * f + (100 + 4 * f) * u;
    var Z = "transparent", K = "#000";
    if (!keluar) mk(br, lg([[K, F - f], [Z, F]]));
    else mk(br, lg([[Z, F], [K, F + f]]));
    mk(wr, lg([[Z, F - 2 * f], [K, F - f * 0.8], [K, F - f * 0.1], [Z, F + f * 0.7]]));
    wr.style.opacity = u > 0 && u < 1 ? 1 : 0;
    wr.style.backgroundPosition = (100 - F) + "% 0%";
  }, k.dur);
  });
}, { font: true });
</script>
