<script type="application/json" data-block-props>
{"text": "Ketik ide pertamamu, lalu *rapikan* pelan-pelan.", "font": "JetBrains Mono:wght@400;500;700", "size": 64, "weight": 500, "color": "#f2efe6", "accent_color": "#7cf0b5", "position_y": 50, "width": 76, "align": "left", "mode": "type", "speed": 16, "start": 0.4, "cursor": "line", "blink": 1.2, "fix": "", "prefix": "Kuncinya: ", "old_text": "kerja keras", "dim_color": "#6d727c", "selected_color": "#5b7cff"}
</script>
<div class="blk-tk"></div>
</div>
<style>
.blk-text-typewriter {position:absolute;inset:0;pointer-events:none}
.blk-text-typewriter .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-typewriter .blk-kunci{color:var(--aksen)}
.blk-text-typewriter .blk-tk{line-height:1.3;white-space:pre-wrap}
.blk-text-typewriter .blk-isi{position:relative;z-index:1}
.blk-text-typewriter .blk-kotak{padding:.55em .8em;border:.045em solid rgba(255,255,255,.22);border-radius:.45em;background:rgba(255,255,255,.05);box-sizing:border-box}
.blk-text-typewriter .blk-tanda{color:var(--aksen);margin-right:.5em}
.blk-text-typewriter .blk-pilih{position:absolute;z-index:0;border-radius:.08em;background:linear-gradient(90deg,var(--aksen),var(--pilih));opacity:0}
.blk-text-typewriter .blk-kursor{display:inline-block;background:var(--aksen);vertical-align:-.14em;margin-left:.04em;position:relative;z-index:1}
.blk-text-typewriter .blk-k-line{width:.08em;height:1.05em}
.blk-text-typewriter .blk-k-block{width:.56em;height:1.05em}
.blk-text-typewriter .blk-k-bottom{width:.56em;height:.1em;vertical-align:-.06em}
</style>
<script>
BLOCK.mount("blk-typewriter", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), r = k.random, mode = P.mode, cps = Math.max(1, +P.speed), t0 = +P.start;
  gayaTeks(el);
  el.style.setProperty("--pilih", P.selected_color);
  var fs = parseFloat(el.style.fontSize);
  var pre = mode === "swap" ? String(P.prefix || "") : "";
  var src = pre.replace(/\*/g, "") + String(P.text).replace(/\\n/g, "\n");
  var plain = "", kunci = [], on = false, i;
  for (i = 0; i < src.length; i++) { if (src[i] === "*") { on = !on; continue; } plain += src[i]; kunci.push(on && i >= pre.length); }
  if (mode === "prompt") { el.classList.add("blk-kotak"); BLOCK.el("span", { class: "blk-tanda" }, el, "&rsaquo;"); }
  var isi = BLOCK.el("span", { class: "blk-isi" }, el);
  var kEl = BLOCK.el("span", { class: "blk-kursor blk-k-" + P.cursor }, el);
  // render string s: huruf kunci diwarnai bila awalan s sama dengan teks akhir
  function html(s) {
    var cp = 0; while (cp < s.length && s[cp] === plain[cp]) cp++;
    var out = "", cur = null;
    for (var i = 0; i < s.length; i++) {
      var c = s[i], kk = i < cp && kunci[i];
      if (c === "\n") { if (cur !== null) out += "</span>"; cur = null; out += "<br>"; continue; }
      if (kk !== cur) { if (cur !== null) out += "</span>"; out += '<span class="' + (kk ? "blk-kunci" : "blk-n") + '">'; cur = kk; }
      out += BLOCK.esc(c);
    }
    return out + (cur !== null ? "</span>" : "");
  }
  // jadwal keadaan teks [{t, s}] (deterministik dari seed)
  var st = [{ t: -1, s: "" }], t = t0;
  function ketik(dari, ke, laju, manusia) {
    for (var i = dari.length; i < ke.length; i++) {
      t += (1 / laju) * (manusia ? 0.45 + r() * 1.1 : 0.75 + r() * 0.5);
      if (manusia && ke[i] === " ") t += 0.04 + r() * 0.2;
      if (/[.,!?;:]/.test(ke[i - 1] || "")) t += manusia ? 0.28 : 0.12;
      st.push({ t: t, s: ke.slice(0, i + 1) });
    }
  }
  function hapus(dari, ke) { for (var i = dari.length - 1; i >= ke.length; i--) { t += 0.05; st.push({ t: t, s: dari.slice(0, i) }); } }
  var tA, tC, tD, geo, sel, kata = [];
  if (mode === "type") ketik("", plain, cps, false);
  if (mode === "prompt") {
    if (P.fix) {
      var cut = plain.replace(/\s+$/, "").lastIndexOf(" ") + 1, dasar = plain.slice(0, cut), salah = dasar + P.fix;
      ketik("", salah, cps * 1.3, true); t += 0.45; hapus(salah, dasar); t += 0.2; ketik(dasar, plain, cps * 1.3, true);
    } else ketik("", plain, cps * 1.3, true);
  }
  if (mode === "swap") {
    isi.innerHTML = BLOCK.esc(pre.replace(/\*/g, "")) + '<span class="blk-lama">' + BLOCK.esc(P.old_text) + "</span>";
    var lm = isi.querySelector(".blk-lama");
    geo = { x: lm.offsetLeft, y: lm.offsetTop, w: lm.offsetWidth, h: lm.offsetHeight };
    sel = BLOCK.el("div", { class: "blk-pilih" }, null); el.insertBefore(sel, isi);
    st[0].s = pre.replace(/\*/g, "") + P.old_text;
    tA = t0 + 0.4; tC = tA + 0.75; tD = tC + 0.3;
    st.push({ t: tC, s: pre.replace(/\*/g, "") });
    t = tD + 0.15; ketik(pre.replace(/\*/g, ""), plain, cps, false);
  }
  var akhirStream = 0;
  if (mode === "stream") {
    var pos = 0, m, re = /\S+\s*/g;
    while ((m = re.exec(plain))) {
      var sp = BLOCK.el("span", { class: "blk-w" }, isi); sp.textContent = m[0];
      kata.push({ el: sp, k: kunci[m.index], a: 0 });
    }
    // kata datang bergelombang: 1-4 kata per letupan, jeda letupan tidak rata
    var ti = t0, j = 0;
    while (j < kata.length) {
      var b = 1 + Math.floor(r() * 3.4);
      for (var q = 0; q < b && j < kata.length; q++, j++) kata[j].a = ti + q * 0.04;
      ti += (0.2 + r() * 0.45) * (16 / cps) * (0.55 + b * 0.3);
    }
    akhirStream = kata.length ? kata[kata.length - 1].a : 0;
  }
  var last = -2, E = gsap.parseEase("power3.inOut");
  BLOCK.onTime(tl, function (t) {
    var ubah = 0;
    if (mode === "stream") {
      kata.forEach(function (w) {
        if (t < w.a) { w.el.style.display = "none"; return; }
        var u = BLOCK.clamp((t - w.a) / 0.5, 0, 1);
        w.el.style.display = "inline";
        w.el.style.opacity = BLOCK.clamp((t - w.a) / 0.08, 0, 1);
        w.el.style.color = BLOCK.mix(P.dim_color, w.k ? P.accent_color : P.color, u);
        ubah = Math.max(ubah, w.a);
      });
      if (t < t0) ubah = 0;
    } else {
      var n = 0; while (n + 1 < st.length && st[n + 1].t <= t) n++;
      if (n !== last) { last = n; isi.innerHTML = html(st[n].s); }
      ubah = Math.max(0, st[n].t);
    }
    var vis = 1;
    if (sel) {
      if (t < tA || t >= tD) sel.style.opacity = 0;
      else {
        var cw = 0.08 * fs, W, x;
        if (t < tC) { W = cw + (geo.w - cw) * E(BLOCK.clamp((t - tA) / 0.45, 0, 1)); x = geo.x + geo.w - W; }
        else { W = geo.w + (cw - geo.w) * E(BLOCK.clamp((t - tC) / 0.3, 0, 1)); x = geo.x; }
        sel.style.cssText = "opacity:.9;left:" + x + "px;top:" + geo.y + "px;width:" + W + "px;height:" + geo.h + "px";
        vis = 0;
      }
    }
    var d = t - ubah;
    if (vis) vis = d < 0.45 ? 1 : (Math.floor((d - 0.45) * P.blink * 2) % 2 === 0 ? 1 : 0);
    kEl.style.opacity = vis;
  }, k.dur);
  tl.to(el, { opacity: 0, duration: 0.4, ease: "power2.in" }, k.dur - 0.45);
  });
}, { font: true });
</script>
