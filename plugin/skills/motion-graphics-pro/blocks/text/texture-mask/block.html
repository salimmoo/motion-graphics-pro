<!-- Block text/texture-mask · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/texture-mask" data-start="0" data-duration="5" data-track-index="10" class="blk blk-text-texture-mask">
<script type="application/json" data-block-props>
{"text": "MARMER", "font": "Anton", "size": 300, "weight": 400, "color": "#f5f3ee", "accent_color": "#ffcf4a", "position_y": 50, "width": 92, "align": "center", "texture": "marble", "mode": "fill", "slide": 1, "texture_resolution": 384, "shadow": true, "seed": "tekstur"}
</script>
<div class="blk-tk"><div class="blk-isi"></div></div>
</div>
<style>
.blk-text-texture-mask {position:absolute;inset:0;pointer-events:none}
.blk-text-texture-mask .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-texture-mask .blk-kunci{color:var(--aksen)}
.blk-text-texture-mask .blk-tk{line-height:.95}
.blk-text-texture-mask .blk-isi{background-repeat:no-repeat}
.blk-text-texture-mask .blk-isi.blk-isi-t{color:transparent;-webkit-background-clip:text;background-clip:text}
.blk-text-texture-mask .blk-isi.blk-isi-t .blk-kunci{color:transparent}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), isi = el.querySelector(".blk-isi");
  gayaTeks(el);
  isi.innerHTML = markupKunci(P.text);
  // noise nilai 2D berseed + fbm (lokal untuk blok ini)
  var r = BLOCK.random(P.seed), G = 256, tab = new Float32Array(G * G);
  for (var i = 0; i < G * G; i++) tab[i] = r();
  function v2(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = tab[((yi & 255) * G + (xi & 255))], b = tab[((yi & 255) * G + ((xi + 1) & 255))], c = tab[(((yi + 1) & 255) * G + (xi & 255))], d = tab[(((yi + 1) & 255) * G + ((xi + 1) & 255))];
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, o) { var s = 0, a = 0.5; for (var i = 0; i < (o || 5); i++) { s += a * v2(x, y); x = x * 2.02 + 5.3; y = y * 2.02 + 1.7; a *= 0.5; } return s; }
  function mix(c1, c2, t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t]; }
  function ramp(stops, t) { for (var i = 1; i < stops.length; i++) if (t <= stops[i][0]) return mix(stops[i - 1][1], stops[i][1], (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0])); return stops[stops.length - 1][1]; }
  var T = {
    marble: function (x, y) { var n = fbm(x * 3, y * 3), v = Math.abs(Math.sin((x * 2.2 + y * 1.4) * 3.1 + n * 9)), vein = Math.pow(1 - v, 7), fine = Math.pow(1 - Math.abs(Math.sin((x * 6 - y * 3) * 2 + fbm(x * 7 + 3, y * 7) * 7)), 30);
      return mix(mix([244, 241, 235], [214, 208, 200], n), [70, 66, 80], vein * 0.9 + fine * 0.5); },
    wood: function (x, y) { var w = fbm(x * 2, y * 9) * 1.4, rr = Math.sqrt((x - 0.3) * (x - 0.3) * 0.15 + (y + 0.8) * (y + 0.8)) * 22 + w, f = rr - Math.floor(rr), g = fbm(x * 60, y * 3, 3);
      return mix(mix([176, 118, 66], [120, 72, 36], Math.pow(f, 2.5)), [92, 54, 26], g * 0.35); },
    metal: function (x, y) { var n = fbm(x * 1.5, y * 90, 4), sh = 0.5 + 0.5 * Math.cos((y * 2.4 + x * 0.5) * Math.PI * 2), sh2 = Math.pow(0.5 + 0.5 * Math.cos((y * 5.5 - x) * Math.PI * 2), 8);
      return mix(mix([78, 86, 98], [222, 228, 236], sh * 0.85 + n * 0.3), [255, 255, 255], sh2 * 0.5); },
    lava: function (x, y) { var q = fbm(x * 3 + fbm(x * 3, y * 3) * 2.5, y * 3 + fbm(x * 3 + 7, y * 3 + 2) * 2.5), cr = Math.pow(1 - Math.abs(fbm(x * 8, y * 8, 4) * 2 - 1), 10);
      return ramp([[0, [26, 5, 3]], [0.45, [120, 20, 6]], [0.62, [235, 80, 10]], [0.8, [255, 200, 90]], [1, [255, 245, 200]]], Math.min(1, q * 1.15 + cr * 0.5)); },
    paper: function (x, y) { var n = fbm(x * 9, y * 9, 4), f = fbm(x * 40, y * 4, 3), sp = v2(x * 160, y * 160) > 0.93 ? 1 : 0;
      return mix(mix([239, 230, 210], [222, 208, 180], n * 0.8 + f * 0.25), [140, 120, 90], sp * 0.4); },
  };
  var fn = T[P.texture] || T.marble, S = Math.max(64, Math.round(P.texture_resolution)), cv = document.createElement("canvas");
  cv.width = cv.height = S;
  var cx = cv.getContext("2d"), im = cx.createImageData(S, S), lub = P.mode === "hole";
  for (var y = 0; y < S; y++) for (var x = 0; x < S; x++) {
    var c = fn(x / S, y / S), o = (y * S + x) * 4;
    if (lub) { var lum = (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255, a = BLOCK.clamp((lum - 0.42) / 0.2, 0, 1); im.data[o] = im.data[o + 1] = im.data[o + 2] = 255; im.data[o + 3] = Math.round(a * 255); }
    else { im.data[o] = c[0]; im.data[o + 1] = c[1]; im.data[o + 2] = c[2]; im.data[o + 3] = 255; }
  }
  cx.putImageData(im, 0, 0);
  var url = "url(" + cv.toDataURL("image/png") + ")", ukuran = Math.round(Math.max(isi.offsetWidth, isi.offsetHeight) * 1.35) + "px";
  if (lub) { isi.style.webkitMaskImage = isi.style.maskImage = url; isi.style.webkitMaskSize = isi.style.maskSize = ukuran; isi.style.webkitMaskRepeat = isi.style.maskRepeat = "no-repeat"; }
  else { isi.classList.add("blk-isi-t"); isi.style.backgroundImage = url; isi.style.backgroundSize = ukuran; }
  if (P.shadow) el.style.filter = "drop-shadow(0 " + Math.round(10 * k.s) + "px " + Math.round(24 * k.s) + "px rgba(0,0,0,.45))";
  var g = +P.slide;
  BLOCK.onTime(tl, function (t) {
    var u = t / k.dur, pos = (50 - 40 * g + 80 * g * u) + "% " + (40 + 20 * g * u) + "%";
    if (lub) isi.style.webkitMaskPosition = isi.style.maskPosition = pos; else isi.style.backgroundPosition = pos;
  }, k.dur);
  tl.fromTo(isi, { opacity: 0, scale: 0.94, letterSpacing: "0.06em" }, { opacity: 1, scale: 1, letterSpacing: "0em", duration: 1.1, ease: "expo.out" }, 0.1);
  tl.to(isi, { opacity: 0, duration: 0.5, ease: "power2.in" }, k.dur - 0.55);
  });
}, { font: true });
</script>
