<!-- Block text/kinetic · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/kinetic" data-start="0" data-duration="6" data-track-index="10" class="blk blk-text-kinetic">
<script type="application/json" data-block-props>
{"beats": [{"t": 0.2, "dur": 1.8, "preset": "rise", "text": "Setiap *kata* punya irama"}, {"t": 2.1, "dur": 1.8, "preset": "slide", "text": "Tiga *ketukan*\nsatu pesan", "from": "l"}, {"t": 4.0, "dur": 1.8, "preset": "pop", "text": "Lalu *selesai*"}], "font": "Inter:wght@500;800", "size": 96, "weight": 800, "color": "#f5f3ee", "accent_color": "#ffcf4a", "highlighter": "#c2410c", "bg": "", "width": 80, "exit": "fade", "keyword_italic": false}
</script>
<div class="blk-wadah"></div>
</div>
<style>
.blk-text-kinetic {position:absolute;inset:0;pointer-events:none}
.blk-text-kinetic .blk-wadah{position:absolute;inset:0}
.blk-text-kinetic .blk-wadah canvas{width:100%!important;height:100%!important}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { kiri: "left", kanan: "right" }[P.rata] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.posisi_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var wd = k.root.querySelector(".blk-wadah");
  if (!window.MGP || !MGP.kineticType) { console.error("[blok] text/kinetic needs lib:mgp.js"); return; }
  // ukuran lib berbasis lebar acuan: ref = w / s membuat px props berlaku pada sisi pendek 1080
  var inst = MGP.kineticType.create(wd, {
    width: k.w, height: k.h, dpr: 1, ref: k.w / k.s, beats: P.beats, font: BLOCK.family(P.font), size: P.size, weight: P.weight,
    color: P.color, keyColor: P.accent_color, highlight: P.highlighter, bg: P.bg || null, maxWidth: P.width / 100,
    exit: P.exit, keyItalic: !!P.keyword_italic, googleFonts: P.font ? [P.font] : []
  });
  return inst.ready.then(function () { BLOCK.onTime(k.tl, function (t) { inst.seek(t); }, k.dur); });
  });
}, { font: true });
</script>
