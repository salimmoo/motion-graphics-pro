<!-- Block text/strike-replace · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/strike-replace" data-start="0" data-duration="4.5" data-track-index="10" class="blk blk-text-strike-replace">
<script type="application/json" data-block-props>
{"old_text": "Kerja lebih lama", "text": "Kerja lebih *cerdas*", "font": "Inter:wght@500;800", "size": 100, "weight": 800, "color": "#f5f3ee", "accent_color": "#ffcf4a", "position_y": 50, "width": 80, "align": "center", "mode": "bottom", "strike_style": "hand", "strike_color": "#ff5a4e", "dim": 0.4, "strike_start": 0.9, "strike_duration": 0.5, "seed": "coret"}
</script>
<div class="blk-tk"><div class="blk-tumpuk"><div class="blk-lama"><span class="blk-lt"></span><svg class="blk-gs"><path/></svg></div><div class="blk-baru"></div></div></div>
</div>
<style>
.blk-text-strike-replace {position:absolute;inset:0;pointer-events:none}
.blk-text-strike-replace .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-strike-replace .blk-kunci{color:var(--aksen)}
.blk-text-strike-replace .blk-tumpuk{display:flex;flex-direction:column;align-items:var(--rata);gap:.18em}
.blk-text-strike-replace .blk-tumpuk.blk-g{display:grid;justify-items:var(--rata)}
.blk-text-strike-replace .blk-g>div{grid-area:1/1}
.blk-text-strike-replace .blk-lama{position:relative;display:inline-block}
.blk-text-strike-replace .blk-gs{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.blk-text-strike-replace .blk-gs path{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), tp = el.querySelector(".blk-tumpuk"), lama = el.querySelector(".blk-lama"), lt = el.querySelector(".blk-lt");
  var svg = el.querySelector(".blk-gs"), path = svg.querySelector("path"), baru = el.querySelector(".blk-baru");
  gayaTeks(el);
  tp.style.setProperty("--rata", { left: "flex-start", right: "flex-end" }[rata] || "center");
  if (P.mode === "replace") tp.classList.add("blk-g");
  lt.innerHTML = markupKunci(P.old_text);
  var u = BLOCK.split(baru, P.text, "words");
  var W = lama.offsetWidth, H = lama.offsetHeight, r = BLOCK.random(P.seed), fs = P.size * k.s;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var d;
  if (P.strike_style === "straight") d = "M" + (-0.03 * W) + " " + (H * 0.56) + " L" + (1.03 * W) + " " + (H * 0.52);
  else {
    var pts = [], m = 6;
    for (var i = 0; i <= m; i++) pts.push([-0.04 * W + 1.08 * W * i / m, H * (0.6 - 0.1 * i / m) + (r() - 0.5) * H * 0.1]);
    d = "M" + pts[0][0] + " " + pts[0][1];
    for (var j = 1; j < pts.length; j++) { var a = pts[j - 1], b = pts[j]; d += " Q" + a[0] + " " + a[1] + " " + (a[0] + b[0]) / 2 + " " + (a[1] + b[1]) / 2; }
    var z = pts[pts.length - 1]; d += " L" + z[0] + " " + z[1];
    // goresan balik pendek seperti coretan tangan
    d += " Q" + (W * 0.7) + " " + (H * 0.44) + " " + (W * 0.42) + " " + (H * (0.47 + (r() - 0.5) * 0.06));
  }
  path.setAttribute("d", d);
  path.style.stroke = P.strike_color; path.style.strokeWidth = Math.max(2, fs * 0.085);
  var Lp = BLOCK.prepareStroke(path), mc = +P.strike_start, dc = +P.strike_duration;
  BLOCK.initial(tl, path, { strokeDashoffset: Lp });
  tl.fromTo(lama, { opacity: 0, y: fs * 0.3 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
  tl.to(path, { strokeDashoffset: 0, duration: dc, ease: "power2.inOut" }, mc);
  tl.to(lt, { opacity: P.dim, duration: 0.4, ease: "power1.out" }, mc + dc * 0.6);
  var tB = mc + dc + 0.25;
  if (P.mode === "replace") {
    tl.to(lama, { opacity: 0, y: -fs * 0.35, filter: "blur(" + Math.round(8 * k.s) + "px)", duration: 0.45, ease: "power2.in" }, tB);
    tB += 0.2;
  }
  tl.fromTo(u, { opacity: 0, y: fs * 0.45 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out", stagger: 0.07 }, tB);
  tl.to(el.querySelectorAll(".blk-lama, .blk-baru"), { opacity: 0, duration: 0.45, ease: "power2.in" }, k.dur - 0.5);
  });
}, { font: true });
</script>
