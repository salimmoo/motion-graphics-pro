<script>
BLOCK.mount("blk-particles", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var W = k.w, H = k.h, kv = BLOCK.canvas(k.root, W, H, 1), g = kv.ctx, r = BLOCK.random(P.seed);
  // sampel bitmap teks sekali di kanvas luring
  var off = document.createElement("canvas"); off.width = W; off.height = H;
  var o = off.getContext("2d"), fs = P.size * k.s, fam = BLOCK.family(P.font), baris = String(P.text).replace(/\*/g, "").replace(/\\n/g, "\n").split("\n");
  o.font = P.weight + " " + fs + "px " + fam;
  var mw = Math.max.apply(null, baris.map(function (b) { return o.measureText(b).width; }));
  if (mw > W * P.width / 100) { fs *= W * P.width / 100 / mw; o.font = P.weight + " " + fs + "px " + fam; }
  o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle";
  var cy = H * P.position_y / 100, lh = fs * 1.02;
  baris.forEach(function (b, i) { o.fillText(b, W / 2, cy + (i - (baris.length - 1) / 2) * lh); });
  var data = o.getImageData(0, 0, W, H).data, st = Math.max(2, Math.round(P.density * k.s)), tg = [];
  for (var y = 0; y < H; y += st) for (var x = 0; x < W; x += st) if (data[(y * W + x) * 4 + 3] > 128) tg.push([x, y]);
  for (var i = tg.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), tmp = tg[i]; tg[i] = tg[j]; tg[j] = tmp; }
  tg = tg.slice(0, Math.max(1, Math.round(P.max_count)));
  var R = Math.min(W, H), cx = W / 2;
  var pt = tg.map(function (q) {
    var sx, sy;
    if (P.spread === "screen") { sx = (r() * 1.3 - 0.15) * W; sy = (r() * 1.3 - 0.15) * H; }
    else if (P.spread === "bottom") { sx = q[0] + (r() - 0.5) * W * 0.5; sy = H * (1.05 + r() * 0.35); }
    else { var a = r() * Math.PI * 2, rr = Math.sqrt(r()) * R * 0.55; sx = cx + Math.cos(a) * rr * 1.5; sy = cy + Math.sin(a) * rr; }
    var ua = r() * Math.PI * 2;
    return { tx: q[0], ty: q[1], sx: sx, sy: sy, d: r() * P.time_jitter, ku: r() * 0.25 - 0.125, ak: r() < P.accent_amount, sd: r() * 100,
      ux: Math.cos(ua), uy: Math.sin(ua) - 0.6, uv: 0.4 + r() * 0.8, ud: (q[0] / W) * 0.55 + r() * 0.2 };
  });
  var m = P.mode, adaK = m !== "scatter", adaU = m !== "gather", Dk = +P.gather_duration, Du = +P.scatter_duration;
  var tU = m === "scatter" ? Math.max(P.start + 0.6, k.dur * 0.3) : k.dur - Du - 0.75, sz = Math.max(1, P.particle_size * k.s);
  BLOCK.onTime(tl, function (t) {
    g.clearRect(0, 0, W, H);
    for (var pass = 0; pass < 2; pass++) {
      g.fillStyle = pass ? P.accent_color : P.color;
      for (var i = 0; i < pt.length; i++) {
        var q = pt[i]; if (q.ak !== !!pass) continue;

        if (adaK) {

          var px = -(q.ty - q.sy), py = q.tx - q.sx;

        g.fillRect(x - sz / 2, y - sz / 2, sz, sz);

  });
