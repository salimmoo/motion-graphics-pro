<!-- Block text/line-slide · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/line-slide" data-start="0" data-duration="4" data-track-index="10" class="blk blk-text-line-slide">
<script type="application/json" data-block-props>
{"text": "Rencana disusun\nlangkah *diambil*\nhasil terlihat", "font": "Inter:wght@500;800", "size": 92, "weight": 800, "color": "#f5f3ee", "accent_color": "#7ad8ff", "position_y": 50, "width": 76, "align": "left", "direction": "left", "exit": "right", "mask": true, "distance": 160, "pause": 0.14, "enter_duration": 0.8, "ease": "expo.out"}
</script>
<div class="blk-tk"></div>
</div>
<style>
.blk-text-line-slide {position:absolute;inset:0;pointer-events:none}
.blk-text-line-slide .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-line-slide .blk-kunci{color:var(--aksen)}
.blk-text-line-slide .blk-tp{display:inline-block;vertical-align:top}
.blk-text-line-slide .blk-tp.blk-m{overflow:hidden;padding:0 .04em .06em}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk");
  gayaTeks(el);
  var u = BLOCK.split(el, P.text, "lines"), n = u.length;
  u.forEach(function (e) { var w = BLOCK.el("span", { class: "blk-tp" + (P.mask ? " blk-m" : "") }, null); e.parentNode.insertBefore(w, e); w.appendChild(e); });
  var sM = P.direction === "right" ? 1 : -1, sK = P.exit === "left" ? -1 : 1, d = P.distance * k.s;
  var dari = P.mask ? { xPercent: 105 * sM, opacity: 1 } : { x: d * sM, opacity: 0 };
  tl.fromTo(u, dari, { xPercent: 0, x: 0, opacity: 1, duration: P.enter_duration, ease: P.ease, stagger: P.pause }, 0.15);
  var dk = 0.55, tk = k.dur - dk - P.pause * 0.7 * (n - 1) - 0.05;
  if (P.exit === "right" || P.exit === "left") {
    var ke = P.mask ? { xPercent: 105 * sK } : { x: d * sK, opacity: 0 };
    tl.to(u, Object.assign({ duration: dk, ease: "power3.in", stagger: P.pause * 0.7 }, ke), tk);
  } else if (P.exit === "fade") tl.to(u, { opacity: 0, duration: 0.45, ease: "power2.in", stagger: P.pause * 0.5 }, k.dur - 0.5 - P.pause * 0.5 * (n - 1));
  });
}, { font: true });
</script>
