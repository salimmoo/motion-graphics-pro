<!-- Block text/shine · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/shine" data-start="0" data-duration="4.5" data-track-index="10" class="blk blk-text-shine">
<script type="application/json" data-block-props>
{"text": "Hasil yang *bersinar*", "font": "Inter:wght@600;800", "size": 120, "weight": 800, "color": "#bdb7ab", "accent_color": "#ffcf4a", "position_y": 50, "width": 80, "align": "center", "mode": "once", "shine_color": "#ffffff", "shine_width": 3, "angle": 110, "shine_start": 1.3, "shine_duration": 1.3, "repeat": 3, "repeat_pause": 0.35, "light": 0.55}
</script>
<div class="blk-tk"><div class="blk-isi"><div class="blk-dasar"></div><div class="blk-lapis"></div></div></div>
</div>
<style>
.blk-text-shine {position:absolute;inset:0;pointer-events:none}
.blk-text-shine .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-shine .blk-kunci{color:var(--aksen)}
.blk-text-shine .blk-isi{position:relative;display:inline-block}
.blk-text-shine .blk-lapis{position:absolute;inset:0;color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;background-size:300% 100%}
.blk-text-shine .blk-lapis .blk-kunci{color:transparent}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), isi = el.querySelector(".blk-isi"), ds = el.querySelector(".blk-dasar"), lp = el.querySelector(".blk-lapis");
  gayaTeks(el);
  ds.innerHTML = lp.innerHTML = markupKunci(P.text);
  var L = P.shine_width, kc = P.shine_color;
  lp.style.backgroundImage = "linear-gradient(" + P.angle + "deg, transparent " + (50 - L * 2) + "%, " + BLOCK.rgba(kc, 0.55) + " " + (50 - L) + "%, " + kc + " 50%, " +
    BLOCK.rgba(kc, 0.55) + " " + (50 + L) + "%, transparent " + (50 + L * 2) + "%)";
  if (P.light > 0) lp.style.filter = "drop-shadow(0 0 " + Math.round(18 * k.s) + "px " + BLOCK.rgba(kc, P.light) + ")";
  // posisi latar 300%: pita di tengah gradien; 92% = di kiri luar teks, 8% = di kanan luar
  BLOCK.initial(tl, lp, { backgroundPosition: "92% 0%" });
  tl.fromTo(isi, { opacity: 0, y: 30 * k.s }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
  var n = P.mode === "repeat" ? Math.max(1, Math.round(P.repeat)) : 1, D = +P.shine_duration;
  for (var i = 0; i < n; i++)
    tl.fromTo(lp, { backgroundPosition: "92% 0%" }, { backgroundPosition: "8% 0%", duration: D, ease: "power2.inOut", immediateRender: false }, P.shine_start + i * (D + P.repeat_pause));
  tl.to(isi, { opacity: 0, duration: 0.45, ease: "power2.in" }, k.dur - 0.5);
  });
}, { font: true });
</script>
