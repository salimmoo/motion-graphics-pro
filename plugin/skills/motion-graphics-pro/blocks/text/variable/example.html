{"text": "Bobot yang *bergerak*", "font": "Roboto Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000", "size": 120, "weight": 400, "color": "#f5f3ee", "accent_color": "#ffcf4a", "position_y": 50, "width": 92, "align": "center", "mode": "wave", "start_weight": 200, "end_weight": 1000, "start": 0.3, "press_time": 1.4, "change_duration": 0.8, "pause": 0.035, "wave_width": 2.2, "repeat": 2, "skew": true}

<style>
.blk-text-variable {position:absolute;inset:0;pointer-events:none}
.blk-text-variable .blk-tk{position:absolute;left:50%;transform:translate(-50%,-50%);line-height:1.08}
.blk-text-variable .blk-kunci{color:var(--aksen)}
.blk-text-variable .blk-u{font-variation-settings:"wght" 400}
</style>
<script>
BLOCK.mount("blk-variable", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk");
  gayaTeks(el);
  var u = BLOCK.split(el, P.text, "letters"), n = u.length, m = P.mode, a = +P.start_weight, b = +P.end_weight, D = +P.change_duration;
  var kunci = u.map(function (e) { return !!e.closest(".blk-kunci"); }), adaK = kunci.some(Boolean);
  var io = gsap.parseEase("power3.inOut"), oo = gsap.parseEase("power3.out"), c = function (v) { return BLOCK.clamp(v, 0, 1); };
  var fs = P.size * k.s, tE = k.dur - 0.5;
  // kunci: warna dikelola per huruf
  el.style.setProperty("--aksen", "inherit");
  BLOCK.onTime(tl, function (t) {
    var keluar = 1 - c((t - tE) / 0.45);
    u.forEach(function (e, i) {
      var w = a, wd = 100, sl = 0, op = 1, ty = 0, sz = 1, col = 0;
      if (m === "press") {
        op = c((t - P.start - i * 0.02) / 0.4);
        var sasaran = adaK ? kunci[i] : true, j = adaK ? i - kunci.indexOf(true) : i;
        var e1 = sasaran ? io(c((t - P.press_time - j * P.pause) / D)) : 0;
        w = a + (b - a) * e1; wd = 100 + 12 * e1; col = e1;
      } else if (m === "flex") {
        var e2 = oo(c((t - P.start - i * P.pause) / D));
        w = 100 + (b - 100) * e2; wd = 25 + 126 * e2; sz = 1.45 - 0.45 * e2;
        op = c((t - P.start - i * P.pause) / 0.2); ty = -0.25 * fs * (1 - e2);
        var hid = c((t - P.start - n * P.pause - D) / 0.6); wd -= 10 * hid * (0.5 + 0.5 * Math.sin(t * 2.4 + i * 0.5)); col = kunci[i] ? e2 : 0;
      } else {
        op = c((t - 0.1 - i * 0.015) / 0.35);
        var L = +P.wave_width, nu = Math.max(1, Math.round(P.repeat)), per = (tE - P.start - 0.1) / nu, ph = t - P.start;
        var g = 0;
        if (ph > 0 && ph < per * nu) { var cc = -L * 2 + (n + L * 4) * ((ph % per) / per); g = Math.exp(-Math.pow((i - cc) / L, 2)); }
        w = a + (b - a) * g; sl = P.skew ? -10 * g : 0; ty = -0.05 * fs * g; col = kunci[i] ? 1 : g * 0.6;
      }
      e.style.fontVariationSettings = '"wght" ' + w.toFixed(1) + ', "wdth" ' + wd.toFixed(1) + ', "slnt" ' + sl.toFixed(2);
      e.style.opacity = op * keluar;
      e.style.fontSize = sz === 1 ? "" : (sz * 100).toFixed(1) + "%";
      e.style.transform = ty ? "translateY(" + ty.toFixed(2) + "px)" : "";
      e.style.color = col > 0 ? BLOCK.mix(P.color, P.accent_color, col) : P.color;
    });
  }, k.dur);
  });
}, { font: true });
</script>
