<!-- Block text/background-words · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="text/background-words" data-start="0" data-duration="6" data-track-index="1" class="blk blk-text-background-words">
<script type="application/json" data-block-props>
{"text": "TENANG", "font": "Anton", "size": 560, "weight": 400, "color": "#ffffff", "contrast": 0.12, "style": "fill", "line_thickness": 2.5, "direction": "left", "slide": 10, "scale": 1.06, "position_y": 50, "mix": "normal"}
</script>
<div class="blk-kl"><div class="blk-isi"></div></div>
</div>
<style>
.blk-text-background-words {position:absolute;inset:0;pointer-events:none}
.blk-text-background-words {overflow:hidden}
.blk-text-background-words .blk-kl{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;line-height:.9}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.rata] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.lebar + "%;color:" + P.color + ";--aksen:" + P.warna_aksen +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var kl = k.root.querySelector(".blk-kl"), isi = kl.querySelector(".blk-isi");
  kl.style.cssText += ";top:" + P.position_y + "%;font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round(P.size * k.s) + "px";
  k.root.style.mixBlendMode = P.mix;
  isi.textContent = String(P.text).replace(/\*/g, "");
  if (P.style === "line") { isi.style.color = "transparent"; isi.style.webkitTextStroke = Math.max(1, P.line_thickness * k.s) + "px " + P.color; }
  else isi.style.color = P.color;
  var g = k.w * P.slide / 100 * (P.direction === "right" ? 1 : -1);
  tl.fromTo(isi, { x: -g / 2, scale: 1 }, { x: g / 2, scale: P.scale, duration: k.dur, ease: "none" }, 0);
  tl.fromTo(kl, { opacity: 0 }, { opacity: P.contrast, duration: 0.9, ease: "power1.out" }, 0);
  tl.to(kl, { opacity: 0, duration: 0.8, ease: "power1.in" }, k.dur - 0.8);
  });
}, { font: true });
</script>
