<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});
  }
  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), isi = el.querySelector(".blk-isi"), fb = k.root.querySelector("feGaussianBlur");
  gayaTeks(el);
  el.style.perspective = Math.round(1600 * k.s) + "px";
  isi.innerHTML = markupKunci(P.text);
  isi.style.filter = "url(#" + k.id + "-rana)";
  var t0 = +P.start, g = P.shake * k.s, W = k.w, H = k.h;
  var e3i = function (u) { return u * u * u; }, eo = function (u) { return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); };
  var io = gsap.parseEase("power3.inOut"), c = function (v) { return BLOCK.clamp(v, 0, 1); };
  var GUN = [[1, -0.6], [-0.7, 0.5], [0.35, -0.25]];
  var tE = k.dur - 0.5;
  function keadaan(t) {
    var s = { x: 0, y: 0, sc: 1, rx: 0, ry: 0, rz: 0, o: 1 };
    if (P.mode === "shutter") {
      var f = BLOCK.clamp((k.dur - 1.3) / 2.9, 0.5, 2), b = function (a) { return t0 + a * f; };
      var u1 = c((t - t0) / 0.32);
      s.x = -1.1 * W * (1 - eo(u1)); s.o = t < t0 ? 0 : 1;
      var u2 = c((t - b(0.6)) / 0.32); s.sc = 1 + 0.45 * Math.sin(Math.PI * Math.pow(u2, 0.6));
      s.rx = 360 * io(c((t - b(1.1)) / 0.45));
      s.ry = 360 * io(c((t - b(1.8)) / 0.45));
      s.rz = 360 * io(c((t - b(2.5)) / 0.42));
    } else {
      var tl0 = t0 + 0.36, u = c((t - t0) / 0.36);
      s.sc = 2.6 - 1.6 * e3i(u); s.o = c((t - t0) / 0.1);
      if (t >= tl0) {
        var n = Math.floor((t - tl0) * 30);
        if (n < 3) { s.x = GUN[n][0] * g; s.y = GUN[n][1] * g; s.sc = n === 0 ? 1.025 : 1; }
        var hu = c((t - tl0) / Math.max(0.1, tE - tl0)); s.sc *= 1 + 0.035 * hu; s.y -= 8 * k.s * hu;
      }
    }
    var v = c((t - tE) / 0.34);
    if (P.exit === "snap") s.y -= e3i(v) * H * 1.05;
    else if (P.exit === "fade") s.o *= 1 - v;
    return s;
  }
  BLOCK.onTime(tl, function (t) {
    var a = keadaan(t), p = keadaan(t - 1 / 40);
    isi.style.transform = "translate(" + a.x + "px," + a.y + "px) scale(" + a.sc + ") rotateX(" + a.rx + "deg) rotateY(" + a.ry + "deg) rotateZ(" + a.rz + "deg)";
    isi.style.opacity = a.o;
    var rot = (Math.abs(a.rx - p.rx) + Math.abs(a.ry - p.ry) + Math.abs(a.rz - p.rz)) * 0.12, sk = Math.abs(a.sc - p.sc) * 60;
    var bx = Math.min(80, Math.abs(a.x - p.x) * 0.35 + rot + sk) * P.shutter, by = Math.min(80, Math.abs(a.y - p.y) * 0.35 + rot + sk) * P.shutter;
    fb.setAttribute("stdDeviation", (Math.round(bx * 10) / 10) + " " + (Math.round(by * 10) / 10));
  }, k.dur);
  });
}, { font: true });
</script>
