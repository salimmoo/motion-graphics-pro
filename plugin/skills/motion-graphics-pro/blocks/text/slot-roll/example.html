<script>
BLOCK.mount("blk-slot-roll", function (k) {
  var P = k.P, tl = k.tl;
  var rata = { left: "left", right: "right" }[P.align] || "center";
  function gayaTeks(el, px) {
    el.style.cssText += ";top:" + P.position_y + "%;width:" + P.width + "%;color:" + P.color + ";--aksen:" + P.accent_color +
      ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight + ";font-size:" + Math.round((px || P.size) * k.s) + "px;text-align:" + rata;
  }
  // tunggu stylesheet Google Fonts + wajah font benar-benar termuat sebelum mengukur teks
  function siapFont(spec) {
    var ln = Array.prototype.slice.call(document.querySelectorAll('link[href*="fonts.googleapis"]'));
    return Promise.all(ln.map(function (l) { return l.sheet ? 0 : new Promise(function (ok) { l.addEventListener("load", ok); l.addEventListener("error", ok); }); }))
      .then(function () { return document.fonts && document.fonts.load ? document.fonts.load(spec || (P.weight + " 100px " + BLOCK.family(P.font))) : 0; })
      .catch(function () {});

  function markupKunci(s) { return BLOCK.esc(s).replace(/\*([^*]+)\*/g, '<span class="blk-kunci">$1</span>').replace(/\\n|\n/g, "<br>"); }
  return siapFont().then(function () {
  var el = k.root.querySelector(".blk-tk"), lb = el.querySelector(".blk-label"), isi = el.querySelector(".blk-isi");
  gayaTeks(el);
  if (P.label && P.mode === "roll") lb.textContent = P.label; else lb.remove();
  var fs = P.size * k.s, t0 = +P.start, D = +P.roll_duration;
  function reel(seq, wEm) {
    var r = BLOCK.el("span", { class: "blk-reel" }, isi), kol = BLOCK.el("div", { class: "blk-kol" }, r);
    if (wEm) r.style.width = wEm + "em";
    seq.forEach(function (c) { BLOCK.el("div", null, kol).textContent = c === " " ? " " : c; });
    return { r: r, kol: kol, n: seq.length };
  }
  if (P.mode !== "ticker") {
    var a = String(P.from), b = String(P.to), n = Math.max(a.length, b.length);
    while (a.length < n) a = " " + a; while (b.length < n) b = " " + b;
    var dig = /^[0-9 ]*$/.test(a + b), C = dig ? "0123456789" : " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      var ca = a[i].toUpperCase(), cb = b[i].toUpperCase(), ia = C.indexOf(ca), ib = C.indexOf(cb);
      if (ia < 0 || ib < 0) { var rr = reel([cb]); continue; }
      var L = C.length, steps = P.turns * L + ((ib - ia + L) % L), seq = [];

      BLOCK.initial(tl, R.kol, { y: -lh });
      tl.to(R.kol, { y: -(steps + 1) * lh, duration: D + dl, ease: "back.inOut(1.3)" }, t0);
      tl.to(R.kol, { filter: "blur(" + Math.round(5 * k.s) + "px)", duration: (D + dl) / 2, ease: "power2.in", yoyo: true, repeat: 1 }, t0);
      tl.fromTo(R.r, { color: P.accent_color }, { color: P.color, duration: 0.6, ease: "power1.out" }, t0 + D + dl);
    }
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.05);
  } else {
    var fk = P.ticker_size * k.s, pil = (P.options || []).map(String), np = pil.length, ulang = Math.max(1, Math.round(P.turns));
    isi.style.fontSize = fk + "px";
    var uk = BLOCK.el("span", { style: "position:absolute;visibility:hidden" }, isi), lw = 0;
    pil.forEach(function (s) { uk.textContent = s; lw = Math.max(lw, uk.offsetWidth); }); uk.remove();
    var wEm = (lw / fk) + 0.1, seq = [];
    for (var u = 0; u < ulang; u++) seq = seq.concat(pil);
    var kil = BLOCK.el("div", { class: "blk-kilat" }, isi);
    var R2 = reel(seq, wEm), last = seq.length - 1, tL = t0 + D;
    var lastEl = R2.kol.lastChild;
    // posisi kolom dalam persen supaya ikut membesar saat promosi
    tl.fromTo(R2.kol, { yPercent: 0 }, { yPercent: -100 * last / seq.length, duration: D, ease: "power3.inOut" }, t0);
    tl.fromTo(kil, { opacity: 0 }, { opacity: 0.95, duration: 0.07, ease: "none" }, tL);
    tl.to(kil, { opacity: 0, duration: 0.45, ease: "power2.out" }, tL + 0.1);
    tl.fromTo(lastEl, { color: P.color }, { color: P.accent_color, duration: 0.2 }, tL);
    var besar = Math.min(k.w * 0.88 / (wEm * fk), k.h * 0.42 / fk) * fk;
    tl.fromTo(isi, { fontSize: fk }, { fontSize: besar, duration: 0.85, ease: "expo.inOut" }, tL + 0.55);
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.05);
  }
  tl.to(el, { opacity: 0, duration: 0.4, ease: "power2.in" }, k.dur - 0.45);
  });
