<script type="application/json" data-block-props>
{"text": "CAHAYA PERTAMA", "color": "#ffffff", "hot_color": "#ff5a2a", "cold_color": "#3a7bff", "bg": "#000000", "font": "Archivo Black", "size": 140, "reveal_start": 0.4, "reveal_duration": 2.2, "ray_length": 1, "resolution": 0.75}
</script>

<style>
.blk-titles-light-cursor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
</style>
<script>
(function () {
// tunggu font benar-benar termuat sebelum mengukur teks (stylesheet Google Fonts + FontFace)
function blkTungguFont(spek, berat) {
  var fam = String(spek || "").split(":")[0];
  if (!fam || !document.fonts || !document.fonts.load) return Promise.resolve();
  var ls = Array.prototype.filter.call(document.querySelectorAll('link[href*="fonts.googleapis"]'), function (l) { return l.href.indexOf(fam.replace(/ /g, "+")) >= 0; });
  return Promise.all(ls.map(function (l) { return l.sheet ? 0 : new Promise(function (r) { l.addEventListener("load", r); l.addEventListener("error", r); }); }))
    .then(function () { return document.fonts.load((berat || 700) + ' 64px "' + fam + '"'); }).catch(function () {});
}
BLOCK.mount("blk-light-cursor", function (k) {
  return blkTungguFont(k.P.font, 400).then(function () { bangun(k); });
}, { font: true });
function bangun(k) {
  var P = k.P, tl = k.tl, s = k.s, D = k.dur, R = k.root, q = +P.resolution || 0.5;
  var W = Math.round(k.w * q), H = Math.round(k.h * q);
  var kv = BLOCK.canvas(R, W, H), ctx = kv.ctx;
  function buat(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  // topeng teks (sekali), lapis "terang" (per bingkai) dan dua salinan spektral
  var M = buat(W, H), mc = M.getContext("2d"), L = buat(W, H), lc = L.getContext("2d");
  var Rd = buat(W, H), rc = Rd.getContext("2d"), Bl = buat(W, H), bc = Bl.getContext("2d");
  var fam = BLOCK.family(P.font), teks = String(P.text);
  var fs = P.size * s * q;
  mc.font = fs + "px " + fam;
  var lebar = mc.measureText(teks).width;
  if (lebar > W * 0.8) { fs *= W * 0.8 / lebar; mc.font = fs + "px " + fam; lebar = mc.measureText(teks).width; }
  mc.textBaseline = "middle"; mc.textAlign = "center"; mc.fillStyle = "#fff"; mc.fillText(teks, W / 2, H / 2);
  var x0 = W / 2 - lebar / 2, x1 = W / 2 + lebar / 2, cy = H / 2, tinggi = fs * 0.8;
  var mulai = +P.reveal_start, lama = +P.reveal_duration;
  function ezio(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function warnai(c, cx, warna) {
    c.globalCompositeOperation = "source-over"; c.clearRect(0, 0, W, H);
    // hanya bagian kiri kursor yang terungkap, dengan tepi lembut
    var g = c.createLinearGradient(cx - fs * 0.5, 0, cx + fs * 0.05, 0); g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.drawImage(M, 0, 0); c.globalCompositeOperation = "destination-in"; c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = "source-in"; c.fillStyle = warna; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = "source-over";
  }
  function gambar(t) {
    var p = BLOCK.clamp((t - mulai) / lama, 0, 1), e = ezio(p), cx = x0 - fs * 0.3 + (x1 - x0 + fs * 0.5) * e;
    var cyk = cy + Math.sin(t * 2.1) * fs * 0.03;
    ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = P.bg || "#000"; ctx.fillRect(0, 0, W, H);
    // lapis terang: cahaya berarah dari kursor (dekat = putih panas, jauh = redup)
    var lg = ctx.createRadialGradient(cx, cyk, 0, cx, cyk, lebar * 0.9);
    lg.addColorStop(0, "#ffffff"); lg.addColorStop(0.18, P.color); lg.addColorStop(1, BLOCK.rgba(P.color, 0.42));
    warnai(lc, cx, lg); warnai(rc, cx, P.hot_color); warnai(bc, cx, P.cold_color);
    // sinar bayangan kromatik: salinan diperbesar dari titik kursor, merah sedikit lebih jauh dari biru
    var N = 18, pj = 0.011 * P.ray_length, kuat = 0.26 * (1 - 0.55 * Math.pow(p, 3)) + 0.06;
    ctx.globalCompositeOperation = "lighter";
    for (var i = N; i >= 1; i--) {
      var a = kuat * Math.pow(1 - i / (N + 1), 1.6) * 0.5;
      [[rc, 1.25], [bc, 0.8], [lc, 1]].forEach(function (c) {
        var sc = 1 + i * pj * c[1];
        ctx.globalAlpha = a * (c[0] === lc ? 0.6 : 1);
        ctx.setTransform(sc, 0, 0, sc, cx * (1 - sc), cyk * (1 - sc));
        ctx.drawImage(c[0].canvas, 0, 0);
      });
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    // teks utama + pinggiran spektral tipis
    ctx.globalAlpha = 0.7; ctx.drawImage(Rd, -1.5 * s, 0); ctx.drawImage(Bl, 1.5 * s, 0); ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over"; ctx.drawImage(L, 0, 0);
    // kursor: batang bercahaya + halo, berkedip setelah sampai
    var tiba = p >= 1, nyala = t < mulai - 0.2 ? BLOCK.progress(t, 0, mulai - 0.2) : (tiba ? (Math.floor((t - mulai - lama) * 2.4) % 2 === 0 ? 1 : 0.15) : 1);
    ctx.globalCompositeOperation = "lighter";
    var halo = ctx.createRadialGradient(cx, cyk, 0, cx, cyk, fs * 1.6);
    halo.addColorStop(0, BLOCK.rgba(P.hot_color, 0.55 * nyala)); halo.addColorStop(0.35, BLOCK.rgba(P.hot_color, 0.12 * nyala)); halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo; ctx.fillRect(cx - fs * 1.6, cyk - fs * 1.6, fs * 3.2, fs * 3.2);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BLOCK.rgba("#ffffff", nyala); ctx.fillRect(cx - fs * 0.035, cyk - tinggi / 2, fs * 0.07, tinggi);
    // vinyet
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.65)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  BLOCK.onTime(tl, gambar, D);
  tl.fromTo(kv.canvas, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, D - 0.5);
}
})();
</script>
