<!-- Block backgrounds/tunnel · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="backgrounds/tunnel" data-start="0" data-duration="8" data-track-index="0" class="blk blk-backgrounds-tunnel">
<script type="application/json" data-block-props>
{"color": ["#ff3d6e", "#ffb000", "#21c7a8", "#3a6bff", "#9b5cff"], "bg": "#07070c", "end_color": "#ffffff", "tile": 3, "speed": 1}
</script>
</div>
<style>
.blk-backgrounds-tunnel{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-backgrounds-tunnel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P;
  var K = BLOCK.canvas(k.root, k.w, k.h), x = K.ctx;
  var pal = (Array.isArray(P.color) && P.color.length) ? P.color : ["#ff3d6e", "#ffb000", "#21c7a8", "#3a6bff", "#9b5cff"];
  var M = Math.max(1, Math.round(+P.tile || 3)), JAUH = 14, DEKAT = 0.32, F = Math.min(k.w, k.h) * 0.62;
  function hs(a, b, c) { var s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); }
  // dinding: titik (u, z) -> 3D; u di -1..1 sepanjang lebar dinding
  var DIN = [function (u) { return [u, -1]; }, function (u) { return [1, u]; }, function (u) { return [-u, 1]; }, function (u) { return [-1, -u]; }];
  function gambar(t) {
    var cam = t * (+P.speed || 1) * 1.6, ox = k.w / 2 + Math.sin(t * 0.5) * 0.03 * k.w, oy = k.h / 2 + Math.cos(t * 0.37) * 0.025 * k.h;
    var rol = Math.sin(t * 0.3) * 0.05, cr = Math.cos(rol), sr = Math.sin(rol);
    function pr(X, Y, z) { var a = X * cr - Y * sr, b = X * sr + Y * cr; return [ox + a / z * F, oy - b / z * F]; }
    x.fillStyle = P.bg; x.fillRect(0, 0, k.w, k.h);
    var s0 = Math.floor(cam);
    for (var s = s0 + JAUH; s >= s0; s--) {
      var z0 = s - cam, z1 = z0 + 1; if (z1 <= DEKAT) continue; z0 = Math.max(z0, DEKAT);
      var kabut = BLOCK.smooth((z0 - 2) / (JAUH - 3));
      for (var w = 0; w < 4; w++) for (var j = 0; j < M; j++) {
        var u0 = -1 + 2 * j / M + 0.04, u1 = -1 + 2 * (j + 1) / M - 0.04, za = z0 + 0.04, zb = z1 - 0.04; if (zb <= za) continue;
        var h = hs(s, w, j), c = pal[Math.floor(h * pal.length) % pal.length];
        var A0 = DIN[w](u0), A1 = DIN[w](u1);
        var q = [pr(A0[0], A0[1], za), pr(A1[0], A1[1], za), pr(A1[0], A1[1], zb), pr(A0[0], A0[1], zb)];
        x.globalAlpha = 1; x.fillStyle = BLOCK.mix(c, P.bg, kabut * 0.92 + (w === 0 || w === 2 ? 0.08 : 0));
        x.beginPath(); x.moveTo(q[0][0], q[0][1]); for (var n = 1; n < 4; n++) x.lineTo(q[n][0], q[n][1]); x.closePath(); x.fill();
        // tekstur panel: garis-garis atau bingkai dalam, berganti per panel
        var um = (u0 + u1) / 2, zm = (za + zb) / 2, ui = (u1 - u0) * 0.32, zi = (zb - za) * 0.3;
        x.fillStyle = BLOCK.rgba("#ffffff", 0.16 * (1 - kabut));
        if (h > 0.5) {
          var B0 = DIN[w](um - ui), B1 = DIN[w](um + ui), r = [pr(B0[0], B0[1], zm - zi), pr(B1[0], B1[1], zm - zi), pr(B1[0], B1[1], zm + zi), pr(B0[0], B0[1], zm + zi)];
          x.beginPath(); x.moveTo(r[0][0], r[0][1]); for (n = 1; n < 4; n++) x.lineTo(r[n][0], r[n][1]); x.closePath(); x.fill();
        } else {
          for (var g = 0; g < 3; g++) {
            var ua = u0 + (u1 - u0) * (0.18 + g * 0.26), ub = ua + (u1 - u0) * 0.1, C0 = DIN[w](ua), C1 = DIN[w](ub);
            var e = [pr(C0[0], C0[1], za), pr(C1[0], C1[1], za), pr(C1[0], C1[1], zb), pr(C0[0], C0[1], zb)];
            x.beginPath(); x.moveTo(e[0][0], e[0][1]); for (n = 1; n < 4; n++) x.lineTo(e[n][0], e[n][1]); x.closePath(); x.fill();
          }
        }
      }
    }
    var p = pr(0, 0, 1), g2 = x.createRadialGradient(p[0], p[1], 0, p[0], p[1], F / JAUH * 2.2);
    g2.addColorStop(0, BLOCK.rgba(P.end_color, 0.95)); g2.addColorStop(0.5, BLOCK.rgba(P.end_color, 0.3)); g2.addColorStop(1, BLOCK.rgba(P.end_color, 0));
    x.fillStyle = g2; x.fillRect(0, 0, k.w, k.h);
  }
  BLOCK.onTime(k.tl, gambar, k.dur);
});
</script>
