<script>
BLOCK.mount("blk-aurora", function (k) {
  var P = k.P;
  var cv = BLOCK.el("canvas", { style: "position:absolute;inset:0;width:100%;height:100%" }, k.root);
  cv.width = Math.round(k.w * P.resolution); cv.height = Math.round(k.h * P.resolution);
  var sh = BLOCK.shader(cv, [
    "void main(){vec2 uv=gl_FragCoord.xy/u_res;float ar=u_res.x/u_res.y;vec2 p=vec2(uv.x*ar,uv.y);",
    "float t=u_t*u_kec;vec3 col=u_sky*(0.6+0.6*uv.y);",
    "for(int i=0;i<3;i++){float fi=float(i);",
    " float y0=0.45+0.1*fi+0.08*sin(p.x*1.3+t*0.35+fi*2.1)+0.12*(fbm(vec2(p.x*1.6+fi*3.,t*0.12))-0.5);",
    " float d=uv.y-y0;float band=smoothstep(-0.03,0.,d)*exp(-max(d,0.)*5.);",
    " float rays=0.45+0.55*fbm(vec2(p.x*9.+fi*7.,t*0.4+fi));",
    " vec3 c=mix(u_c1,u_c2,clamp(d*3.+0.2+0.3*sin(t*0.2+fi),0.,1.));",
    " col+=c*band*rays*u_kuat*(0.8-0.15*fi);}",
    "if(u_bintang>0.5){vec2 g=floor(gl_FragCoord.xy/2.);float s=h21(g);col+=vec3(step(0.997,s)*(0.6+0.4*sin(u_t*3.+s*90.)))*smoothstep(0.3,0.9,uv.y);}",
    "gl_FragColor=vec4(col,1.);}"
  ].join("\n"), { u_c1: BLOCK.vec3(P.color1), u_c2: BLOCK.vec3(P.color2), u_sky: BLOCK.vec3(P.sky), u_kec: +P.speed, u_kuat: +P.strength, u_bintang: P.star ? 1 : 0 });
  if (!sh.ok) { k.root.style.background = "linear-gradient(180deg," + P.sky + "," + P.color2 + "," + P.color1 + ")"; return; }
  BLOCK.onTime(k.tl, function (t) { sh.draw(t); }, k.dur);
});
</script>
