<!-- Block backgrounds/plasma · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="backgrounds/plasma" data-start="0" data-duration="8" data-track-index="0" class="blk blk-backgrounds-plasma">
<script type="application/json" data-block-props>
{"color1": "#0d0221", "color2": "#5b1fbf", "color3": "#e0a8ff", "scale": 3, "speed": 1, "resolution": 0.5}
</script>
</div>
<style>
.blk-backgrounds-plasma{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-backgrounds-plasma canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P;
  var cv = BLOCK.el("canvas", null, k.root);
  var r = Math.max(0.1, Math.min(1, +P.resolution || 0.5));
  cv.width = Math.round(k.w * r); cv.height = Math.round(k.h * r);
  var sh = BLOCK.shader(cv, [
    "void main(){vec2 p=(gl_FragCoord.xy-.5*u_res)/u_res.y*u_sk;float t=u_t*u_kec*.6;",
    "float v=sin(p.x+t)+sin(p.y*1.3-t*.8)+sin((p.x+p.y)*.7+t*.6)+sin(length(p+vec2(sin(t*.3),cos(t*.4))*2.)*2.-t);",
    "v+=2.2*fbm(p*.55+vec2(t*.12,-t*.08));float f=.5+.5*sin(v*1.15);",
    "vec3 col=mix(u_c1,u_c2,smoothstep(0.,.62,f));col=mix(col,u_c3,smoothstep(.62,1.,f));col+=u_c3*pow(f,9.)*.35;",
    "col+=(h21(gl_FragCoord.xy+fract(u_t))-0.5)/128.;gl_FragColor=vec4(col,1.);}"
  ].join("\n"), { u_c1: BLOCK.vec3(P.color1), u_c2: BLOCK.vec3(P.color2), u_c3: BLOCK.vec3(P.color3), u_sk: +P.scale, u_kec: +P.speed });
  if (!sh.ok) { cv.remove(); k.root.style.background = "radial-gradient(circle at 40% 40%," + P.color3 + "," + P.color2 + " 40%," + P.color1 + ")"; return; }
  BLOCK.onTime(k.tl, function (t) { sh.draw(t); }, k.dur);
});
</script>
