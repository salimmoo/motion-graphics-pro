<div data-composition-id="blk-gradient-mesh" data-block="backgrounds/gradient-mesh" data-start="0" data-duration="8" data-track-index="0" class="blk blk-backgrounds-gradient-mesh">
<script type="application/json" data-block-props>
{"style": "mesh", "color1": "#ff7a59", "color2": "#ffb347", "color3": "#7b5cff", "color4": "#2a1b5e", "speed": 1, "resolution": 0.5}

<style>
.blk-backgrounds-gradient-mesh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-backgrounds-gradient-mesh canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

</style>
<script>
BLOCK.mount("blk-gradient-mesh", function (k) {
  var P = k.P;
  var KEPALA = [
    "vec3 pal(float x){x=fract(x)*4.;vec3 a=u_c1,b=u_c2;if(x>=1.){a=u_c2;b=u_c3;}if(x>=2.){a=u_c3;b=u_c4;}if(x>=3.){a=u_c4;b=u_c1;}return mix(a,b,smoothstep(0.,1.,fract(x)));}",
    "void main(){vec2 uv=gl_FragCoord.xy/u_res;float ar=u_res.x/u_res.y;vec2 p=vec2(uv.x*ar,uv.y);float t=u_t*u_kec;vec3 col;"
  ].join("\n");
  var GAYA = {
    "mesh": [
    "p+=0.12*(vec2(vnoise(p*1.8+vec2(t*.15,0.)),vnoise(p*1.8+vec2(4.,t*.12)))-0.5);",
    "vec2 q1=vec2(ar*(.25+.12*sin(t*.31)),.3+.15*cos(t*.27));vec2 q2=vec2(ar*(.75+.1*cos(t*.23)),.25+.12*sin(t*.37+1.));",
    "vec2 q3=vec2(ar*(.7+.12*sin(t*.29+2.)),.78+.1*cos(t*.33));vec2 q4=vec2(ar*(.28+.1*cos(t*.21+3.)),.75+.12*sin(t*.25));",
    "float w1=exp(-dot(p-q1,p-q1)*5.),w2=exp(-dot(p-q2,p-q2)*5.),w3=exp(-dot(p-q3,p-q3)*5.),w4=exp(-dot(p-q4,p-q4)*5.);",
    "col=(u_c1*w1+u_c2*w2+u_c3*w3+u_c4*w4)/(w1+w2+w3+w4+1e-4);"
  ].join("\n"),
    "flow": [
    "float x=uv.x*.55+.22*sin(uv.y*3.+t*.5)+.35*fbm(p*1.1+vec2(t*.08,-t*.05))-t*.05;",
    "col=pal(x);col*=.9+.1*sin(uv.y*2.+x*6.);"
  ].join("\n"),
    "color-wheel": [
    "float h=uv.x*.55+.08*sin(uv.y*2.5+t*.3)+.05*fbm(p*1.5+t*.05)+t*.035;",
    "col=hsv2rgb(vec3(h,.62,.97));"
  ].join("\n"),
    "swirl": [
    "vec2 c=p-vec2(ar*.5,.5);float r=length(c);float a=atan(c.y,c.x)+2.2*exp(-r*1.6)*sin(t*.22)+t*.12+1.4*r;",
    "vec2 q=vec2(cos(a),sin(a))*r;float f=.5+.5*sin(q.x*4.5+t*.4+2.*fbm(q*1.5+t*.06))*cos(q.y*3.5-t*.3);",
    "col=pal(f*.5+.1*sin(t*.1));"
  ].join("\n"),
    "soft": [
    "vec2 b1=vec2(ar*(.32+.1*sin(t*.23)),.42+.12*cos(t*.19));vec2 b2=vec2(ar*(.7+.1*cos(t*.17+1.)),.6+.12*sin(t*.21+2.));",
    "col=u_c4;col=mix(col,u_c1,.85*smoothstep(.62,0.,length(p-b1)));col=mix(col,u_c3,.8*smoothstep(.55,0.,length(p-b2)));",
    "col=mix(col,u_c2,.35*smoothstep(.4,0.,length(p-(b1+b2)*.5)));"
  ].join("\n")
  };
  var EKOR = [
    "col*=1.-.18*length(uv-.5);col+=(h21(gl_FragCoord.xy+fract(u_t))-0.5)/128.;gl_FragColor=vec4(col,1.);}"
  ].join("\n");
  var cv = BLOCK.el("canvas", null, k.root);
  var r = Math.max(0.1, Math.min(1, +P.resolution || 0.5));
  cv.width = Math.round(k.w * r); cv.height = Math.round(k.h * r);
  var sh = BLOCK.shader(cv, KEPALA + "\n" + (GAYA[P.style] || GAYA["mesh"]) + "\n" + EKOR, { u_c1: BLOCK.vec3(P.color1), u_c2: BLOCK.vec3(P.color2), u_c3: BLOCK.vec3(P.color3), u_c4: BLOCK.vec3(P.color4), u_kec: +P.speed });
  if (!sh.ok) { cv.remove(); k.root.style.background = "linear-gradient(135deg," + P.color1 + "," + P.color2 + "," + P.color3 + "," + P.color4 + ")"; return; }
  BLOCK.onTime(k.tl, function (t) { sh.draw(t); }, k.dur);
});
</script>
