<!-- Block backgrounds/noise · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="backgrounds/noise" data-start="0" data-duration="8" data-track-index="0" class="blk blk-backgrounds-noise">
<script type="application/json" data-block-props>
{"style": "fractal", "color1": "#18181c", "color2": "#c8c8ce", "scale": 3, "speed": 1, "resolution": 0.5}
</script>
</div>
<style>
.blk-backgrounds-noise{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-backgrounds-noise canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P;
  var KEPALA = [
    "void main(){vec2 p=(gl_FragCoord.xy-.5*u_res)/u_res.y*u_sk;float t=u_t*u_kec;float v;"
  ].join("\n");
  var GAYA = {
    "fractal": [
    "vec2 q=vec2(fbm(p+vec2(t*.05,0.)),fbm(p+vec2(3.1,7.-t*.04)));v=fbm(p+1.8*q+vec2(t*.08,0.));v=smoothstep(.2,.85,v);"
  ].join("\n"),
    "gabor": [
    "float ang=3.1416*fbm(p*.35+vec2(t*.02,0.));vec2 dir=vec2(cos(ang),sin(ang));",
    "float s=sin(dot(p,dir)*24.+5.*vnoise(p*1.6)-t*1.2);float env=vnoise(p*1.3+vec2(t*.1,-t*.06));",
    "v=.5+.5*s*(.25+.75*env);v=mix(v,vnoise(p*9.+t*.3),.15);"
  ].join("\n")
  };
  var EKOR = [
    "vec3 col=mix(u_c1,u_c2,v);col+=(h21(gl_FragCoord.xy+fract(u_t))-0.5)/128.;gl_FragColor=vec4(col,1.);}"
  ].join("\n");
  var cv = BLOCK.el("canvas", null, k.root);
  var r = Math.max(0.1, Math.min(1, +P.resolution || 0.5));
  cv.width = Math.round(k.w * r); cv.height = Math.round(k.h * r);
  var sh = BLOCK.shader(cv, KEPALA + "\n" + (GAYA[P.style] || GAYA["fractal"]) + "\n" + EKOR, { u_c1: BLOCK.vec3(P.color1), u_c2: BLOCK.vec3(P.color2), u_sk: +P.scale, u_kec: +P.speed });
  if (!sh.ok) { cv.remove(); k.root.style.background = "linear-gradient(160deg," + P.color1 + "," + P.color2 + ")"; return; }
  BLOCK.onTime(k.tl, function (t) { sh.draw(t); }, k.dur);
});
</script>
