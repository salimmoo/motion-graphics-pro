<!-- Block textures/grain · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="textures/grain" data-start="0" data-duration="6" data-track-index="90" class="blk blk-textures-grain">
<script type="application/json" data-block-props>
{"mode": "film", "strength": 0.32, "grain_size": 2, "fps": 24, "mix": "overlay", "color": "#ffb070", "cycle": 6, "dot_spacing": 22, "seed": 11}
</script>
</div>
<style>
.blk-textures-grain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-textures-grain canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.blk-textures-grain .blk-hangat{position:absolute;inset:0;mix-blend-mode:soft-light}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, w = k.w, h = k.h, s = k.s, R = k.root, mode = P.mode, kuat = BLOCK.clamp(+P.strength || 0.3, 0, 1);
  if (mode === "dot") {
    // bidang titik beraksen yang hanyut di atas gradien luminans; berulang tepat per siklus
    var cv = BLOCK.canvas(R, w, h), c = cv.ctx, gp = Math.max(8, (+P.dot_spacing || 22) * s), S = Math.max(1, +P.cycle || 6);
    cv.canvas.style.mixBlendMode = "screen";
    BLOCK.onTime(k.tl, function (t) {
      var ph = Math.PI * 2 * t / S, dx = Math.cos(ph) * gp, dy = Math.sin(ph) * gp * 0.5;
      c.clearRect(0, 0, w, h);
      var g = c.createRadialGradient(w * (0.5 + 0.25 * Math.cos(ph)), h * (0.5 + 0.2 * Math.sin(ph)), 0, w / 2, h / 2, Math.max(w, h) * 0.8);
      g.addColorStop(0, BLOCK.rgba(P.color, 0.10 * kuat * 3)); g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.fillStyle = P.color;
      for (var y = -gp; y < h + gp; y += gp) for (var x = -gp; x < w + gp; x += gp) {
        var i = Math.round(x / gp), j = Math.round(y / gp);
        var v = 0.5 + 0.5 * Math.sin(i * 0.37 + j * 0.23 + ph) * Math.cos(j * 0.31 - i * 0.11 + ph * 2);
        var r = gp * 0.08 + gp * 0.16 * v;
        c.globalAlpha = BLOCK.clamp(kuat * (0.4 + 0.9 * v), 0, 1);
        c.beginPath(); c.arc(x + dx, y + dy, r, 0, 6.2832); c.fill();
      }
      c.globalAlpha = 1;
    }, k.dur);
    return;
  }
  // butir film: kanvas kecil diisi acak berseed per frame lalu diskalakan, pola berganti tiap 1/fps
  var ub = Math.max(1, +P.grain_size || 2), W = Math.ceil(w / ub), H = Math.ceil(h / ub);
  var cv2 = BLOCK.canvas(R, W, H), c2 = cv2.ctx, img = c2.createImageData(W, H), u32 = new Uint32Array(img.data.buffer);
  cv2.canvas.style.mixBlendMode = P.mix || "overlay";
  cv2.canvas.style.opacity = kuat;
  var tint = mode === "warm" ? BLOCK.hexToRgb(P.color) : [255, 255, 255];
  if (mode === "warm") BLOCK.el("div", { class: "blk-hangat", style: "background:radial-gradient(120% 100% at 50% 40%," + BLOCK.rgba(P.color, 0.35) + "," + BLOCK.rgba(P.color, 0.12) + " 60%,rgba(40,20,10,.35))" }, R);
  var fps = Math.max(1, +P.fps || 24), seed = (+P.seed || 11) >>> 0, akhir = -1;
  BLOCK.onTime(k.tl, function (t) {
    var f = Math.floor(t * fps + 1e-6);
    if (f === akhir) return; akhir = f; // frame sama -> pola sama, tidak perlu gambar ulang
    var r = BLOCK.random((seed * 7919 + f * 104729) >>> 0);
    for (var i = 0; i < u32.length; i++) {
      var v = (r() + r()) * 127.5; // mendekati sebaran normal: butir lebih organik
      u32[i] = (255 << 24) | ((v * tint[2] / 255) << 16) | ((v * tint[1] / 255) << 8) | (v * tint[0] / 255);
    }
    c2.putImageData(img, 0, 0);
  }, k.dur);
});
</script>
