<div data-composition-id="__ID__" data-block="textures/dither" data-start="0" data-duration="6" data-track-index="20" class="blk blk-textures-dither">
<script type="application/json" data-block-props>

<style>
.blk-textures-dither{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-textures-dither canvas{image-rendering:pixelated}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, w = k.w, h = k.h, D = k.dur, px = Math.max(1, Math.round((+P.pixel || 4) * k.s)), tegak = h > w;
  var C = Math.ceil(w / px), Rw = Math.ceil(h / px);
  // kanvas tidak memicu unduhan font: muat wajah font dulu, baru rasterisasi sumber
  var muat = document.fonts && document.fonts.load ? document.fonts.load("900 64px " + BLOCK.family(P.font)).catch(function () {}) : Promise.resolve();
  return muat.then(function () {
  // sumber digambar blok sendiri (bola bercahaya + teks), dirasterisasi sekali saat pasang
  var oc = document.createElement("canvas"); oc.width = C; oc.height = Rw;
  var o = oc.getContext("2d"), bg = o.createLinearGradient(0, 0, C, Rw);
  bg.addColorStop(0, "#1a1a1a"); bg.addColorStop(1, "#5a5a5a"); o.fillStyle = bg; o.fillRect(0, 0, C, Rw);
  if (P.ball) {
    var bx = C * (tegak ? 0.5 : 0.66), by = Rw * (tegak ? 0.36 : 0.46), br = Math.min(C, Rw) * (tegak ? 0.3 : 0.32);
    var gb = o.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.05, bx, by, br);
    gb.addColorStop(0, "#fff"); gb.addColorStop(0.6, "#8a8a8a"); gb.addColorStop(1, "#202020");
    o.fillStyle = gb; o.beginPath(); o.arc(bx, by, br, 0, Math.PI * 2); o.fill();
  }
  if (P.text) {
    var fs = Math.min(C, Rw) * (tegak ? 0.11 : 0.13);
    o.font = "900 " + fs + "px " + BLOCK.family(P.font); o.fillStyle = "#fff"; o.textBaseline = "middle";
    var kata = String(P.text).split(" "), tengah = Math.ceil(kata.length / 2), baris = [kata.slice(0, tengah).join(" "), kata.slice(tengah).join(" ")].filter(Boolean);
    o.textAlign = tegak ? "center" : "left";
    baris.forEach(function (b, i) { o.fillText(b, tegak ? C / 2 : C * 0.07, (tegak ? Rw * 0.74 : Rw * 0.42) + i * fs * 1.05); });
  }
  var src = o.getImageData(0, 0, C, Rw).data, L = new Float32Array(C * Rw), ks = +P.contrast || 1;
  for (var q = 0; q < L.length; q++) L[q] = BLOCK.clamp((src[q * 4] / 255 - 0.5) * ks + 0.5, 0, 1);
  // matriks Bayer 8x8 (ambang berurutan): tanpa difusi galat, setiap frame berdiri sendiri
  var B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], BY = new Float32Array(64);
  for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) BY[y * 8 + x] = (4 * B4[(y % 4) * 4 + (x % 4)] + [0, 2, 3, 1][((y >> 2) & 1) * 2 + ((x >> 2) & 1)] + 0.5) / 64;
  var cv = BLOCK.canvas(k.root, C, Rw), c = cv.ctx, img = c.createImageData(C, Rw), u32 = new Uint32Array(img.data.buffer);
  function abgr(hx) { var r = BLOCK.hexToRgb(hx); return ((255 << 24) | (r[2] << 16) | (r[1] << 8) | r[0]) >>> 0; }
  var G = abgr(P.dark_color), T = abgr(P.light_color), sd = (+P.seed || 2) >>> 0;
  var mul = +P.start || 0, dp = Math.max(0.1, +P.process_duration || 2), ez = gsap.parseEase("power2.inOut");
  function kemajuan(t) {
    if (P.mode === "hold") return 1;
    if (P.mode === "dissolve") return 1 - ez(BLOCK.progress(t, D - mul - dp, D - mul));
    return ez(BLOCK.progress(t, mul, mul + dp)); // muncul
  }
  BLOCK.onTime(k.tl, function (t) {
    var p = kemajuan(t), fr = Math.floor(t * (+P.noise_fps || 24)), hid = 0.04 * Math.sin(t * 1.3); // cahaya bernapas tipis
    for (var j = 0; j < Rw; j++) {
      var by8 = (j & 7) * 8;
      for (var i = 0; i < C; i++) {
        var idx = j * C + i, v = L[idx] + hid;
        if (p < 1) { // noise 2 nada berseed per frame, dicampur ke sumber sesuai kemajuan
          var hh = Math.imul(i * 374761393 + j * 668265263 + fr * 2246822519 + sd * 3266489917, 1274126177) >>> 0;
          hh = Math.imul(hh ^ (hh >>> 13), 1103515245) >>> 0;
          v = BLOCK.lerp((hh >>> 8) / 16777216, v, p);
        }
        u32[idx] = v > BY[by8 + (i & 7)] ? T : G;
      }
    }
    c.putImageData(img, 0, 0);
  }, D);
  });
}, { font: true });
</script>
