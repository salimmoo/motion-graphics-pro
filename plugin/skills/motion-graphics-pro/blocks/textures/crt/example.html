<script>
BLOCK.mount("blk-crt", function (k) {

    var sv = BLOCK.svg("svg", { width: 0, height: 0, style: "position:absolute" }, R);

    });
    BLOCK.svg("feBlend", { mode: "screen", in: "r", in2: "g", result: "rg" }, f);
    BLOCK.svg("feBlend", { mode: "screen", in: "rg", in2: "b" }, f);

  var fos = BLOCK.el("div", { style: "mix-blend-mode:screen;background:" + BLOCK.rgba(P.phosphor, P.phosphor_strength) }, R);

    BLOCK.el("div", { style: "border-radius:" + rd + "px/" + Math.round(rd * 1.2) + "px;box-shadow:0 0 0 " + Math.round(200 * s) + "px #050505,inset 0 0 " + Math.round(90 * s) + "px rgba(0,0,0,.75)" }, R);

  if (T) T.style.transformOrigin = "50% 50%";
  BLOCK.onTime(k.tl, function (t) {
    var fr = Math.floor(t * 30), j = N(fr * 0.37, sd); // kedip & jitter berganti per frame, terkendali

    var br = 1 + (+P.blink || 0) * j;

    }
    if (nyala) { nyala.style.opacity = (P.power_on ? (1 - BLOCK.progress(t, 0.1, 0.8)) * (t < 0.05 ? 0 : 1) : 0).toFixed(3); nyala.style.transform = "scale(1," + sy.toFixed(4) + ")"; }
    fos.style.opacity = (0.85 + 0.15 * j).toFixed(3);
    if (pita) pita.style.transform = "translate(0px," + (((t / 3.2) % 1) * 1.3 * h - 0.2 * h).toFixed(1) + "px)";
  }, D);
