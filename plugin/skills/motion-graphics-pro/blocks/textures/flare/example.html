<script>
BLOCK.mount("blk-flare", function (k) {
  var P = k.P, cv = BLOCK.el("canvas", null, k.root), rs = BLOCK.clamp(+P.resolution || 0.5, 0.2, 1);
  cv.width = Math.round(k.w * rs); cv.height = Math.round(k.h * rs);
  cv.style.mixBlendMode = P.mix || "screen";
  var sh = BLOCK.shader(cv, [
    "void main(){vec2 uv=gl_FragCoord.xy/u_res;float ar=u_res.x/u_res.y;vec2 p=vec2(uv.x*ar,uv.y);float t=u_t*u_kec;vec3 col=vec3(0.);",
    "if(u_mode<0.5){",
    // anamorfik: titik terang hanyut, masing-masing melempar garis horizontal panjang biru-ungu
    " for(int i=0;i<12;i++){float fi=float(i);if(fi>=u_jml)break;",
    "  vec2 h=h22(vec2(fi*7.13+u_seed,fi*3.71+1.3));",
    "  vec2 c=vec2((0.06+0.88*h.x)*ar+0.07*sin(t*0.21*(0.6+h.y)+fi),0.14+0.72*h.y+0.035*cos(t*0.27+fi*1.7));",
    "  float fl=0.72+0.28*sin(t*(1.3+h.x*2.1)+fi*4.1);vec2 d=p-c;",
    "  float core=0.0007/(dot(d,d)+0.0003);",
    "  float lebar=exp(-abs(d.y)*70.)*exp(-abs(d.x)*(1.4+2.*h.y));",
    "  float tipis=exp(-abs(d.y)*360.)*exp(-abs(d.x)*0.55);",
    "  col+=(vec3(1.,.97,.94)*core+u_warna*(lebar*0.5+tipis*0.9))*fl*(0.45+0.7*h.x);}",
    "}else{",
    // lensa: semburat bintang + halo pelangi tipis + hantu di sepanjang sumbu optik
    " vec2 c=vec2(u_px*ar,u_py)+0.015*vec2(sin(t*0.3),cos(t*0.23));vec2 d=p-c;float r=length(d);float a=atan(d.y,d.x);",
    " float core=0.0016/(r*r+0.0005);",
    " float rays=pow(abs(cos(a*3.+t*0.04)),40.)*0.8+pow(abs(cos(a*7.-t*0.03+1.)),70.)*0.5;",
    " rays*=exp(-r*2.6)*(0.65+0.35*vnoise(vec2(a*9.,t*0.7)));",
    " float R=0.36;float ring=exp(-pow((r-R)/0.03,2.));",
    " vec3 rb=hsv2rgb(vec3(fract((r-R)*7.+0.62),0.65,1.))*ring*0.22*(0.75+0.25*sin(a*5.+t*0.8));",
    " vec2 ax=vec2(0.5*ar,0.5)-c;vec3 g=vec3(0.);",
    " for(int j=0;j<5;j++){float fj=float(j);vec2 gp=c+ax*(0.7+fj*0.42);float gr=0.025+0.03*fract(fj*0.37+0.2);",
    "  g+=hsv2rgb(vec3(0.5+fj*0.11,0.55,1.))*smoothstep(gr,gr*0.6,length(p-gp))*0.1;}",
    " col=vec3(1.,.95,.88)*core*0.7+u_warna*core*0.4+mix(u_warna,vec3(1.),0.5)*rays+rb+g;",
    "}",
    "col*=u_int;col=1.-exp(-col*1.2);gl_FragColor=vec4(col,1.);}"
  ].join("\n"), { u_mode: P.mode === "lens" ? 1 : 0, u_warna: BLOCK.vec3(P.color), u_jml: +P.count || 7, u_int: +P.intensity || 1,
    u_px: +P.position_x, u_py: 1 - (+P.position_y), u_kec: +P.speed || 1, u_seed: +P.seed || 3 });
  if (!sh.ok) return;
  BLOCK.onTime(k.tl, function (t) {
    sh.draw(t, { u_int: (+P.intensity || 1) * BLOCK.smooth(BLOCK.progress(t, 0, +P.enter || 0.001)) });
  }, k.dur);
});
</script>
