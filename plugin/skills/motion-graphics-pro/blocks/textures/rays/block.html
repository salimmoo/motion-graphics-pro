<!-- Block textures/rays · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="textures/rays" data-start="0" data-duration="8" data-track-index="80" class="blk blk-textures-rays">
<script type="application/json" data-block-props>
{"mode": "light", "color": "#ffe2a8", "color2": "#0b1640", "bg": "", "count": 14, "origin_x": 0.08, "origin_y": 0.02, "speed": 1, "intensity": 0.9, "enter": 0.8, "resolution": 0.5}
</script>
</div>
<style>
.blk-textures-rays{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-textures-rays canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, cv = BLOCK.el("canvas", null, k.root), rs = BLOCK.clamp(+P.resolution || 0.5, 0.2, 1), smb = P.mode === "fringe";
  cv.width = Math.round(k.w * rs); cv.height = Math.round(k.h * rs);
  // cahaya tanpa latar = overlay screen; semburat atau latar terisi = lapisan opak
  var pakaiBg = smb || !!P.bg;
  cv.style.mixBlendMode = pakaiBg ? "normal" : "screen";
  var sh = BLOCK.shader(cv, [
    "void main(){vec2 uv=gl_FragCoord.xy/u_res;float ar=u_res.x/u_res.y;vec2 p=vec2(uv.x*ar,uv.y);vec2 o=vec2(u_ox*ar,u_oy);",
    "vec2 d=p-o;float r=length(d);float a=atan(d.y,d.x);float t=u_t*u_kec;vec3 col;",
    "if(u_mode<0.5){",
    // godrays: berkas bergaris dari satu titik (sudut), lebar & terang berkas hanyut pelan
    " float n=u_jml;float b1=fbm(vec2(a*n*0.55+t*0.05,t*0.08));float b2=vnoise(vec2(a*n*1.7-t*0.11,3.+t*0.05));",
    " float ray=smoothstep(0.42,0.85,b1)*0.85+smoothstep(0.55,0.95,b2)*0.45;",
    " float jatuh=exp(-r*0.9)*smoothstep(0.,0.08,r);float kab=0.25*exp(-r*1.6);",
    " vec3 c=u_c1*(ray*jatuh+kab)*u_int;",
    " col=u_pakai>0.5?u_bg*(0.6+0.5*(1.-uv.y))+c:c;",
    "}else{",
    // sunburst: jari-jari krem/hitam dari pusat yang berputar pelan, tepi dihaluskan
    " float n=max(2.,floor(u_jml));float f=fract(a/6.28318*n+t*0.02);float e=min(0.2,n/(6.283*max(r,0.002)*u_res.y)*1.2);",
    " float st=smoothstep(0.25-e,0.25+e,abs(f-0.5));",
    " col=mix(u_c1,u_c2,st);col*=0.85+0.3*exp(-r*1.5);col+=u_c1*0.25*exp(-r*5.)*u_int;",
    "}",
    "gl_FragColor=vec4(col,1.);}"
  ].join("\n"), { u_mode: smb ? 1 : 0, u_c1: BLOCK.vec3(P.color), u_c2: BLOCK.vec3(P.color2), u_bg: BLOCK.vec3(P.bg || P.color2), u_pakai: pakaiBg ? 1 : 0,
    u_jml: +P.count || 14, u_ox: smb ? 0.5 : +P.origin_x, u_oy: smb ? 0.5 : 1 - (+P.origin_y), u_kec: +P.speed || 1, u_int: +P.intensity || 1 });
  if (!sh.ok) return;
  if (!pakaiBg) BLOCK.initial(k.tl, cv, { opacity: 0 }).to(cv, { opacity: 1, duration: +P.enter || 0.01, ease: "power2.out" }, 0);
  BLOCK.onTime(k.tl, function (t) { sh.draw(t); }, k.dur);
});
</script>
