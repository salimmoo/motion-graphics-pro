<script>
BLOCK.mount("blk-hub", function (k) {

    o.w = o.el.offsetWidth; o.h = o.el.offsetHeight;

  });
  links.forEach(function (l) { l.el = BLOCK.svg("line", { stroke: l.tipis ? BLOCK.rgba(P.color, 0.28) : P.accent_color, "stroke-width": (l.tipis ? 1.2 : 2) * s, "stroke-linecap": "round" }, sv); });
