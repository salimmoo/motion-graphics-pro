<!-- Block accents/confetti · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-confetti" data-block="accents/confetti" data-start="0" data-duration="3.5" data-track-index="40" class="blk blk-accents-confetti">
<script type="application/json" data-block-props>
{"mode": "burst", "position_x": 50, "position_y": 62, "size": 16, "color": "#ffd23f", "accent_color": "#ff4d6d", "palette": ["#4cc9f0", "#7bd389", "#b388ff", "#ffffff"], "count": 160, "strength": 1, "gravity": 1, "spread": 65, "start": 0.15, "seed": 7}
</script>
</div>
<style>
.blk-accents-confetti{position:absolute;inset:0;pointer-events:none}
</style>
<script>
BLOCK.mount("blk-confetti", function (k) {
  var P = k.P, tl = k.tl, s = k.s, r = k.random, t0 = +P.start || 0;
  var kv = BLOCK.canvas(k.root, k.w, k.h), ctx = kv.ctx, W = k.w, H = k.h;
  var warna = [P.color, P.accent_color].concat(P.palette || []), g = 950 * s * P.gravity, ps = [];
  var sumber = P.mode === "cannon" ? [[0.02, 1.02, 28], [0.98, 1.02, -28]] : [[P.position_x / 100, P.position_y / 100, 0]];
  for (var i = 0; i < P.count; i++) {
    var p = { c: r.pick(warna), uk: P.size * s * r.range(0.6, 1.3), bentuk: r.int(0, 2), rot: r() * 6.28, spin: r.range(-9, 9),
      flip: r.range(6, 14), fase: r() * 6.28, goy: r.range(10, 40) * s, fg: r.range(2, 5), kd: r.range(1.8, 3), hidup: r.range(2.6, 3.8) };
    if (P.mode === "rain") {
      p.x0 = r() * W; p.y0 = -r.range(0.02, 0.25) * H; p.vx = r.range(-80, 80) * s; p.vy = r.range(0, 200) * s;
      p.t0 = t0 + r() * Math.max(0.3, k.dur * 0.5); p.kd = r.range(2.6, 3.6); p.hidup = 6;
    } else {
      var src = sumber[i % sumber.length], a = (src[2] + r.range(-1, 1) * P.spread * (P.mode === "cannon" ? 0.3 : 1)) * Math.PI / 180;
      var v = r.range(0.45, 1) * (P.mode === "cannon" ? 2600 : 2100) * s * P.strength;
      p.x0 = src[0] * W; p.y0 = src[1] * H; p.vx = Math.sin(a) * v; p.vy = -Math.cos(a) * v; p.t0 = t0 + r() * 0.06;
    }
    ps.push(p);
  }
  // rumus tertutup: v' = g - kd v  ->  posisi analitik dari dt, tanpa akumulasi antar frame
  BLOCK.onTime(tl, function (t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(function (p) {
      var dt = t - p.t0; if (dt <= 0 || dt > p.hidup) return;
      var e = 1 - Math.exp(-p.kd * dt), vt = g / p.kd;
      var x = p.x0 + p.vx * e / p.kd + Math.sin(dt * p.fg + p.fase) * p.goy * Math.min(1, dt);
      var y = p.y0 + vt * dt + (p.vy - vt) * e / p.kd;
      if (y > H + 40 * s) return;
      var a = BLOCK.clamp((p.hidup - dt) / 0.5, 0, 1);
      ctx.globalAlpha = a; ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.spin * dt); ctx.scale(1, Math.cos(dt * p.flip + p.fase));
      if (p.bentuk === 0) ctx.fillRect(-p.uk / 2, -p.uk * 0.3, p.uk, p.uk * 0.6);
      else if (p.bentuk === 1) ctx.fillRect(-p.uk * 0.15, -p.uk * 0.7, p.uk * 0.3, p.uk * 1.4);
      else { ctx.beginPath(); ctx.arc(0, 0, p.uk * 0.38, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }, k.dur);
});
</script>
