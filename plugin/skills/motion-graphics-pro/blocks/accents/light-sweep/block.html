<!-- Block accents/light-sweep · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="accents/light-sweep" data-start="0" data-duration="3.5" data-track-index="40" class="blk blk-accents-light-sweep">
<script type="application/json" data-block-props>
{"mode": "across", "element": "#adegan .kartu, #adegan .tombol", "position_x": 50, "position_y": 50, "size": 640, "color": "#fff4dc", "accent_color": "#6d4dff", "text": "Pencapaian Baru", "small_text": "Level 12 terbuka", "font": "Inter:wght@600;800", "radius": 22, "strength": 0.6, "start": 0.3, "sweep_duration": 1.6, "ease": "power2.inOut"}
</script>
<div class="blk-bayang"></div>
<div class="blk-pita"></div>
</div>
<style>
.blk-accents-light-sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-accents-light-sweep .blk-bayang{position:absolute;inset:0;mix-blend-mode:multiply}
.blk-accents-light-sweep .blk-pita{position:absolute;top:-60%;height:220%;width:34%;mix-blend-mode:screen}
.blk-accents-light-sweep .blk-kartu{position:absolute;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}
.blk-accents-light-sweep .blk-kilap{position:absolute;top:-30%;height:160%;width:38%;left:0}
.blk-accents-light-sweep .blk-kartu b,.blk-accents-light-sweep .blk-kartu i{position:relative;display:block;font-style:normal;color:#fff;white-space:nowrap}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, t0 = +P.start || 0, D = +P.sweep_duration || 1.6;
  var bay = root.querySelector(".blk-bayang"), pita = root.querySelector(".blk-pita"), ez = gsap.parseEase(P.ease);
  if (P.mode === "gloss") {
    bay.remove(); pita.remove();
    // kartu mendarat dengan hentakan terkendali, menangkap satu kilap diagonal, lalu diam
    var W = P.size * s, H = W * 0.56, R = Math.round(W * 0.06);
    var kar = BLOCK.el("div", { class: "blk-kartu", style: "left:calc(" + P.position_x + "% - " + W / 2 + "px);top:calc(" + P.position_y + "% - " + H / 2 + "px);width:" + W + "px;height:" + H + "px;border-radius:" + R +
      "px;padding:" + Math.round(W * 0.07) + "px;font-family:" + BLOCK.family(P.font) + ";background:linear-gradient(135deg," + BLOCK.mix(P.accent_color, "#ffffff", 0.18) + "," + P.accent_color + " 55%," + BLOCK.mix(P.accent_color, "#000000", 0.35) +
      ");box-shadow:0 " + Math.round(W * 0.05) + "px " + Math.round(W * 0.12) + "px rgba(0,0,0,.4)" }, root);
    BLOCK.el("i", { style: "font-weight:600;font-size:" + Math.round(W * 0.05) + "px;opacity:.8;margin-bottom:" + Math.round(W * 0.02) + "px" }, kar).textContent = P.small_text;
    BLOCK.el("b", { style: "font-weight:800;font-size:" + Math.round(W * 0.085) + "px" }, kar).textContent = P.text;
    var kl = BLOCK.el("div", { class: "blk-kilap", style: "background:linear-gradient(90deg,transparent," + BLOCK.rgba(P.color, P.strength) + " 50%,transparent);transform:skewX(-" + P.radius + "deg)" }, kar);
    tl.fromTo(kar, { scale: 1.3, opacity: 0, rotation: -3 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.32, ease: "power4.in" }, t0)
      .to(kar, { scale: 0.975, duration: 0.07, ease: "power2.out" }, t0 + 0.32)
      .to(kar, { scale: 1, duration: 0.3, ease: "power3.out" }, t0 + 0.39)
      .fromTo(kl, { xPercent: -160 }, { xPercent: 330, duration: Math.min(D, 0.9), ease: P.ease }, t0 + 0.55);
    return;
  }
  // lintas: satu --light-x menggerakkan pita cahaya, bayangan global, dan sorot/bayang tiap elemen host sekaligus
  var el = [];
  try { el = P.element ? Array.prototype.slice.call(document.querySelectorAll(P.element)) : []; } catch (e) { el = []; }
  var rr = root.getBoundingClientRect(), info = el.map(function (e) { var r = e.getBoundingClientRect(); return { e: e, cx: (r.left - rr.left + r.width / 2) / rr.width, f: e.style.filter, b: e.style.boxShadow }; });
  pita.style.background = "linear-gradient(90deg,transparent," + BLOCK.rgba(P.color, P.strength * 0.5) + " 35%," + BLOCK.rgba(P.color, P.strength) + " 50%," + BLOCK.rgba(P.color, P.strength * 0.5) + " 65%,transparent)";
  BLOCK.onTime(tl, function (t) {
    var p = BLOCK.clamp((t - t0) / D, 0, 1), on = BLOCK.smooth(BLOCK.progress(t, t0 - 0.25, t0 + 0.15));
    var settle = BLOCK.smooth(BLOCK.progress(t, t0 + D, t0 + D + 0.7));
    var lx = BLOCK.lerp(BLOCK.lerp(-0.3, 1.3, ez(p)), 0.78, settle), band = on * (1 - settle * 0.75);
    root.style.setProperty("--light-x", lx.toFixed(4));
    pita.style.left = ((lx - 0.17) * 100).toFixed(2) + "%";
    pita.style.transform = "rotate(" + P.radius + "deg)";
    pita.style.opacity = band.toFixed(3);
    var gelap = (0.2 * P.strength * on).toFixed(3), L = (lx * 100).toFixed(1);
    bay.style.background = "linear-gradient(90deg,rgba(0,0,0," + gelap + ") " + (lx * 100 - 70).toFixed(1) + "%,rgba(0,0,0,0) " + (lx * 100 - 18).toFixed(1) + "%,rgba(0,0,0,0) " + (lx * 100 + 18).toFixed(1) + "%,rgba(0,0,0," + gelap + ") " + (lx * 100 + 70).toFixed(1) + "%)";
    info.forEach(function (o) {
      var d = o.cx - lx, dekat = Math.exp(-d * d * 18) * on;
      o.e.style.filter = "brightness(" + (1 + 0.22 * dekat * P.strength).toFixed(3) + ")";
      o.e.style.boxShadow = (BLOCK.clamp(d, -0.6, 0.6) * 60 * s * on).toFixed(1) + "px " + Math.round(18 * s * on) + "px " + Math.round(40 * s) + "px rgba(10,20,50," + (0.22 * on).toFixed(3) + ")";
      if (on <= 0) { o.e.style.filter = o.f; o.e.style.boxShadow = o.b; }
    });
  }, k.dur);
}, { font: true });
</script>
