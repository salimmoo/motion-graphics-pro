<script>
BLOCK.mount("blk-facet-morph", function (k) {
  var P = k.P, tl = k.tl, s = k.s, R = k.root, sv = R.querySelector(".blk-svg");
  sv.setAttribute("viewBox", "0 0 " + k.w + " " + k.h);
  var cx = k.w * P.position_x / 100, cy = k.h * P.position_y / 100, Rr = P.size * s, M = 12, TAU = Math.PI * 2;
  // tiga siluet: radius tepi luar sebagai fungsi sudut
  var bentuk = {
    gumpal: function (a, i) { return 1 + 0.1 * Math.sin(3 * a + 1) + 0.06 * Math.cos(5 * a); },
    tanda: function (a, i) { return i % 2 ? 0.56 : 1.06; },
    lencana: function (a) { var m = ((a % (TAU / 6)) + TAU / 6) % (TAU / 6) - TAU / 12; return 0.98 * Math.cos(TAU / 12) / Math.cos(m); }
  };
  var urut = (P.order || ["gumpal", "tanda", "lencana"]).filter(function (n) { return bentuk[n]; });
  if (!urut.length) urut = ["gumpal"];
  function titik(nama) {      // 25 simpul: pusat, cincin dalam (12), cincin luar (12); [x, y, z]
    var f = bentuk[nama], v = [[0, 0, 0.95]];
    for (var i = 0; i < M; i++) { var a = -Math.PI / 2 + (i + 0.5) / M * TAU, r = f(a, i) * (nama === "tanda" ? 0.4 : 0.52); v.push([Math.cos(a) * r, Math.sin(a) * r, 0.5]); }
    for (var j = 0; j < M; j++) { var b = -Math.PI / 2 + j / M * TAU, q = f(b, j); v.push([Math.cos(b) * q, Math.sin(b) * q, 0.02]); }
    return v;
  }
  var V = urut.map(titik);
  var tri = [];                // 12 kipas pusat + 24 pita = 36 segitiga
  for (var i = 0; i < M; i++) {
    var a = 1 + i, b = 1 + (i + 1) % M, o0 = 1 + M + (i + 1) % M, o1 = 1 + M + (i + 2) % M;
    tri.push([0, a, b], [a, o0, b], [b, o0, o1]);
  }
  var polys = tri.map(function () { return BLOCK.svg("polygon", { "stroke-linejoin": "round" }, sv); });
  var L = [-0.52, -0.62, 0.58], Ln = Math.hypot(L[0], L[1], L[2]); L = L.map(function (c) { return c / Ln; });
  var n = V.length, t0 = 0.2, seg = (k.dur - 0.9) / Math.max(n, 1), mf = P.morph_amount, ez = gsap.parseEase("power2.inOut"), eb = gsap.parseEase("back.out(1.4)");
  BLOCK.onTime(tl, function (t) {
    // indeks siluet + campuran morph: tahan, lalu morph ke siluet berikutnya
    var f = BLOCK.clamp((t - t0) / seg, 0, n - 1), i0 = Math.min(Math.floor(f), n - 1), u = f - i0, i1 = Math.min(i0 + 1, n - 1);
    var m = ez(BLOCK.progress(u, 1 - mf, 1)), A = V[i0], B = V[i1];
    var rot = (t * P.rotate) * Math.PI / 180, cr = Math.cos(rot), sr = Math.sin(rot);
    var masuk = eb(BLOCK.progress(t, 0, 0.8)), keluar = 1 - ez(BLOCK.progress(t, k.dur - 0.5, k.dur - 0.05)), sc = Rr * masuk * keluar;
    var P3 = A.map(function (a, j) {
      var b = B[j], x = a[0] + (b[0] - a[0]) * m, y = a[1] + (b[1] - a[1]) * m, z = a[2] + (b[2] - a[2]) * m;
      var w = 1 + BLOCK.noise(t * 0.8 + j * 1.7, 5) * 0.025;             // napas halus agar bayangan terus berubah
      z += BLOCK.noise(t * 0.6 + j * 2.3, 8) * 0.08;
      return [cx + (x * cr - y * sr) * sc * w, cy + (x * sr + y * cr) * sc * w, z * sc * 0.9];
    });
    polys.forEach(function (pg, q) {
      var T = tri[q], p = P3[T[0]], a = P3[T[1]], b = P3[T[2]];
      var ux = a[0] - p[0], uy = a[1] - p[1], uz = a[2] - p[2], vx = b[0] - p[0], vy = b[1] - p[1], vz = b[2] - p[2];
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, nl = Math.hypot(nx, ny, nz) || 1;
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      var br = BLOCK.clamp((nx * L[0] + ny * L[1] + nz * L[2]) / nl, 0, 1), lit = Math.pow(br, 1.6);
      // faset yang terang sedikit terangkat ke arah cahaya
      var lx = L[0] * lit * 6 * s, ly = L[1] * lit * 6 * s;
      pg.setAttribute("points", [p, a, b].map(function (c) { return (c[0] + lx).toFixed(1) + "," + (c[1] + ly).toFixed(1); }).join(" "));
      var col = BLOCK.mix(P.dark_color, P.light_color, lit);
      pg.setAttribute("fill", col); pg.setAttribute("stroke", col); pg.setAttribute("stroke-width", 0.8);
    });
  }, k.dur);
}, {});
