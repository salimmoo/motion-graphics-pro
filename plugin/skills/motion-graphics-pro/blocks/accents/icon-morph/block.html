<!-- Block accents/icon-morph · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="accents/icon-morph" data-start="0" data-duration="3.5" data-track-index="40" class="blk blk-accents-icon-morph">
<script type="application/json" data-block-props>
{"mode": "morph", "icon": ["putar", "jeda", "centang"], "position_x": 50, "position_y": 45, "size": 220, "color": "#ffffff", "accent_color": "#22d3a6", "bg_color": "#1f2433", "bg": true, "start": 0.5, "pause": 0.9, "morph_duration": 0.45}
</script>
<div class="blk-pos"><div class="blk-denyut"></div><div class="blk-tombol"></div></div>
</div>
<style>
.blk-accents-icon-morph{position:absolute;inset:0;pointer-events:none}
.blk-accents-icon-morph .blk-pos{position:absolute;width:0;height:0}
.blk-accents-icon-morph .blk-tombol,.blk-accents-icon-morph .blk-denyut{position:absolute;border-radius:50%}
.blk-accents-icon-morph svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, U = P.size * s;
  var pos = root.querySelector(".blk-pos"), btn = root.querySelector(".blk-tombol"), den = root.querySelector(".blk-denyut");
  pos.style.left = P.position_x + "%"; pos.style.top = P.position_y + "%";
  [btn, den].forEach(function (e) { e.style.cssText += ";left:" + (-U / 2) + "px;top:" + (-U / 2) + "px;width:" + U + "px;height:" + U + "px"; });
  if (P.bg) btn.style.cssText += ";background:" + P.bg_color + ";box-shadow:0 " + Math.round(U * 0.08) + "px " + Math.round(U * 0.25) + "px rgba(0,0,0,.35)";
  den.style.border = Math.round(U * 0.03) + "px solid " + P.accent_color; den.style.opacity = 0;
  // setiap ikon = 2 segi empat (8 titik) supaya bisa dimorph titik demi titik tanpa plugin
  function batang(a, b, c, d, h) { var dx = c - a, dy = d - b, L = Math.hypot(dx, dy), nx = -dy / L * h, ny = dx / L * h; return [[a + nx, b + ny], [c + nx, d + ny], [c - nx, d - ny], [a - nx, b - ny]]; }
  function putarT(q, deg) { var r = deg * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r); return q.map(function (p) { var x = p[0] - 50, y = p[1] - 50; return [50 + x * c - y * sn, 50 + x * sn + y * c]; }); }
  var plus = [[[44, 18], [56, 18], [56, 82], [44, 82]], [[18, 44], [82, 44], [82, 56], [18, 56]]];
  var IK = {
    jeda: [[[30, 22], [44, 22], [44, 78], [30, 78]], [[56, 22], [70, 22], [70, 78], [56, 78]]],
    putar: [[[34, 20], [58, 35], [58, 65], [34, 80]], [[58, 35], [82, 50], [82, 50], [58, 65]]],
    plus: plus, silang: plus.map(function (q) { return putarT(q, 45); }),
    centang: [batang(24, 52, 42, 70, 6), batang(38, 74, 78, 33, 6)],
    minus: [[[18, 44], [50, 44], [50, 56], [18, 56]], [[50, 44], [82, 44], [82, 56], [50, 56]]],
    unduh: [[[44, 16], [56, 16], [56, 58], [44, 58]], [[24, 46], [76, 46], [50, 76], [50, 76]]]
  };
  var daftar = (P.icon || []).map(function (n) { return IK[n] || IK.plus; }); if (!daftar.length) daftar = [IK.plus];
  var d = function (Q) { return Q.map(function (q) { return "M" + q.map(function (p) { return p[0].toFixed(2) + " " + p[1].toFixed(2); }).join("L") + "Z"; }).join(""); };
  var dalam = BLOCK.el("div", { style: "position:absolute;left:" + (-U * 0.3) + "px;top:" + (-U * 0.3) + "px;width:" + U * 0.6 + "px;height:" + U * 0.6 + "px" }, pos);
  var sv = BLOCK.svg("svg", { viewBox: "0 0 100 100" }, dalam), N = daftar.length;
  var T = daftar.map(function (_, i) { return P.start + (i + 1) * P.pause; }).slice(0, N - 1), dm = +P.morph_duration || 0.45;
  var io = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var jalur = P.mode === "swap" ? daftar.map(function (Q) { return BLOCK.svg("path", { d: d(Q) }, sv); }) : [BLOCK.svg("path", {}, sv)];
  tl.fromTo(pos, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, Math.max(0, P.start - 0.4));
  var tAkhir = T.length ? T[T.length - 1] + dm : P.start;
  BLOCK.onTime(tl, function (t) {
    var pf = N > 1 ? io(BLOCK.progress(t, T[N - 2], T[N - 2] + dm)) : 1, warna = BLOCK.mix(P.color, P.accent_color, pf);
    if (P.mode === "swap") {
      // tukar: ikon lama mengecil + kabur, ikon baru membesar dari kabur ke tajam
      jalur.forEach(function (p, j) {
        var ain = j === 0 ? 1 : BLOCK.progress(t, T[j - 1] + 0.08, T[j - 1] + 0.38), aout = j < N - 1 ? BLOCK.progress(t, T[j], T[j] + 0.22) : 0;
        var a = ain * (1 - aout), sc = j === 0 && !aout ? 1 : (aout > 0 ? 1 - 0.45 * aout : 0.55 + 0.45 * BLOCK.spring(ain * 0.8, 1.6, 0.45));
        p.style.opacity = a.toFixed(3); p.style.fill = j === N - 1 ? warna : P.color;
        p.style.transformOrigin = "50px 50px"; p.style.transform = "scale(" + sc.toFixed(3) + ")";
        p.style.filter = "blur(" + (8 * (1 - ain + aout)).toFixed(2) + "px)";
      });
    } else {
      // morph: interpolasi titik antar keadaan, dengan sedikit "tarikan" skala di tengah morph
      var Q = daftar[0], dip = 0;
      for (var i = 0; i < T.length; i++) {
        var f = io(BLOCK.progress(t, T[i], T[i] + dm));
        if (f > 0) { var A = Q, B = daftar[i + 1]; Q = A.map(function (q, qi) { return q.map(function (p, pi) { return [p[0] + (B[qi][pi][0] - p[0]) * f, p[1] + (B[qi][pi][1] - p[1]) * f]; }); }); dip = Math.max(dip, Math.sin(Math.PI * f)); }
      }
      jalur[0].setAttribute("d", d(Q)); jalur[0].style.fill = warna;
      dalam.style.transform = "scale(" + (1 - 0.1 * dip).toFixed(3) + ")";
    }
    // satu denyut penanda selesai
    var dp = t - tAkhir, pp = BLOCK.clamp(dp / 0.6, 0, 1);
    den.style.opacity = dp > 0 && dp < 0.6 ? (0.9 * (1 - pp)).toFixed(3) : "0";
    den.style.transform = "scale(" + (1 + 0.5 * (1 - Math.pow(1 - pp, 3))).toFixed(3) + ")";
    btn.style.transform = "scale(" + (1 + 0.08 * Math.sin(Math.PI * BLOCK.clamp(dp / 0.35, 0, 1))).toFixed(3) + ")";
  }, k.dur);
});
</script>
