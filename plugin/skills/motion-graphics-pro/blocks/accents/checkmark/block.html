<!-- Block accents/checkmark · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="accents/checkmark" data-start="0" data-duration="3" data-track-index="40" class="blk blk-accents-checkmark">
<script type="application/json" data-block-props>
{"position_x": 50, "position_y": 45, "size": 220, "color": "#22c55e", "accent_color": "#ffffff", "text": "Berhasil disimpan", "font": "Inter:wght@600;700", "fill": true, "start": 0.3, "exit": true}
</script>
<div class="blk-pos"><div class="blk-ikon"></div><div class="blk-label"></div></div>
</div>
<style>
.blk-accents-checkmark{position:absolute;inset:0;pointer-events:none}
.blk-accents-checkmark .blk-pos{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.blk-accents-checkmark .blk-ikon svg{display:block;overflow:visible}
.blk-accents-checkmark .blk-label{white-space:nowrap;font-weight:700;line-height:1}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, t0 = +P.start || 0;
  var pos = root.querySelector(".blk-pos"), ikon = root.querySelector(".blk-ikon"), lab = root.querySelector(".blk-label");
  var U = Math.round(P.size * s);
  pos.style.left = P.position_x + "%"; pos.style.top = P.position_y + "%";
  var sv = BLOCK.svg("svg", { viewBox: "0 0 100 100", width: U, height: U }, ikon);
  var gel = BLOCK.svg("circle", { cx: 50, cy: 50, r: 44, fill: "none", stroke: P.color, "stroke-width": 3 }, sv);
  var isi = BLOCK.svg("circle", { cx: 50, cy: 50, r: 44, fill: P.fill ? P.color : "none" }, sv);
  var ring = BLOCK.svg("circle", { cx: 50, cy: 50, r: 44, fill: "none", stroke: P.color, "stroke-width": 6, "stroke-linecap": "round", transform: "rotate(-90 50 50)" }, sv);
  var cek = BLOCK.svg("path", { d: "M29 52 L44 66 L72 37", fill: "none", stroke: P.fill ? P.accent_color : P.color, "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, sv);
  var Lr = BLOCK.prepareStroke(ring), Lc = BLOCK.prepareStroke(cek);
  sv.style.filter = "drop-shadow(0 " + Math.round(U * 0.06) + "px " + Math.round(U * 0.14) + "px " + BLOCK.rgba(P.color, 0.45) + ")";
  if (P.text) {
    lab.textContent = P.text;
    lab.style.cssText += ";margin-top:" + Math.round(U * 0.16) + "px;font-family:" + BLOCK.family(P.font) + ";font-size:" + Math.round(U * 0.2) + "px;color:#ffffff;text-shadow:0 2px 12px rgba(0,0,0,.45)";
  }
  // masuk dengan putar + blur kecil, cincin tergambar, isi meletup, centang tergores
  tl.fromTo(ikon, { scale: 0.55, rotation: -28, opacity: 0, filter: "blur(6px)" }, { scale: 1, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.8)" }, t0)
    .fromTo(ring, { strokeDashoffset: Lr }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, t0)
    .fromTo(isi, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t0 + 0.3)
    .fromTo(cek, { strokeDashoffset: Lc }, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, t0 + 0.48)
    .fromTo(gel, { scale: 1, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 1.45, opacity: 0, duration: 0.6, ease: "power2.out" }, t0 + 0.75)
    .fromTo(ikon, { y: 0 }, { y: -4 * s, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((k.dur - t0 - 1.5) / 0.9)) }, t0 + 0.6);
  if (P.text) tl.fromTo(lab, { opacity: 0, y: 14 * s }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t0 + 0.6);
  if (P.exit) tl.to(pos, { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" }, k.dur - 0.35);
}, { font: true });
</script>
