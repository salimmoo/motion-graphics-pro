<style>
.blk-accents-light-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blk-accents-light-particles .blk-wadah{position:absolute;inset:0}
.blk-accents-light-particles canvas{position:absolute;inset:0;width:100% !important;height:100% !important}

<script>
BLOCK.mount("blk-light-particles", function (k) {
var P = k.P;
  if (!window.MGP || !MGP.particlesFlight) { console.error("[blok] accents/light-particles needs lib:mgp.js"); return; }
  // ukuran logis: sisi pendek 720 (skala rancangan modul), piksel kanvas = resolusi penuh lewat dpr
  var f = Math.min(k.w, k.h) / 720, W = Math.round(k.w / f), H = Math.round(k.h / f);
  var wadah = BLOCK.el("div", { class: "blk-wadah" }, k.root);
  var rg = +P.image_aspect || 1.5, sw = W * P.width / 100, shh = sw / rg;
  if (shh > H * 0.7) { shh = H * 0.7; sw = shh * rg; }
  var cx = W * P.position_x / 100, cy = H * P.position_y / 100, R = k.random, t1 = +P.open_start, rad = P.radius * k.s;
  // bingkai gambar (DOM, di bawah kanvas partikel)
  var slot = BLOCK.el("div", { class: "blk-slot", style: "left:" + P.position_x + "%;top:" + P.position_y + "%;width:" + sw * f + "px;height:" + shh * f + "px;border-radius:" + rad + "px" });
  k.root.insertBefore(slot, wadah);
  if (P.image) slot.style.backgroundImage = "url(" + JSON.stringify(String(P.image)) + ")";
  else {
    slot.style.background = "linear-gradient(180deg,#f7c58a 0%,#f39a6b 45%,#a8506a 100%)";
    ["left:58%;top:18%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff7dc 0 45%,rgba(255,240,200,0) 70%)",
     "left:-10%;right:-10%;bottom:18%;height:38%;background:#7a4a6a;border-radius:50% 50% 0 0/100% 100% 0 0",
     "left:35%;right:-25%;bottom:8%;height:36%;background:#4f3157;border-radius:50% 50% 0 0/100% 100% 0 0",
     "left:0;right:0;bottom:0;height:16%;background:#2c1f38"].forEach(function (s) { BLOCK.el("i", { style: s }, slot); });
  }
  var x0 = cx - sw / 2, y0 = cy - shh / 2, streams = [], ns = 10, per = Math.max(4, Math.round(P.count / ns));
  for (var i = 0; i < ns; i++) {
    var a = i / ns * Math.PI * 2 + R() * 0.4, rr = Math.max(W, H) * 0.62;
    streams.push({ t: 0.05 + i * 0.06 + R() * 0.1, x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr * 0.8,
      tx: x0 + sw * (0.15 + R() * 0.7), ty: y0 + shh * (0.15 + R() * 0.7), n: per, spread: 60 });
  }
  var ring = [[x0, y0], [x0 + sw, y0], [x0 + sw, y0 + shh], [x0, y0 + shh], [x0, y0 + 1]];
  var inst = MGP.particlesFlight.create(wadah, { width: W, height: H, dpr: f, fit: true, duration: k.dur, seed: +P.seed,
    background: P.bg || null, streams: streams,
    bursts: [{ t: t1 + 0.1, x: cx, y: cy, n: 50, power: 0.9 }],
    trail: { path: ring, smooth: false, t0: t1 + 0.1, t1: t1 + 1.3, spacing: 10 } });
  k.tl.fromTo(slot, { clipPath: "inset(50% 50% 50% 50% round " + rad + "px)", filter: "blur(" + 14 * k.s + "px) brightness(1.8)", scale: 1.04 },
    { clipPath: "inset(0% 0% 0% 0% round " + rad + "px)", filter: "blur(0px) brightness(1)", scale: 1, duration: 1.4, ease: "power3.out", immediateRender: true }, t1)
    .to(slot, { scale: 1.025, duration: Math.max(0.5, k.dur - t1 - 1.4), ease: "sine.inOut" }, t1 + 1.4);
  return Promise.resolve(inst.ready).then(function () { BLOCK.onTime(k.tl, function (t) { inst.seek(t); }, k.dur); });
});
</script>
