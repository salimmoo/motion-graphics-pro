<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;--s:1;font-family:"Inter",system-ui,sans-serif}

.adegan{position:absolute;inset:0;overflow:hidden}
.ad-judul{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 calc(var(--s)*150px)/1 "Inter",system-ui,sans-serif;letter-spacing:-.02em}
.ad-sub{position:absolute;left:0;right:0;top:calc(50% + var(--s)*110px);text-align:center;font:500 calc(var(--s)*40px)/1.2 "Inter",system-ui,sans-serif;opacity:.75;letter-spacing:.2em;text-transform:uppercase}
.ad-a{background:radial-gradient(120% 90% at 30% 20%,#ffb347 0%,#e8553d 45%,#5a1f3a 100%);color:#fff7ea}
.ad-b{background:radial-gradient(120% 90% at 70% 30%,#7ee0d6 0%,#2d6cdf 50%,#10233f 100%);color:#f2fbff}
.ad-gelap{background:radial-gradient(110% 80% at 50% 35%,#2b2f45 0%,#12131c 70%);color:#f5f3ee}
.ad-terang{background:linear-gradient(160deg,#f7f3ea 0%,#e9e2d3 100%);color:#1d1b18}
.ad-kertas{background:#efe6d2;color:#2a2420}
.ad-kertas::after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(90,60,30,.25) 1px,transparent 1.4px);background-size:7px 7px}
.ad-foto{background:linear-gradient(180deg,#8fc3e8 0%,#f6d7b0 58%,#d98c5f 59%,#7a4b3a 100%)}
.ad-foto .mth{position:absolute;width:calc(var(--s)*260px);height:calc(var(--s)*260px);border-radius:50%;left:62%;top:22%;background:radial-gradient(circle,#fff6d8 0%,#ffd27a 60%,rgba(255,210,122,0) 72%)}
.ad-foto .bk1{position:absolute;left:-10%;right:-10%;bottom:28%;height:30%;background:#5f7f6a;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .bk2{position:absolute;left:30%;right:-30%;bottom:20%;height:34%;background:#3f5f52;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .tanah{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2f463d,#1f2e29)}
.ad-foto .sosok{position:absolute;left:40%;bottom:18%;width:calc(var(--s)*120px);height:calc(var(--s)*330px);background:#18201d;border-radius:calc(var(--s)*60px) calc(var(--s)*60px) calc(var(--s)*14px) calc(var(--s)*14px)}
.ad-foto .sosok::before{content:"";position:absolute;left:18%;top:-26%;width:64%;height:26%;border-radius:50%;background:#18201d}
.ad-ui{background:#eef1f6;color:#1b2333;font-family:"Inter",system-ui,sans-serif}
.ad-ui .bar{position:absolute;left:0;right:0;top:0;height:7%;background:#fff;border-bottom:1px solid #d9dee8}
.ad-ui .side{position:absolute;left:0;top:7%;bottom:0;width:18%;background:#f7f8fb;border-right:1px solid #d9dee8}
.ad-ui .kartu{position:absolute;background:#fff;border-radius:calc(var(--s)*18px);box-shadow:0 calc(var(--s)*6px) calc(var(--s)*24px) rgba(20,30,60,.08)}
.ad-ui .tombol{position:absolute;background:#2d6cdf;color:#fff;border-radius:calc(var(--s)*12px);font:600 calc(var(--s)*30px)/1 "Inter",sans-serif;display:flex;align-items:center;justify-content:center}

</style>

<body>
<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="3.5">
<div id="adegan" class="adegan ad-foto"><div class="mth"></div><div class="bk1"></div><div class="bk2"></div><div class="tanah"></div><div class="sosok"></div></div>
<!-- Block accents/beat-burst · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-beat-burst" data-block="accents/beat-burst" data-start="0" data-duration="3" data-track-index="40" class="blk blk-accents-beat-burst">
<script type="application/json" data-block-props>
{"target": "#adegan", "beats": [0.4, 1.35, 2.3], "position_x": 50, "position_y": 50, "size": 620, "color": "#ffffff", "accent_color": "#ffd23f", "flash": 0.55, "pulse": 0.035, "shake": 8, "line": 10}
</script>
<div class="blk-kilat"></div>
<div class="blk-pos"><div class="blk-cincin"></div><div class="blk-garis"></div></div>
</div>
<style>
.blk-accents-beat-burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-accents-beat-burst .blk-kilat{position:absolute;inset:0;opacity:0}
.blk-accents-beat-burst .blk-pos{position:absolute;width:0;height:0}
.blk-accents-beat-burst .blk-cincin{position:absolute;border-radius:50%;opacity:0}
.blk-accents-beat-burst .blk-garis span{position:absolute;left:0;top:0;transform-origin:0 50%;border-radius:99px}
</style>
<script>
BLOCK.mount("blk-beat-burst", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, tg = BLOCK.find(P.target);
  var kil = root.querySelector(".blk-kilat"), pos = root.querySelector(".blk-pos"), cin = root.querySelector(".blk-cincin"), gw = root.querySelector(".blk-garis");
  var R = P.size * s / 2, hits = (P.beats || []).map(Number).filter(function (x) { return x >= 0; }).sort(function (a, b) { return a - b; });
  pos.style.left = P.position_x + "%"; pos.style.top = P.position_y + "%";
  kil.style.background = "radial-gradient(circle at " + P.position_x + "% " + P.position_y + "%," + P.color + " 0%," + BLOCK.rgba(P.color, 0.6) + " 45%," + BLOCK.rgba(P.color, 0.25) + " 100%)";
  cin.style.cssText += ";left:" + (-R) + "px;top:" + (-R) + "px;width:" + 2 * R + "px;height:" + 2 * R + "px;border:" + Math.round(10 * s) + "px solid " + P.accent_color +
    ";box-shadow:0 0 " + Math.round(30 * s) + "px " + P.accent_color;
  var gs = [];
  for (var i = 0; i < P.line; i++) gs.push(BLOCK.el("span", { style: "height:" + Math.max(3, Math.round(8 * s)) + "px;margin-top:" + (-Math.round(4 * s)) + "px;background:" + P.accent_color }, gw));
  // satu sengatan = kilat + cincin kejut + garis radial + denyut skala & guncang pada target; semuanya fungsi murni dari t
  BLOCK.onTime(tl, function (t) {
    var tb = -1;
    for (var i = 0; i < hits.length; i++) if (t >= hits[i]) tb = hits[i];
    var dt = tb < 0 ? 99 : t - tb, e = Math.exp(-dt * 9);
    kil.style.opacity = (P.flash * Math.exp(-dt * 14)).toFixed(3);
    var p = BLOCK.clamp(dt / 0.5, 0, 1), q = 1 - Math.pow(1 - p, 3);
    cin.style.opacity = dt < 0.5 ? (1 - p).toFixed(3) : "0";
    cin.style.transform = "scale(" + (0.15 + q * 0.95).toFixed(3) + ")";
    gs.forEach(function (g, j) {
      var a = (j / gs.length) * 360 + 11, d0 = R * (0.25 + q * 0.75), L = R * 0.5 * (1 - p);
      g.style.opacity = dt < 0.5 ? "1" : "0";
      g.style.width = Math.max(0, L).toFixed(1) + "px";
      g.style.transform = "rotate(" + a + "deg) translateX(" + d0.toFixed(1) + "px)";
    });
    if (tg) {
      var sc = 1 + P.pulse * e, gx = P.shake * s * Math.exp(-dt * 16) * Math.sin(dt * 90);
      gsap.set(tg, { scale: sc, x: dt < 1 ? gx : 0, transformOrigin: "50% 50%" });
    }
  }, k.dur);
});
</script>
</div>
<script>
  window.__duration = 3.5;
  window.__timelines = window.__timelines || {};
  window.__timelines["example"] = gsap.timeline({ paused: true }).set({}, {}, 3.5);
</script>
