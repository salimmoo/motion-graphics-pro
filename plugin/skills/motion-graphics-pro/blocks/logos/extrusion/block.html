<!-- Block logos/extrusion · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="logos/extrusion" data-start="0" data-duration="5" data-track-index="20" class="blk blk-logos-extrusion">
<script type="application/json" data-block-props>
{"brand_name": "BAJA", "shape": "box", "material": "chrome", "color": "#ff5a36", "bg": "#0b0c10", "depth": 16, "font": "Archivo Black", "size": 260, "highlight": true}
</script>
<div class="blk-scene"><div class="blk-word"></div></div>
</div>
<style>
.blk-logos-extrusion{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-logos-extrusion .blk-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:calc(var(--s)*1500px)}
.blk-logos-extrusion .blk-word{position:relative;display:flex;align-items:center;gap:.07em;line-height:1;white-space:nowrap;perspective:calc(var(--s)*900px)}
.blk-logos-extrusion .blk-h{position:relative;display:inline-block}
.blk-logos-extrusion .blk-bk{display:block}
.blk-logos-extrusion .blk-fr{position:absolute;left:0;top:0;display:block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:320% 100%}
.blk-logos-extrusion .blk-bx{width:.78em;height:.78em}
.blk-logos-extrusion .blk-bx .blk-bk,.blk-logos-extrusion .blk-bx .blk-fr{width:100%;height:100%;box-sizing:border-box}
.blk-logos-extrusion .blk-bx .blk-fr{-webkit-background-clip:border-box;background-clip:border-box}
.blk-logos-extrusion .blk-lantai{position:absolute;left:50%;top:60%;width:70%;height:30%;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.08),transparent 70%)}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, D = k.dur, E = BLOCK.el, R = k.root;
  if (P.bg) R.style.background = "radial-gradient(80% 70% at 50% 40%," + BLOCK.mix(P.bg, "#ffffff", 0.1) + "," + P.bg + ")";
  R.style.cssText += ";--s:" + s;
  var M = {
    chrome: { muka: "linear-gradient(100deg,#7d8794 0%,#f4f7fb 18%,#9aa4b1 30%,#ffffff 46%,#5d6672 60%,#e9eef4 76%,#7d8794 100%)", sisi: ["#9aa3ae", "#15181d"] },
    gold: { muka: "linear-gradient(100deg,#a8701c 0%,#fff2b8 18%,#d79a2e 32%,#fffbe0 46%,#94600f 60%,#f6d77a 76%,#a8701c 100%)", sisi: ["#c58d27", "#2e1b03"] },
    matte: { muka: "linear-gradient(100deg," + P.color + " 0%," + BLOCK.mix(P.color, "#ffffff", 0.2) + " 40%," + P.color + " 60%," + BLOCK.mix(P.color, "#000000", 0.08) + " 100%)", sisi: [BLOCK.mix(P.color, "#000000", 0.3), BLOCK.mix(P.color, "#000000", 0.8)] }
  }[P.material] || { muka: "#fff", sisi: ["#888", "#222"] };
  var scene = R.querySelector(".blk-scene"), word = R.querySelector(".blk-word");
  R.insertBefore(E("div", { class: "blk-lantai" }), scene);
  var fs = Math.min(P.size * s, k.w * 0.8 / Math.max(2, String(P.brand_name).length * 0.8 + (P.shape !== "none" ? 0.9 : 0)));
  word.style.cssText = "font-family:" + BLOCK.family(P.font) + ";font-size:" + Math.round(fs) + "px";
  var N = Math.max(4, Math.round(P.depth)), langkah = fs * 0.009, warnaLapis = [];
  for (var i = 1; i <= N; i++) warnaLapis.push(BLOCK.mix(M.sisi[0], M.sisi[1], i / N));
  var belakang = [], muka = [], huruf = [], kotak = null;
  function satu(isi, kelas) {
    var h = E("div", { class: "blk-h" + (kelas ? " " + kelas : "") }, word);
    var bk = E("span", { class: "blk-bk" }, h), fr = E("span", { class: "blk-fr" }, h);
    if (!kelas) { bk.textContent = fr.textContent = isi; bk.style.color = warnaLapis[0]; } else { bk.style.borderRadius = fr.style.borderRadius = isi; bk.style.background = warnaLapis[0]; }
    fr.style.backgroundImage = M.muka;
    belakang.push(bk); muka.push(fr); huruf.push(h);
    return h;
  }
  if (P.shape === "box" || P.shape === "circle") { kotak = satu(P.shape === "circle" ? "50%" : "18%", "blk-bx"); kotak.style.marginRight = ".12em"; }
  Array.from(String(P.brand_name)).forEach(function (ch) { satu(ch === " " ? " " : ch); });
  // ekstrusi: tumpukan lapisan (text-shadow / box-shadow) searah kedalaman; arahnya mengikuti ayunan kata
  var o = { ry: -38, rx: 14 };
  function lapis() {
    var dx = Math.sin(o.ry * Math.PI / 180) * -1.0, dy = 0.55 + Math.sin(o.rx * Math.PI / 180) * 1.2, L = [];
    for (var i = 1; i <= N; i++) L.push((dx * i * langkah).toFixed(2) + "px " + (dy * i * langkah).toFixed(2) + "px 0 " + warnaLapis[i - 1]);
    var bayang = (dx * N * langkah * 1.4).toFixed(1) + "px " + (dy * N * langkah * 2.2).toFixed(1) + "px " + (fs * 0.12).toFixed(0) + "px rgba(0,0,0,.55)";
    var ts = L.join(",") + "," + bayang;
    belakang.forEach(function (b, j) { if (kotak && j === 0) b.style.boxShadow = ts; else b.style.textShadow = ts; });
    word.style.transform = "rotateY(" + o.ry.toFixed(3) + "deg) rotateX(" + o.rx.toFixed(3) + "deg)";
  }
  // huruf terbalik naik satu per satu
  tl.fromTo(huruf, { rotationX: -100, autoAlpha: 0, transformOrigin: "50% 100%" }, { rotationX: 0, autoAlpha: 1, duration: 0.8, ease: "back.out(1.5)", stagger: 0.1 }, 0.15);
  var tA = 0.15 + huruf.length * 0.1 + 0.4;
  // kata berayun supaya cahaya menyapu bevel, lalu tenang dan terbaca
  tl.fromTo(o, { ry: -38, rx: 14 }, { ry: 22, rx: 6, duration: tA + 0.4, ease: "power2.inOut", onUpdate: lapis }, 0)
    .to(o, { ry: -6, rx: 4, duration: 1.1, ease: "power2.inOut", onUpdate: lapis }, tA + 0.4)
    .to(o, { ry: 0, rx: 0, duration: Math.max(0.6, D - tA - 1.6), ease: "sine.inOut", onUpdate: lapis }, tA + 1.5);
  tl.fromTo(muka, { backgroundPosition: P.highlight ? "100% 50%" : "20% 50%" }, { backgroundPosition: "0% 50%", duration: tA + 1.4, ease: "power1.inOut" }, 0);
  lapis();
}, { font: true });
</script>
