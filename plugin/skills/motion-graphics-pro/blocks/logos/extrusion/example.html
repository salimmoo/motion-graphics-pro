    gold: { muka: "linear-gradient(100deg,#a8701c 0%,#fff2b8 18%,#d79a2e 32%,#fffbe0 46%,#94600f 60%,#f6d77a 76%,#a8701c 100%)", sisi: ["#c58d27", "#2e1b03"] },
    matte: { muka: "linear-gradient(100deg," + P.color + " 0%," + BLOCK.mix(P.color, "#ffffff", 0.2) + " 40%," + P.color + " 60%," + BLOCK.mix(P.color, "#000000", 0.08) + " 100%)", sisi: [BLOCK.mix(P.color, "#000000", 0.3), BLOCK.mix(P.color, "#000000", 0.8)] }
