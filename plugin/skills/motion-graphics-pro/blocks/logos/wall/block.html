<style>
.blk-logos-wall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-logos-wall .blk-wrap{position:absolute;left:50%;top:50%;width:max-content;max-width:92%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}

.blk-logos-wall .blk-wmk{font-family:var(--f2);text-transform:uppercase;letter-spacing:.3em;font-size:calc(var(--s)*34px);font-weight:700;white-space:nowrap}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, D = k.dur, E = BLOCK.el, R = k.root, ac = k.random;
  if (P.bg) R.style.background = P.bg;
  R.style.cssText += ";--s:" + s + ";--f2:" + BLOCK.family(P.font2, "monospace");
  var wrap = E("div", { class: "blk-wrap", style: "color:" + P.color + ";font-family:" + BLOCK.family(P.font) }, R);
  var jd = P.title ? E("div", { class: "blk-jd" }, wrap, BLOCK.esc(P.title)) : null;
  var merek = (Array.isArray(P.brand) ? P.brand : []).filter(Boolean);
  if (jd) tl.fromTo(jd, { autoAlpha: 0, y: 12 * s }, { autoAlpha: 0.6, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
  if (P.style === "strip") {
    // baris monokrom: hanya opasitas, kiri ke kanan, lalu diam

    tl.fromTo(el, { opacity: 0 }, { opacity: 0.78, duration: 0.7, ease: "power1.out", stagger: 0.16 }, 0.4);

  var grid = E("div", { class: "blk-grid", style: "grid-template-columns:repeat(" + kol + ",auto)" }, wrap);
  var B = ['<circle cx="12" cy="12" r="10" fill="C"/>', '<rect x="2" y="2" width="20" height="20" rx="5" fill="C"/>', '<path d="M12 2l10 18H2z" fill="C"/>',
    '<path d="M2 12a10 10 0 0 1 20 0z" fill="C"/><path d="M2 14h20v3H2z" fill="C"/>', '<path d="M4 4h7v7H4zM13 13h7v7h-7z" fill="C"/>', '<path d="M12 2c5 4 5 16 0 20-5-4-5-16 0-20z" fill="C"/>'];
  var gayaT = ["font-weight:800;letter-spacing:-.03em", "font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.78em", "font-weight:700;font-style:italic;letter-spacing:-.01em", "font-weight:800;text-transform:lowercase;letter-spacing:-.04em"];
  var sel = merek.map(function (m, i) {

  var urut = sel.map(function (c, i) { return { c: c, t: 0.35 + (i % kol) * 0.07 + Math.floor(i / kol) * 0.1 + ac() * 0.18 }; });

</script>
