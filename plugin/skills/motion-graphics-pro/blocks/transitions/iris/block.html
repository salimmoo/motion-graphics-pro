<div data-composition-id="__ID__" data-block="transitions/iris" data-start="0" data-duration="1.1" data-track-index="20" class="blk blk-transitions-iris">
<script type="application/json" data-block-props>
{"from": "#adegan-a", "to": "#adegan-b", "mode": "classic", "position_x": 50, "position_y": 50, "accent_color": "#ffd166", "color": "#0b0c10", "thickness": 6, "ease": "power3.inOut"}

</div>
<style>
.blk-transitions-iris{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-transitions-iris .blk-cincin{position:absolute;border-radius:50%;opacity:0;box-sizing:border-box}
.blk-transitions-iris .blk-tutup{position:absolute;inset:0;opacity:0}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, A = BLOCK.find(P.from), Bk = BLOCK.find(P.to), D = k.dur, W = k.w, H = k.h, s = k.s;
  function gaya(el, o) { if (el) for (var n in o) el.style[n] = o[n]; }
  function bersih(el, tampil) { gaya(el, { transform: "", filter: "", opacity: "", clipPath: "", webkitMaskImage: "", maskImage: "", transformOrigin: "", zIndex: "", borderRadius: "", boxShadow: "", backfaceVisibility: "", visibility: tampil ? "" : "hidden" }); }
  function ez(n) { return gsap.parseEase(n || "none") || gsap.parseEase("none"); }
  var E = ez(P.ease), cx = W * P.position_x / 100, cy = H * P.position_y / 100;
  var R = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy)) + 4;
  var tb = Math.max(1, +P.thickness * s);
  var cin = BLOCK.el("div", { class: "blk-cincin", style: "border:" + tb + "px solid " + P.accent_color + ";box-shadow:0 0 " + 24 * s + "px " + BLOCK.rgba(P.accent_color, 0.6) }, k.root);
  var tup = BLOCK.el("div", { class: "blk-tutup", style: "background:" + P.color }, k.root);
  var pos = P.position_x + "% " + P.position_y + "%";
  function cincin(r, o) { gaya(cin, { left: cx - r + "px", top: cy - r + "px", width: 2 * r + "px", height: 2 * r + "px", opacity: o }); }
  BLOCK.onTime(tl, function (t) {
    var u = t / D; cincin(0, 0); tup.style.opacity = 0;
    if (u <= 0 || u >= 1) { bersih(A, u <= 0); bersih(Bk, u >= 1); return; }
    if (P.mode === "close") {
      var a = u < 0.5 ? 1 - E(u / 0.5) : E((u - 0.5) / 0.5), r = a * R, m = "radial-gradient(circle at " + pos + ", transparent " + r + "px, #000 " + (r + 1.5) + "px)";
      gaya(tup, { opacity: 1, webkitMaskImage: m, maskImage: m });
      gaya(A, { visibility: u < 0.5 ? "" : "hidden" }); gaya(Bk, { visibility: u >= 0.5 ? "" : "hidden" });
      return;
    }
    var q = E(u), r = q * R;
    gaya(A, { visibility: "", filter: P.mode === "classic" ? "brightness(" + (1 - 0.38 * q) + ") saturate(" + (1 - 0.85 * q) + ")" : "" });
    if (P.mode === "soft") {
      var fz = 0.12 * Math.min(W, H), m2 = "radial-gradient(circle at " + pos + ", #000 " + Math.max(0, r * 1.15 - fz) + "px, transparent " + (r * 1.15 + 1) + "px)";
      gaya(Bk, { visibility: "", clipPath: "", webkitMaskImage: m2, maskImage: m2 });
    } else {
      gaya(Bk, { visibility: "", clipPath: "circle(" + r + "px at " + pos + ")" });

});
</script>
