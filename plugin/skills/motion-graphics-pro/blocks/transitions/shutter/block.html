<div data-composition-id="__ID__" data-block="transitions/shutter" data-start="0" data-duration="1.3" data-track-index="20" class="blk blk-transitions-shutter">
<script type="application/json" data-block-props>
{"from": "#adegan-a", "to": "#adegan-b", "mode": "blade", "count": 7, "color": "#20242c", "accent_color": "#d9b25a", "hold": 0.1}

<style>
.blk-transitions-shutter{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-transitions-shutter .blk-bilah{position:absolute;left:50%;top:50%;transform-origin:50% 0;visibility:hidden}
.blk-transitions-shutter .blk-pintu,.blk-transitions-shutter .blk-kerai{position:absolute;visibility:hidden}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, A = BLOCK.find(P.from), Bk = BLOCK.find(P.to), D = k.dur, W = k.w, H = k.h, s = k.s;
  function gaya(el, o) { if (el) for (var n in o) el.style[n] = o[n]; }
  function bersih(el, tampil) { gaya(el, { transform: "", filter: "", opacity: "", clipPath: "", webkitMaskImage: "", maskImage: "", transformOrigin: "", zIndex: "", borderRadius: "", boxShadow: "", backfaceVisibility: "", visibility: tampil ? "" : "hidden" }); }
  function ez(n) { return gsap.parseEase(n || "none") || gsap.parseEase("none"); }
  var N = Math.max(3, Math.round(+P.count || 7)), th = BLOCK.clamp(+P.hold || 0, 0, 0.4), h = (1 - th) / 2;
  var eIn = ez("power3.in"), eOut = ez("power3.out"), eIO = ez("power2.inOut");
  var logam = "linear-gradient(180deg," + BLOCK.mix(P.color, "#ffffff", 0.22) + " 0%," + P.color + " 18%," + BLOCK.mix(P.color, "#000000", 0.35) + " 100%)";
  var tutupan = function (u) { return u < h ? eIn(u / h) : u < h + th ? 1 : 1 - eOut((u - h - th) / h); };
  var el = [], mode = P.mode, R = Math.hypot(W, H) / 2 + 4, S = Math.hypot(W, H) * 1.6;
  if (mode === "door") {
    for (var i = 0; i < 2; i++) el.push(BLOCK.el("div", { class: "blk-pintu", style: "top:0;bottom:0;width:50%;" + (i ? "right:0;" : "left:0;") + "background:" + logam.replace("180deg", i ? "270deg" : "90deg") + ";box-shadow:inset " + (i ? "" : "-") + 5 * s + "px 0 0 " + P.accent_color }, k.root));
  } else if (mode === "blinds") {
    for (var j = 0; j < N; j++) el.push(BLOCK.el("div", { class: "blk-kerai", style: "left:0;right:0;top:" + j * 100 / N + "%;height:" + (100 / N + 0.2) + "%;background:" + logam + ";box-shadow:inset 0 -" + 3 * s + "px 0 " + BLOCK.rgba(P.accent_color, 0.8) }, k.root));
  } else {
    for (var b = 0; b < N; b++) el.push(BLOCK.el("div", { class: "blk-bilah", style: "width:" + S + "px;height:" + S + "px;margin-left:" + (-S / 2) + "px;background:" + logam + ";border-top:" + 3 * s + "px solid " + P.accent_color + ";box-shadow:0 -" + 10 * s + "px " + 30 * s + "px rgba(0,0,0,.55)" }, k.root));
  }
  BLOCK.onTime(tl, function (t) {
    var u = t / D, c = u <= 0 || u >= 1 ? 0 : tutupan(u);
    el.forEach(function (e) { e.style.visibility = c > 0.001 ? "visible" : "hidden"; });
    if (u <= 0 || u >= 1) { bersih(A, u <= 0); bersih(Bk, u >= 1); return; }
    var sw = u >= 0.5;
    gaya(A, { visibility: sw ? "hidden" : "" }); gaya(Bk, { visibility: sw ? "" : "hidden" });
    if (mode === "door") {
      var kn = u < h ? 0 : Math.exp(-(u - h) * 30) * Math.sin((u - h) * 60) * 0.012;
      el[0].style.transform = "translateX(" + (-(1 - c) * 100 - kn * 100) + "%)";
      el[1].style.transform = "translateX(" + ((1 - c) * 100 + kn * 100) + "%)";
    } else if (mode === "blinds") {
      el.forEach(function (e, i) {
        var d = i / N * 0.35, q = u < 0.5 ? BLOCK.clamp((u / h - d) / (1 - 0.35), 0, 1) : BLOCK.clamp(((u - h - th) / h - d) / (1 - 0.35), 0, 1);
        var sc = u < 0.5 ? eIO(q) : 1 - eIO(q);
        gaya(e, { transformOrigin: u < 0.5 ? "50% 0" : "50% 100%", transform: "scaleY(" + sc + ")", visibility: sc > 0.001 ? "visible" : "hidden" });
      });
    } else {
      var r = (1 - c) * R, tw = c * 55;
      el.forEach(function (e, i) { e.style.transform = "rotate(" + (i * 360 / N + tw) + "deg) translateY(" + r + "px)"; });
    }
  }, D);
});
</script>
