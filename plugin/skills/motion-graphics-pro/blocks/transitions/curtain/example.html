<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="4">

<div id="adegan-b" class="adegan ad-b"><div class="ad-judul">ADEGAN B</div><div class="ad-sub">sesudah transisi</div></div>
<!-- Block transitions/curtain · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-curtain" data-block="transitions/curtain" data-start="0.6" data-duration="3.2" data-track-index="20" class="blk blk-transitions-curtain">
<script type="application/json" data-block-props>
{"from": "#adegan-a", "to": "#adegan-b", "mode": "close-open", "color": "#8e1b2c", "edge_color": "#d8a84a", "highlight": true, "exit": true}
</script>
</div>
<style>
.blk-transitions-curtain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-transitions-curtain .blk-tirai{position:absolute;top:0;bottom:0;width:53%}
.blk-transitions-curtain .blk-kain{position:absolute;inset:0}
.blk-transitions-curtain .blk-ikat{position:absolute;height:2.2%;border-radius:999px}
.blk-transitions-curtain .blk-pelmet{position:absolute;left:-2%;right:-2%;top:0;height:13%}
.blk-transitions-curtain .blk-sorot{position:absolute;inset:0;mix-blend-mode:screen}
</style>
<script>
BLOCK.mount("blk-curtain", function (k) {
  var P = k.P, tl = k.tl, D = k.dur, W = k.w, H = k.h, s = k.s, A = BLOCK.find(P.from), Bk = BLOCK.find(P.to);
  var c = P.color, gelap = BLOCK.mix(c, "#000000", 0.55), terang = BLOCK.mix(c, "#ffffff", 0.18), pp = Math.round(70 * s);
  var sorot = BLOCK.el("div", { class: "blk-sorot", style: "background:radial-gradient(42% 55% at 50% 58%,rgba(255,236,190,.55),rgba(255,220,160,.12) 60%,transparent 75%)" }, k.root);
  var tirai = [0, 1].map(function (i) {
    var t = BLOCK.el("div", { class: "blk-tirai", style: (i ? "right:0" : "left:0") + ";filter:drop-shadow(" + (i ? -1 : 1) * Math.round(14 * s) + "px 0 " + Math.round(22 * s) + "px rgba(0,0,0,.5))" }, k.root);
    var kain = BLOCK.el("div", { class: "blk-kain", style: "transform-origin:" + (i ? "100%" : "0%") + " 50%;background:" +
      "linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 80%,rgba(0,0,0,.45))," +
      "repeating-linear-gradient(90deg," + gelap + " 0," + c + " " + pp * 0.3 + "px," + terang + " " + pp * 0.5 + "px," + c + " " + pp * 0.7 + "px," + gelap + " " + pp + "px)" }, t);
    var ikat = BLOCK.el("div", { class: "blk-ikat", style: "background:linear-gradient(180deg," + P.edge_color + "," + BLOCK.mix(P.edge_color, "#000000", 0.4) + ")" }, k.root);
    return { el: t, kain: kain, ikat: ikat, kanan: i };
  });
  // pelmet: valans bergelombang di atas dengan tepi emas
  var sc = [], n = 9;
  for (var j = 0; j <= n * 8; j++) { var u = j / (n * 8); sc.push((u * 100).toFixed(2) + "% " + (78 + 22 * Math.abs(Math.sin(u * n * Math.PI))).toFixed(2) + "%"); }
  var pel = BLOCK.el("div", { class: "blk-pelmet", style: "clip-path:polygon(0 0,100% 0," + sc.reverse().join(",") + ");background:linear-gradient(180deg," + gelap + "," + c + " 70%," + P.edge_color + " 72%," + BLOCK.mix(P.edge_color, "#000000", 0.35) + " 80%," + c + " 81%);filter:drop-shadow(0 " + Math.round(10 * s) + "px " + Math.round(14 * s) + "px rgba(0,0,0,.55))" }, k.root);
  var tutup = P.mode !== "open", tm = tutup ? D * 0.36 : 0.02, tb = tm + D * 0.1, tk = P.exit ? D * 0.84 : D;
  var ez = function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  function gambar(t) {
    // o = seberapa terbuka (1 = terkumpul di samping), g = geser keluar layar (1 = di luar)
    var o, g;
    if (tutup && t < tm) { var q = ez(BLOCK.progress(t, 0, tm)); o = 1 - q; g = 1 - Math.min(1, q * 1.6); }
    else { o = ez(BLOCK.progress(t, tb, tk - D * 0.02)); g = 0; }
    if (t > tk) g = ez(BLOCK.progress(t, tk, D));
    var lebar = 1 - 0.78 * o;
    tirai.forEach(function (q) {
      var sg = q.kanan ? 1 : -1, xg = sg * g * W * 0.53 * lebar * 1.3;
      q.kain.style.transform = "scaleX(" + lebar.toFixed(4) + ")";
      q.el.style.transform = "translateX(" + xg.toFixed(1) + "px)";
      // tepi dalam tertarik ke ikatan (62% tinggi), melebar lagi di bawah
      var pts = [], m = 20;
      for (var i = 0; i <= m; i++) {
        var y = i / m, tie = Math.exp(-Math.pow((y - 0.62) / 0.2, 2));
        var x = (1 - o * (0.42 * tie + 0.06 * y)) * 100;
        pts.push((q.kanan ? 100 - x : x).toFixed(2) + "% " + (y * 100).toFixed(2) + "%");
      }
      var tepi = q.kanan ? ["100% 100%", "100% 0%"] : ["0% 100%", "0% 0%"];
      q.kain.style.clipPath = "polygon(" + pts.join(",") + "," + tepi.join(",") + ")";
      var lx = lebar * (1 - o * 0.42) * W * 0.53, iw = (40 + 30 * o) * s;
      q.ikat.style.width = iw.toFixed(1) + "px";
      q.ikat.style.top = (H * 0.61).toFixed(1) + "px";
      q.ikat.style.left = (q.kanan ? W - lx - iw * 0.6 : lx - iw * 0.4).toFixed(1) + "px";
      q.ikat.style.transform = "translateX(" + xg.toFixed(1) + "px)";
      q.ikat.style.opacity = (BLOCK.progress(o, 0.15, 0.4) * (1 - g)).toFixed(3);
    });
    var pm = tutup ? BLOCK.progress(t, 0, tm * 0.6) : 1;
    pel.style.transform = "translateY(" + (-(1 - ez(pm)) * 110 - ez(BLOCK.progress(t, tk, D)) * 110).toFixed(1) + "%)";
    sorot.style.opacity = P.highlight ? (BLOCK.progress(t, tb + D * 0.12, tb + D * 0.4) * (1 - BLOCK.progress(t, tk - D * 0.05, D))).toFixed(3) : 0;
  }
  BLOCK.onTime(tl, gambar, D);
  if (A) BLOCK.initial(tl, A, { autoAlpha: 1 }).set(A, { autoAlpha: 0 }, tm + 0.02);
  if (Bk) BLOCK.initial(tl, Bk, { autoAlpha: 0 }).set(Bk, { autoAlpha: 1 }, tm + 0.02);
});
</script>
</div>
