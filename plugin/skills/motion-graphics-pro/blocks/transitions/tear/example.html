<div data-composition-id="blk-tear" data-block="transitions/tear" data-start="1" data-duration="1.8" data-track-index="20" class="blk blk-transitions-tear">
<script type="application/json" data-block-props>
{"from": "#adegan-a", "to": "#adegan-b", "direction": "horizontal", "mode": "split", "position": 50, "roughness": 1, "fiber_color": "#fbf7ee", "shadow": true, "seed": 7}
</script>

<style>
.blk-transitions-tear{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-transitions-tear .blk-lembar{position:absolute;left:-5%;top:-5%;width:110%;height:110%;will-change:transform}
.blk-transitions-tear .blk-serat,.blk-transitions-tear .blk-isi{position:absolute;inset:0}
.blk-transitions-tear .blk-serat{background:repeating-linear-gradient(83deg,rgba(150,130,100,.10) 0 1px,transparent 1px 5px),repeating-linear-gradient(-12deg,rgba(255,255,255,.6) 0 1px,transparent 1px 4px)}
.blk-transitions-tear .blk-isi>*{position:absolute;left:4.5455%;top:4.5455%;width:90.909%;height:90.909%;right:auto;bottom:auto}
</style>
<script>
BLOCK.mount("blk-tear", function (k) {
  var P = k.P, tl = k.tl, D = k.dur, R = k.random, A = BLOCK.find(P.from), Bk = BLOCK.find(P.to);
  var hor = P.direction !== "vertical", pos = +P.position || 50, kas = P.roughness == null ? 1 : +P.roughness;
  // garis sobek: gelombang besar (noise) + gigi kecil berseed; titik dalam persen sepanjang sumbu
  var N = 90, sd = R() * 50, garis = [];
  for (var i = 0; i <= N; i++) {
    var u = i / N * 100;
    var v = pos + BLOCK.noise(i * 0.09, sd) * 7 * kas + BLOCK.noise(i * 0.5, sd + 3) * 1.4 * kas + (R() - 0.5) * 0.9 * kas;
    garis.push([u, v, 0.5 + R() * 1.5 * kas]); // [sepanjang, melintang, lebar serat]
  }
  var cv = function (p) { return ((p + 5) / 1.1).toFixed(3); };
  var pt = function (u, v) { u = cv(u); v = cv(v); return (hor ? u + "% " + v + "%" : v + "% " + u + "%"); };
  // potongan 0 = sisi atas/kiri, 1 = sisi bawah/kanan; serat putih menjulur melewati garis sobek
  function poli(sisi, serat) {
    var s = sisi ? 1 : -1, ujung = sisi ? 100 : 0, out = [pt(0, ujung), pt(100, ujung)];
    for (var j = N; j >= 0; j--) { var g = garis[j]; out.push(pt(g[0], g[1] - s * (serat ? g[2] : 0))); }
    if (!sisi) out.reverse();
    return "polygon(" + out.join(",") + ")";
  }
  var sh = P.shadow ? "drop-shadow(0 " + Math.round(18 * k.s) + "px " + Math.round(26 * k.s) + "px rgba(25,15,5,.42))" : "none";
  var isiList = [];
  var lembar = [0, 1].map(function (sisi) {
    var w = BLOCK.el("div", { class: "blk-lembar", style: "filter:" + sh }, k.root);
    BLOCK.el("div", { class: "blk-serat", style: "background-color:" + P.fiber_color + ";clip-path:" + poli(sisi, true) }, w);
    var isi = BLOCK.el("div", { class: "blk-isi", style: "clip-path:" + poli(sisi, false) }, w);
    if (A) isiList.push(isi); else isi.style.background = "#2a2420";
    return w;
  });
  // klon adegan yang segar tiap seek (id + gaya tetap, tanpa .clip/data-start aktif, kanvas ikut disalin)
  if (A) BLOCK.mirror(k, A, isiList, "position:absolute;inset:auto;left:4.5455%;top:4.5455%;width:90.909%;height:90.909%;margin:0");
  if (A) BLOCK.initial(tl, A, { autoAlpha: 1 }).set(A, { autoAlpha: 0 }, 0.02);
  if (Bk) BLOCK.initial(tl, Bk, { autoAlpha: 0 }).set(Bk, { autoAlpha: 1 }, 0.02);
  // engsel di ujung jauh garis: sobekan "berlari" dari ujung dekat ke ujung jauh
  var org = hor ? "95.45% " + cv(pos) + "%" : cv(pos) + "% 95.45%";
  var t1 = D * 0.42, jatuh = P.mode === "drop";
  lembar.forEach(function (w, sisi) {
    var s = sisi ? 1 : -1, ax = hor ? "y" : "x", vars0 = { transformOrigin: org, rotation: 0, x: 0, y: 0, scale: 1 };
    var buka = { rotation: (hor ? -s : s) * (sisi ? 1.2 : 1.8), duration: t1, ease: "power2.in" };
    buka[ax] = s * 1.6 + "%";
    tl.fromTo(w, vars0, buka, 0.05);
    var pergi = { duration: D - t1 - 0.05, ease: jatuh ? "power3.in" : "power2.in" };
    if (jatuh) { pergi.y = "125%"; pergi.rotation = (sisi ? 9 : -14) * (hor ? 1 : -1); pergi.x = (sisi ? -4 : 6) + "%"; }
    else { pergi[ax] = s * 118 + "%"; pergi.rotation = (hor ? -s : s) * (sisi ? 7 : 12); pergi[hor ? "x" : "y"] = (sisi ? -3 : 5) + "%"; pergi.scale = 1.04; }
    tl.to(w, pergi, t1 + 0.05 + (sisi ? 0.06 : 0));
  });
});
</script>
