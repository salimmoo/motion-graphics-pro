<!-- Block transitions/paper-collage · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="transitions/paper-collage" data-start="0" data-duration="2.6" data-track-index="20" class="blk blk-transitions-paper-collage">
<script type="application/json" data-block-props>
{"from": "#adegan-a", "to": "#adegan-b", "mode": "close-open", "palette": ["#efe4cc", "#c9a77a", "#a9b89a", "#9db4c8", "#d98c6a", "#e2b65a", "#e8e4da"], "size": 1, "pause": 0.02, "seed": 5}
</script>
</div>
<style>
.blk-transitions-paper-collage{position:absolute;inset:0;pointer-events:none;overflow:hidden;perspective:1600px}
.blk-transitions-paper-collage .blk-sobek{position:absolute}
.blk-transitions-paper-collage .blk-serat,.blk-transitions-paper-collage .blk-muka{position:absolute;inset:0}
.blk-transitions-paper-collage .blk-serat{background:#fbf8f0}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, D = k.dur, R = k.random, W = k.w, H = k.h, s = k.s;
  var A = BLOCK.find(P.from), Bk = BLOCK.find(P.to), pal = P.palette && P.palette.length ? P.palette : ["#efe4cc"];
  // butir kertas: satu kanvas derau berseed dipakai sebagai pola (sinkron, tanpa gambar luar)
  var nz = document.createElement("canvas"); nz.width = nz.height = 160;
  var nc = nz.getContext("2d"), id = nc.createImageData(160, 160), rn = BLOCK.random(91);
  for (var p = 0; p < id.data.length; p += 4) { var v = rn(); id.data[p] = 90; id.data[p + 1] = 66; id.data[p + 2] = 40; id.data[p + 3] = v < 0.5 ? v * 60 : v > 0.97 ? 120 : 0; }
  nc.putImageData(id, 0, 0);
  var tekstur = [
    "",
    "repeating-linear-gradient(0deg,rgba(60,90,140,.22) 0 1px,transparent 1px " + Math.round(26 * s) + "px),",
    "repeating-linear-gradient(0deg,rgba(80,70,60,.12) 0 1px,transparent 1px 18px),repeating-linear-gradient(90deg,rgba(80,70,60,.12) 0 1px,transparent 1px 18px),",
    "radial-gradient(rgba(70,50,30,.22) 1.2px,transparent 1.8px) 0 0/14px 14px,",
    "repeating-linear-gradient(97deg,rgba(90,60,30,.10) 0 2px,transparent 2px 9px),",
  ];
  // tepi sobek: titik-titik di keliling persegi dengan gerigi berseed (persen)
  function sobek(rr, serat) {
    var pts = [], sisi = [[0, 0, 100, 0], [100, 0, 100, 100], [100, 100, 0, 100], [0, 100, 0, 0]];
    sisi.forEach(function (q, si) {
      var n = 14, robek = rr() < 0.7;
      for (var i = 0; i < n; i++) {
        var u = i / n, x = q[0] + (q[2] - q[0]) * u, y = q[1] + (q[3] - q[1]) * u;
        var j = robek ? (rr() - 0.5) * 3.2 + BLOCK.noise(i * 0.7 + si * 9, 3) * 2.2 : (rr() - 0.5) * 0.6;
        var nx = si === 1 ? 1 : si === 3 ? -1 : 0, ny = si === 0 ? -1 : si === 2 ? 1 : 0;
        var e = serat ? (robek ? 1 + rr() * 1.6 : 0.5) : 0;
        pts.push((x + nx * (j + e)).toFixed(2) + "% " + (y + ny * (j + e)).toFixed(2) + "%");
      }
    });
    return "polygon(" + pts.join(",") + ")";
  }
  var sel = Math.min(W, H) / 3.2 * (+P.size || 1), kol = Math.ceil(W / sel) + 1, bar = Math.ceil(H / sel) + 1;
  var gx = W / (kol - 1), gy = H / (bar - 1), list = [];
  var sh = "drop-shadow(0 " + Math.round(8 * s) + "px " + Math.round(14 * s) + "px rgba(30,18,8,.35))";
  for (var r = 0; r < bar; r++) for (var c = 0; c < kol; c++) {
    var w = gx * (1.35 + R() * 0.35), h = gy * (1.35 + R() * 0.35);
    var x = c * gx + (R() - 0.5) * gx * 0.3 - w / 2, y = r * gy + (R() - 0.5) * gy * 0.3 - h / 2;
    var el = BLOCK.el("div", { class: "blk-sobek", style: "left:" + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;width:" + w.toFixed(1) + "px;height:" + h.toFixed(1) + "px;filter:" + sh }, k.root);
    var sd = Math.floor(R() * 1e6);
    BLOCK.el("div", { class: "blk-serat", style: "clip-path:" + sobek(BLOCK.random(sd), true) }, el);
    var warna = pal[Math.floor(R() * pal.length) % pal.length];
    var muka = BLOCK.el("div", { class: "blk-muka", style: "clip-path:" + sobek(BLOCK.random(sd), false) + ";background:" + tekstur[Math.floor(R() * tekstur.length)] + warna }, el);
    var kv = BLOCK.el("canvas", { width: Math.ceil(w / 2), height: Math.ceil(h / 2), style: "position:absolute;inset:0;width:100%;height:100%" }, muka), kc = kv.getContext("2d");
    kc.fillStyle = kc.createPattern(nz, "repeat"); kc.fillRect(0, 0, kv.width, kv.height);
    var lg = kc.createLinearGradient(0, 0, kv.width, kv.height); lg.addColorStop(0, "rgba(255,255,255,.18)"); lg.addColorStop(1, "rgba(60,40,20,.12)"); kc.fillStyle = lg; kc.fillRect(0, 0, kv.width, kv.height);
    list.push({ el: el, d: (c / kol + r / bar) * 0.5 + R() * 0.5, rot: Math.round((R() - 0.5) * 1600) / 100, ax: (x + w / 2 - W / 2), ay: (y + h / 2 - H / 2) });
  }
  var tutup = P.mode !== "open", tm = tutup ? D * 0.46 : 0.02, jd = +P.pause || 0.02;
  var urut = list.slice().sort(function (a, b) { return a.d - b.d; });
  urut.forEach(function (q, i) {
    var tIn = tutup ? Math.min(tm - 0.3, i * jd * (D / 2.6)) : 0, tOut = tm + 0.1 + i * jd * (D / 2.6) * 0.55;
    var dir = q.ax / W * 2, dirY = q.ay / H * 2;
    if (tutup) tl.fromTo(q.el, { autoAlpha: 0, scale: 1.35, rotation: q.rot * 2.2, y: -40 * s }, { autoAlpha: 1, scale: 1, rotation: q.rot, y: 0, duration: 0.3, ease: "power3.out", force3D: false }, tIn);
    else BLOCK.initial(tl, q.el, { autoAlpha: 1, rotation: q.rot });
    // terangkat, lalu melayang pergi bergoyang ke arah luar
    var dOut = Math.min(0.75, Math.max(0.35, D - tOut - 0.2));
    tl.to(q.el, { scale: 1.08, duration: 0.12, ease: "power2.out", force3D: false }, tOut)
      .to(q.el, { x: (dir * 0.9 + (R() - 0.5) * 0.5) * W, y: (dirY * 0.6 - 0.35 - R() * 0.4) * H, rotation: q.rot + (R() - 0.5) * 120, rotationX: (R() - 0.5) * 140, rotationY: (R() - 0.5) * 100, duration: dOut, ease: "power2.in" }, tOut + 0.1)
      .to(q.el, { autoAlpha: 0, duration: 0.15 }, tOut + 0.1 + dOut - 0.15);
  });
  if (A) BLOCK.initial(tl, A, { autoAlpha: 1 }).set(A, { autoAlpha: 0 }, tm);
  if (Bk) BLOCK.initial(tl, Bk, { autoAlpha: 0 }).set(Bk, { autoAlpha: 1 }, tm);
});
</script>
