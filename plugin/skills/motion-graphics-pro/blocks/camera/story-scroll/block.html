<!-- Block camera/story-scroll · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="camera/story-scroll" data-start="0" data-duration="7" data-track-index="30" class="blk blk-camera-story-scroll">
<script type="application/json" data-block-props>
{"target": "", "part": [{"judul": "Awal mula", "teks": "Semua berawal dari satu pertanyaan kecil"}, {"judul": "Perjalanan", "teks": "Setiap langkah membuka jalan berikutnya"}, {"judul": "Titik balik", "teks": "Data mengubah cara kita melihat"}, {"judul": "Hari ini", "teks": "Cerita yang terus bergerak maju"}], "start": 0.4, "hold": 1.4, "ease": "power2.inOut", "motion_blur": true, "bg": "#101320", "color": "#f6f2ea", "accent_color": "#7cf0c5", "color2": "#ff8a5b", "font": "Inter:wght@400;700;800", "seed": 3}
</script>
</div>
<style>
.blk-camera-story-scroll{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-camera-story-scroll .blk-lp{position:absolute;left:0;top:0;width:100%}
.blk-camera-story-scroll .blk-bag{position:absolute;left:0;width:100%;display:flex;align-items:center;justify-content:center}
.blk-camera-story-scroll .blk-isi{width:78%;max-width:var(--mx)}
.blk-camera-story-scroll .blk-kick{font-weight:700;letter-spacing:.2em}
.blk-camera-story-scroll .blk-jd{font-weight:800;letter-spacing:-.03em;line-height:.98}
.blk-camera-story-scroll .blk-tx{opacity:.72;line-height:1.3}
.blk-camera-story-scroll .blk-bulat{position:absolute;border-radius:50%}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, w = k.w, h = k.h, s = k.s, D = k.dur, R = k.root, T = BLOCK.find(P.target);
  var ez = gsap.parseEase(P.ease || "power2.inOut");
  function prog(t) { return ez(BLOCK.progress(t, +P.start || 0, D - (+P.hold || 0))); }
  if (T) { // host: elemen tinggi digulir dari atas ke bawah
    var jauh = Math.max(0, T.scrollHeight - h);
    BLOCK.onTime(k.tl, function (t) { T.style.transform = "translate(0px," + (-prog(t) * jauh).toFixed(2) + "px)"; }, D);
    return;
  }
  var data = P.part || [], N = Math.max(1, data.length), tinggi = (N - 1) * h;
  R.style.cssText += ";background:" + P.bg + ";color:" + P.color + ";font-family:" + BLOCK.family(P.font) + ";--mx:" + Math.round(1300 * s) + "px";
  var rnd = BLOCK.random(+P.seed || 3);
  // tiga lapis kedalaman, masing-masing digulir dengan laju berbeda (paralaks)
  var blk = BLOCK.el("div", { class: "blk-lp" }, R), tgh = BLOCK.el("div", { class: "blk-lp" }, R), dpn = BLOCK.el("div", { class: "blk-lp" }, R);
  var LAJU = [0.45, 1, 1.55];
  for (var i = 0; i < N * 3; i++) {
    var r = rnd.range(160, 420) * s, c = i % 2 ? P.accent_color : P.color2;
    BLOCK.el("div", { class: "blk-bulat", style: "left:" + (rnd() * w - r) + "px;top:" + (rnd() * (tinggi * LAJU[0] + h) - r) + "px;width:" + 2 * r + "px;height:" + 2 * r + "px;background:radial-gradient(circle," + BLOCK.rgba(c, 0.16) + ",transparent 68%)" }, blk);
  }
  for (i = 0; i < N * 7; i++) {
    var q = rnd.range(5, 14) * s;
    BLOCK.el("div", { class: "blk-bulat", style: "left:" + rnd() * w + "px;top:" + rnd() * (tinggi * LAJU[2] + h) + "px;width:" + q + "px;height:" + q + "px;background:" + (i % 3 ? BLOCK.rgba(P.color, 0.35) : P.accent_color) }, dpn);
  }
  var isi = data.map(function (d, i) {
    var b = BLOCK.el("div", { class: "blk-bag", style: "top:" + i * h + "px;height:" + h + "px" }, tgh);
    var x = BLOCK.el("div", { class: "blk-isi" }, b);
    BLOCK.el("div", { class: "blk-kick", style: "color:" + (i % 2 ? P.color2 : P.accent_color) + ";font-size:" + Math.round(28 * s) + "px;margin-bottom:" + Math.round(24 * s) + "px" }, x, "BAB " + ("0" + (i + 1)).slice(-2));
    BLOCK.el("div", { class: "blk-jd", style: "font-size:" + Math.round(150 * s) + "px;margin-bottom:" + Math.round(28 * s) + "px" }, x, BLOCK.esc(d.judul || ""));
    BLOCK.el("div", { class: "blk-tx", style: "font-size:" + Math.round(44 * s) + "px" }, x, BLOCK.esc(d.teks || ""));
    BLOCK.el("div", { style: "height:" + Math.round(6 * s) + "px;width:" + Math.round(140 * s) + "px;margin-top:" + Math.round(40 * s) + "px;border-radius:9px;background:" + (i % 2 ? P.color2 : P.accent_color) }, x);
    return x;
  });
  // lintasan: gulir kontinu yang sedikit melambat di tiap bab supaya judul sempat terbaca
  function posY(t) { var q = prog(t) * (N - 1), i = Math.floor(q), f = q - i; return (0.45 * q + 0.55 * (i + BLOCK.smooth(f))) * h; }
  BLOCK.onTime(k.tl, function (t) {
    var y = posY(t), v = Math.abs(y - posY(Math.max(0, t - 1 / 60)));
    [blk, tgh, dpn].forEach(function (L, j) { L.style.transform = "translate(0px," + (-y * LAJU[j]).toFixed(2) + "px)"; });
    tgh.style.filter = P.motion_blur && v > 1 ? "blur(" + Math.min(v * 0.05, 8 * s).toFixed(2) + "px)" : "";
    isi.forEach(function (x, i) {
      var rel = (i * h - y) / h; // 0 = bagian tepat di depan kamera
      x.style.transform = "translate(0px," + (Math.max(0, rel) * 0.25 * h + Math.min(0, rel) * 0.08 * h).toFixed(2) + "px)"; // bagian naik saat kamera tiba
      x.style.opacity = (1 - BLOCK.progress(Math.abs(rel), 0.4, 0.95)).toFixed(3);
    });
  }, D);
}, { font: true });
</script>
