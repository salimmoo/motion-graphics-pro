<style>

#stage{position:relative;width:1920px;height:1080px;overflow:hidden;--s:1;font-family:"Inter",system-ui,sans-serif}

.adegan{position:absolute;inset:0;overflow:hidden}
.ad-judul{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 calc(var(--s)*150px)/1 "Inter",system-ui,sans-serif;letter-spacing:-.02em}
.ad-sub{position:absolute;left:0;right:0;top:calc(50% + var(--s)*110px);text-align:center;font:500 calc(var(--s)*40px)/1.2 "Inter",system-ui,sans-serif;opacity:.75;letter-spacing:.2em;text-transform:uppercase}
.ad-a{background:radial-gradient(120% 90% at 30% 20%,#ffb347 0%,#e8553d 45%,#5a1f3a 100%);color:#fff7ea}
.ad-b{background:radial-gradient(120% 90% at 70% 30%,#7ee0d6 0%,#2d6cdf 50%,#10233f 100%);color:#f2fbff}
.ad-gelap{background:radial-gradient(110% 80% at 50% 35%,#2b2f45 0%,#12131c 70%);color:#f5f3ee}
.ad-terang{background:linear-gradient(160deg,#f7f3ea 0%,#e9e2d3 100%);color:#1d1b18}
.ad-kertas{background:#efe6d2;color:#2a2420}
.ad-kertas::after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(90,60,30,.25) 1px,transparent 1.4px);background-size:7px 7px}

.ad-foto .mth{position:absolute;width:calc(var(--s)*260px);height:calc(var(--s)*260px);border-radius:50%;left:62%;top:22%;background:radial-gradient(circle,#fff6d8 0%,#ffd27a 60%,rgba(255,210,122,0) 72%)}
.ad-foto .bk1{position:absolute;left:-10%;right:-10%;bottom:28%;height:30%;background:#5f7f6a;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .bk2{position:absolute;left:30%;right:-30%;bottom:20%;height:34%;background:#3f5f52;border-radius:50% 50% 0 0/100% 100% 0 0}

.ad-foto .sosok{position:absolute;left:40%;bottom:18%;width:calc(var(--s)*120px);height:calc(var(--s)*330px);background:#18201d;border-radius:calc(var(--s)*60px) calc(var(--s)*60px) calc(var(--s)*14px) calc(var(--s)*14px)}
.ad-foto .sosok::before{content:"";position:absolute;left:18%;top:-26%;width:64%;height:26%;border-radius:50%;background:#18201d}
.ad-ui{background:#eef1f6;color:#1b2333;font-family:"Inter",system-ui,sans-serif}

.ad-ui .kartu{position:absolute;background:#fff;border-radius:calc(var(--s)*18px);box-shadow:0 calc(var(--s)*6px) calc(var(--s)*24px) rgba(20,30,60,.08)}
.ad-ui .tombol{position:absolute;background:#2d6cdf;color:#fff;border-radius:calc(var(--s)*12px);font:600 calc(var(--s)*30px)/1 "Inter",sans-serif;display:flex;align-items:center;justify-content:center}

<body>
<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="8.5">

<!-- Block camera/station · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-station" data-block="camera/station" data-start="0" data-duration="8" data-track-index="30" class="blk blk-camera-station">
<script type="application/json" data-block-props>
{"target": "", "station": [{"judul": "Rencana", "teks": "Susun langkah sejak hari pertama"}, {"judul": "Rancang", "teks": "Ubah ide menjadi bentuk visual"}, {"judul": "Bangun", "teks": "Gerakkan setiap elemen dengan tujuan"}, {"judul": "Rilis", "teks": "Kirim, ukur, lalu perbaiki"}], "still": 0.55, "ease": "power3.inOut", "bg": "#0f1424", "color": "#f4f1ea", "accent_color": "#ffb547", "font": "Inter:wght@400;600;800", "motion_blur": true}
</script>
</div>
<style>
.blk-camera-station{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-camera-station .blk-grid{position:absolute;inset:0;opacity:.5}
.blk-camera-station .blk-strip{position:absolute;inset:0}
.blk-camera-station .blk-kartu{position:absolute;top:50%;box-sizing:border-box;border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:0 var(--b) calc(var(--b)*3) rgba(0,0,0,.35);overflow:hidden}
.blk-camera-station .blk-no{font-weight:800;letter-spacing:.12em;opacity:.9}
.blk-camera-station .blk-jd{font-weight:800;letter-spacing:-.02em;line-height:1}
.blk-camera-station .blk-tx{font-weight:400;opacity:.72;line-height:1.3}
.blk-camera-station .blk-rel{position:absolute;height:2px;background:rgba(255,255,255,.18)}
.blk-camera-station .blk-isi-rel{position:absolute;left:0;top:0;bottom:0}
.blk-camera-station .blk-titik{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
</style>
<script>
BLOCK.mount("blk-station", function (k) {
  var P = k.P, w = k.w, s = k.s, D = k.dur, T = BLOCK.find(P.target);
  var data = Array.isArray(P.station) && P.station.length ? P.station : [{ judul: "Stasiun", teks: "" }];
  var N = data.length, ez = gsap.parseEase(P.ease || "power3.inOut");
  var dw = D * BLOCK.clamp(+P.still || 0.5, 0.1, 0.9) / N, pn = N > 1 ? (D - N * dw) / (N - 1) : 0;
  function posisi(t) { // indeks stasiun pecahan: diam di tiap stasiun, lalu geser ke berikutnya
    if (N < 2) return 0;
    var seg = dw + pn, i = Math.floor(t / seg), r = t - i * seg;
    return i >= N - 1 ? N - 1 : i + (r < dw ? 0 : ez((r - dw) / pn));
  }
  if (T) { // mode host: target dianggap pita lebar yang digeser per stasiun
    var jauh = Math.max(0, T.scrollWidth - w);
    BLOCK.onTime(k.tl, function (t) { T.style.transform = "translate(" + (-posisi(t) / Math.max(1, N - 1) * jauh).toFixed(2) + "px,0px)"; }, D);
    return;
  }
  var R = k.root, cw = Math.min(w * 0.72, 880 * s), gap = cw + 150 * s, ak = P.accent_color;
  R.style.cssText += ";background:" + P.bg + ";color:" + P.color + ";font-family:" + BLOCK.family(P.font) +
    ";--r:" + Math.round(28 * s) + "px;--b:" + Math.round(18 * s) + "px";
  var grid = BLOCK.el("div", { class: "blk-grid", style: "background-image:radial-gradient(" + BLOCK.rgba(P.color, 0.22) + " " + 1.6 * s + "px,transparent " + 2.2 * s + "px);background-size:" + 46 * s + "px " + 46 * s + "px" }, R);
  var strip = BLOCK.el("div", { class: "blk-strip" }, R);
  var relY = "calc(50% + " + Math.round(250 * s) + "px)";
  var rel = BLOCK.el("div", { class: "blk-rel", style: "top:" + relY + ";left:" + (w / 2 - 40 * s) + "px;width:" + ((N - 1) * gap + 80 * s) + "px" }, strip);
  var isi = BLOCK.el("div", { class: "blk-isi-rel", style: "background:" + ak + ";left:" + 40 * s + "px" }, rel);
  var kartu = [], titik = [];
  data.forEach(function (d, i) {
    var c = BLOCK.el("div", { class: "blk-kartu", style: "left:" + (w / 2 + i * gap) + "px;width:" + cw + "px;padding:" + Math.round(54 * s) + "px " + Math.round(60 * s) + "px" }, strip);
    var dalam = BLOCK.el("div", null, c);
    BLOCK.el("div", { class: "blk-no", style: "color:" + ak + ";font-size:" + Math.round(26 * s) + "px;margin-bottom:" + Math.round(22 * s) + "px" }, dalam, ("0" + (i + 1)).slice(-2) + " / " + ("0" + N).slice(-2));
    BLOCK.el("div", { class: "blk-jd", style: "font-size:" + Math.round(96 * s) + "px;margin-bottom:" + Math.round(20 * s) + "px" }, dalam, BLOCK.esc(d.judul || ""));
    BLOCK.el("div", { class: "blk-tx", style: "font-size:" + Math.round(34 * s) + "px" }, dalam, BLOCK.esc(d.teks || ""));
    c._dalam = dalam; kartu.push(c);
    titik.push(BLOCK.el("div", { class: "blk-titik", style: "top:" + relY + ";left:" + (w / 2 + i * gap) + "px;width:" + 22 * s + "px;height:" + 22 * s + "px;border:" + 3 * s + "px solid " + ak }, strip));
  });
  BLOCK.onTime(k.tl, function (t) {
    var x = posisi(t), v = Math.abs(x - posisi(Math.max(0, t - 1 / 60))) * gap;
    strip.style.transform = "translate(" + (-x * gap).toFixed(2) + "px,0px)";
    strip.style.filter = P.motion_blur && v > 0.5 ? "blur(" + Math.min(v * 0.06, 6 * s).toFixed(2) + "px)" : "none";
    grid.style.backgroundPosition = (-x * gap * 0.35).toFixed(2) + "px 0";
    isi.style.width = (x * gap) + "px";
    kartu.forEach(function (c, i) {
      var d = i - x, e = Math.min(Math.abs(d), 1);
      c.style.transform = "translate(-50%,-50%) scale(" + (1 - 0.1 * e).toFixed(4) + ")";
      c.style.opacity = (1 - 0.55 * e).toFixed(3);
      c._dalam.style.transform = "translateX(" + (d * -60 * s).toFixed(2) + "px)"; // paralaks isi kartu
      titik[i].style.background = x >= i - 0.02 ? P.accent_color : P.bg;
      titik[i].style.transform = "translate(-50%,-50%) scale(" + (1 + 0.5 * (1 - e)).toFixed(3) + ")";
    });
  }, D);
}, { font: true });
</script>
</div>
<script>
  window.__duration = 8.5;
  window.__timelines = window.__timelines || {};
  window.__timelines["example"] = gsap.timeline({ paused: true }).set({}, {}, 8.5);
</script>
