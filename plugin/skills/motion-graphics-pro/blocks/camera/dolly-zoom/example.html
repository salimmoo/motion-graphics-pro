<script>
BLOCK.mount("blk-dolly-zoom", function (k) {
  var P = k.P, D = k.dur, w = k.w, h = k.h, kek = BLOCK.clamp(+P.strength || 0.6, 0.05, 0.92);

  if (P.text) {
    cap = BLOCK.el("div", { class: "blk-cap", style: "color:" + P.subject_color + ";font-family:" + BLOCK.family(P.font) + ";font-size:" + Math.round(54 * k.s) + "px" }, k.root, BLOCK.esc(P.text));

  function kotak(d, z) { var s = K * skala(d, z); return [cx - s * Wc / 2, cy - s * Hc / 2, s * Wc, s * Hc]; }

    for (i = 18; i >= -6; i--) {
      var z = 0.12 + i * 0.38;

        c.fillRect(r[0] + r[2] * 0.965, r[1] + r[3] * 0.25, r[2] * 0.02, r[3] * 0.4);
