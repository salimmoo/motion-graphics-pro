<script>
BLOCK.mount("blk-rack-focus", function (k) {
  var P = k.P, w = k.w, h = k.h, s = k.s, D = k.dur, R = k.root, tegak = h > w * 1.1;
  var ez = gsap.parseEase(P.ease || "power2.inOut"), bMax = (+P.blur || 14) * s;

  var tukar = P.mode === "swap";
  var A = BLOCK.find(P.near), Bk = BLOCK.find(P.far), lapis = [];
  if (!A || !Bk) {
    R.style.background = "radial-gradient(120% 90% at 50% 30%," + BLOCK.mix(P.bg, "#3a4a7a", 0.35) + "," + P.bg + " 70%)";
  }
  var bokehBlk = null, bokehDpn = null;
  if (P.bokeh) bokehBlk = BLOCK.canvas(R, w, h);
  var data = Array.isArray(P.card) ? P.card : [];
  function kartu(i, d, cx, cy, cw) {
    var war = i ? P.color2 : P.color1, pd = Math.round(cw * 0.08);
    var c = BLOCK.el("div", { class: "blk-kartu", style: "left:" + (cx - cw / 2) + "px;top:" + (cy - cw * 0.31) + "px;width:" + cw + "px;height:" + Math.round(cw * 0.62) + "px;padding:" + pd + "px;color:" + P.text_color +
      ";font-family:" + BLOCK.family(P.font) + ";--r:" + Math.round(cw * 0.05) + "px;background:linear-gradient(150deg," + BLOCK.mix(war, "#1b2140", 0.55) + ",#141a30);box-shadow:0 " + Math.round(30 * s) + "px " + Math.round(80 * s) + "px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)" }, R);
    BLOCK.el("div", { class: "blk-ikon", style: "width:" + cw * 0.12 + "px;height:" + cw * 0.12 + "px;background:radial-gradient(circle at 35% 30%,#fff," + war + " 60%);margin-bottom:" + cw * 0.06 + "px" }, c);
    BLOCK.el("div", { class: "blk-lbl", style: "font-size:" + Math.round(cw * 0.028) + "px;color:" + war + ";margin-bottom:" + cw * 0.02 + "px" }, c, i ? "BIDANG JAUH" : "BIDANG DEKAT");
    BLOCK.el("div", { class: "blk-jd", style: "font-size:" + Math.round(cw * 0.085) + "px;margin-bottom:" + cw * 0.025 + "px" }, c, BLOCK.esc(d.judul || ""));
    BLOCK.el("div", { class: "blk-tx", style: "font-size:" + Math.round(cw * 0.04) + "px" }, c, BLOCK.esc(d.teks || ""));

  if (!Bk) {
    var cw1 = Math.min(w * (tegak ? 0.62 : 0.4), 820 * s);
    Bk = tukar ? kartu(1, data[1] || {}, tegak ? w * 0.5 : w * 0.72, tegak ? h * 0.69 : h * 0.5, cw1 * 0.95)
               : kartu(1, data[1] || {}, w * (tegak ? 0.6 : 0.67), h * (tegak ? 0.33 : 0.34), cw1 * 0.8);
  }
  if (!A) {
    var cw0 = Math.min(w * (tegak ? 0.7 : 0.44), 900 * s);
    A = tukar ? kartu(0, data[0] || {}, tegak ? w * 0.5 : w * 0.28, tegak ? h * 0.31 : h * 0.5, cw0 * 0.86)
              : kartu(0, data[0] || {}, w * (tegak ? 0.42 : 0.34), h * (tegak ? 0.64 : 0.64), cw0 * 0.92);
  }
  if (P.bokeh) bokehDpn = BLOCK.canvas(R, w, h);
  lapis = [{ el: A, z: 0, arah: -1 }, { el: Bk, z: 1, arah: 1 }];
  // titik cahaya: separuh jauh di belakang (z 1.8), separuh dekat di depan (z -0.6)
  var rnd = BLOCK.random(+P.seed || 5), titik = [];
  for (var i = 0; i < (+P.bokeh_count || 0); i++) titik.push({ x: rnd() * w, y: rnd() * h, r: rnd.range(3, 7) * s, a: rnd.range(0.35, 0.9), z: i % 2 ? 1.8 : -0.6, hu: rnd.range(-0.3, 0.3) });
  var cx = w / 2, cy = h / 2, maxd = Math.hypot(cx, cy);
  function cakram(c, x, y, r, a) { // cakram poligon (bilah aperture) yang terpotong "mata kucing" ke arah sudut
    var dx = (x - cx) / maxd, dy = (y - cy) / maxd, q = Math.hypot(dx, dy);
    c.save();
    c.beginPath(); c.arc(x - dx * r * 0.9 * q, y - dy * r * 0.9 * q, r * (1.05 - 0.1 * q), 0, Math.PI * 2); c.clip();
    c.globalAlpha = a; c.beginPath();
    for (var j = 0; j < 7; j++) { var an = 0.3 + j * Math.PI * 2 / 7; c[j ? "lineTo" : "moveTo"](x + Math.cos(an) * r, y + Math.sin(an) * r); }
    c.closePath(); c.fill();
    c.globalAlpha = a * 0.6; c.lineWidth = Math.max(1, r * 0.06); c.stroke(); // tepi cakram lebih terang
    c.restore();

  function bokeh(cv, f, depan) {
    var c = cv.ctx; c.clearRect(0, 0, w, h); c.globalCompositeOperation = "lighter";
    titik.forEach(function (p) {
      if ((p.z < 0) !== depan) return;
      var df = Math.abs(f - p.z), r = p.r + df * 34 * s, a = p.a * BLOCK.clamp(Math.pow(p.r / r, 1.1) * 2.2, 0.08, 1);

      cakram(c, p.x + (f - 0.5) * (p.z - 0.5) * -60 * s, p.y, r, a);
    });
    c.globalCompositeOperation = "source-over";
  }
  BLOCK.onTime(k.tl, function (t) {
    var f = fokus(t);
    lapis.forEach(function (L) {
      var df = Math.abs(f - L.z), sc = tukar ? (L.z ? 0.88 + 0.14 * f : 1.02 - 0.14 * f) : 1 + 0.05 * (L.z ? f : f);
      var px = (f - 0.5) * (L.z - 0.5) * -70 * s; // paralaks: lapis dekat bergeser lebih jauh

    });
