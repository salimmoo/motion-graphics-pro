        "V" + (h - h * 0.2) + "Q" + h + "," + h + " " + (h - h * 0.2) + "," + h + "H" + (-h + h * 0.2) + "Q" + (-h) + "," + h + " " + (-h) + "," + (h - h * 0.2) + "Z";

    // lengkung busur kuadrat dari a ke b, naik ke atas sebesar fraksi jarak
    busur: function (a, b, lengkung) {

      var nx = dy / L, ny = -dx / L; if (ny > 0) { nx = -nx; ny = -ny; }
      return "M" + a.cx + "," + a.cy + "Q" + (mx + nx * L * lengkung) + "," + (my + ny * L * lengkung) + " " + b.cx + "," + b.cy;

  var P = k.P, tl = k.tl, s = k.s, W = k.w, H = k.h, fam = BLOCK.family(P.font);

  }
  var top = P.title ? 0.05 * H + 160 * s : 80 * s, pad = 0.06 * W;

  var X = (P.dot || []).map(function (p) { var d = PETA.cari(D, p.kode); return d ? { d: d, v: +p.nilai || 0, l: p.label || d.n } : null; }).filter(Boolean);
  var vmax = Math.max.apply(null, X.map(function (x) { return x.v; }).concat([1e-9]));
  var gL = BLOCK.svg("g", {}, svg), gB = BLOCK.svg("g", {}, svg), gT = BLOCK.svg("g", {}, svg), t0 = 0.8;

      var Lq = BLOCK.prepareStroke(ln);

    tl.fromTo(c, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.7, ease: "blockSpring", immediateRender: true }, at);
    var dot = BLOCK.svg("circle", { cx: x.d.cx, cy: x.d.cy, r: 3.5 * s, fill: "#fff" }, gB);
    tl.fromTo(dot, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: true }, at + 0.1);
    var rk = rank.indexOf(x);
    if (rk < +P.caption) {
      // keterangan menyebar ke arah berbeda supaya tidak bertumpuk: atas-kanan, bawah-kanan, bawah-kiri, atas-kiri
      var ang = [-0.8, 0.75, 2.4, -2.35][rk % 4], right = Math.cos(ang) > 0, g = BLOCK.svg("g", {}, gT);
      var ex = x.d.cx + Math.cos(ang) * r, ey = x.d.cy + Math.sin(ang) * r, kx = ex + Math.cos(ang) * 46 * s, ky = ey + Math.sin(ang) * 46 * s, hx = kx + (right ? 22 : -22) * s;
      BLOCK.svg("path", { d: "M" + ex + "," + ey + "L" + kx + "," + ky + "H" + hx, fill: "none", stroke: P.text_color, "stroke-width": 2 * s }, g);

      var t1 = BLOCK.svg("text", { x: tx, y: ky + 2 * s, "text-anchor": an, "font-size": 36 * s, "font-weight": 800, fill: P.text_color, "font-family": fam }, g);
      t1.textContent = String(x.v).replace(".", ",") + (P.unit || "");
      var t2 = BLOCK.svg("text", { x: tx, y: ky + 30 * s, "text-anchor": an, "font-size": 22 * s, "font-weight": 600, fill: P.text_color, opacity: 0.7, "font-family": fam }, g);
      t2.textContent = x.l;
      tl.fromTo(g, { autoAlpha: 0, x: (right ? -14 : 14) * s }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: true }, Math.min(at + 0.6 + rk * 0.15, k.dur - 0.6));
    }

    tl.fromTo(ring, { scale: 1, autoAlpha: 0, transformOrigin: "50% 50%" }, { keyframes: [{ autoAlpha: 0.7, duration: 0.15 }, { scale: 1.5, autoAlpha: 0, duration: 1.1 }], repeat: 2, repeatDelay: 0.3, immediateRender: true }, t0 + 0.8);
  }
