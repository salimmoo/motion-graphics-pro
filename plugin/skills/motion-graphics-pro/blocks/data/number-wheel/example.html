<style>

<body>
<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="4.5">
<div id="adegan" class="adegan ad-gelap"></div>
<!-- Block data/number-wheel · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-number-wheel" data-block="data/number-wheel" data-start="0" data-duration="4" data-track-index="10" class="blk blk-data-number-wheel">
<script type="application/json" data-block-props>
{"style": "odometer", "from": 0, "to": 248750, "decimals": 0, "prefix": "", "suffix": "", "label": "unduhan sejak peluncuran", "count_duration": 2.4, "ease": "power2.inOut", "tile": true, "color": "#f5f3ee", "tile_color": "rgba(255,255,255,0.07)", "font": "Inter:wght@500;600;800", "size": 180, "weight": 800, "position_x": 50, "position_y": 48}
</script>
<div class="blk-w"><div class="blk-baris"></div><div class="blk-l"></div></div>
</div>
<style>
.blk-data-number-wheel{position:absolute;inset:0;pointer-events:none}
.blk-data-number-wheel .blk-w{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.blk-data-number-wheel .blk-baris{display:flex;align-items:center;justify-content:center;line-height:1;font-variant-numeric:tabular-nums}
.blk-data-number-wheel .blk-kol{position:relative;overflow:hidden;width:.64em;height:1.16em;margin:0 .03em}
.blk-data-number-wheel .blk-ubin .blk-kol{border-radius:.1em;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
.blk-data-number-wheel .blk-pita{position:absolute;left:0;right:0;top:0}
.blk-data-number-wheel .blk-pita div{height:1.16em;display:flex;align-items:center;justify-content:center}
.blk-data-number-wheel .blk-sep{width:.26em;text-align:center;opacity:.8}
.blk-data-number-wheel .blk-af{font-size:.55em;font-weight:600;margin:0 .18em;opacity:.9}
.blk-data-number-wheel .blk-l{margin-top:.8em;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:500}
</style>
<script>
BLOCK.mount("blk-number-wheel", function (k) {
  var P = k.P, tl = k.tl, s = k.s, R = k.root;
  var w = R.querySelector(".blk-w"), row = R.querySelector(".blk-baris"), lab = R.querySelector(".blk-l");
  w.style.cssText += ";left:" + P.position_x + "%;top:" + P.position_y + "%;color:" + P.color + ";font-family:" + BLOCK.family(P.font);
  row.style.cssText += ";font-size:" + Math.round(P.size * s) + "px;font-weight:" + P.weight;
  if (P.tile) row.classList.add("blk-ubin");
  lab.style.fontSize = Math.round(P.size * 0.15 * s) + "px"; lab.textContent = P.label;
  var dec = Math.max(0, P.decimals | 0), m = Math.pow(10, dec);
  var A = Math.round(P.from * m), Z = Math.round(P.to * m);
  var n = Math.max(String(Math.abs(A)).length, String(Math.abs(Z)).length, dec + 1);
  if (P.prefix) BLOCK.el("span", { class: "blk-af" }, row).textContent = P.prefix;
  var kol = [];
  for (var j = 0; j < n; j++) {             // j dari kiri; tempat = n-1-j
    var place = n - 1 - j;
    var c = BLOCK.el("div", { class: "blk-kol" }, row);
    if (P.tile) c.style.background = P.tile_color;
    var pita = BLOCK.el("div", { class: "blk-pita" }, c);
    for (var d = 0; d <= 10; d++) BLOCK.el("div", null, pita).textContent = d % 10;
    kol.push({ el: c, pita: pita, place: place, j: j });
    if (place === dec && dec > 0) BLOCK.el("span", { class: "blk-sep" }, row).textContent = ",";
    else if (place > dec && (place - dec) % 3 === 0) BLOCK.el("span", { class: "blk-sep" }, row).textContent = ".";
  }
  if (P.suffix) BLOCK.el("span", { class: "blk-af" }, row).textContent = P.suffix;
  var t0 = 0.3, dh = Math.min(P.count_duration, k.dur - 1), ez = gsap.parseEase(P.ease);
  // odometer: digit bawah berputar terus, digit atas hanya bergulir saat digit bawahnya melimpah
  function posOdo(v, place) {
    if (place === 0) return v;
    var b = Math.pow(10, place);
    return Math.floor(v / b) + BLOCK.clamp((v % b) - (b - 1), 0, 1);
  }
  function posSlot(t, c) {
    var target = Math.floor(Z / Math.pow(10, c.place)) % 10;
    var a = t0 + c.j * 0.05, b = t0 + dh * (0.55 + 0.45 * c.j / Math.max(n - 1, 1));
    return ez(BLOCK.progress(t, a, b)) * (10 * (2 + c.j) + target);
  }
  var hCell = 1.16 * P.size * s;
  function pose(t, c) {
    if (P.style === "slot") return posSlot(t, c);
    var v = A + (Z - A) * ez(BLOCK.progress(t, t0, t0 + dh));
    return posOdo(Math.max(v, 0), c.place);
  }
  BLOCK.onTime(tl, function (t) {
    var v = A + (Z - A) * ez(BLOCK.progress(t, t0, t0 + dh));
    kol.forEach(function (c) {
      var p = pose(t, c), sp = Math.abs(p - pose(t - 1 / 30, c)) * 30;   // digit per detik
      var f = ((p % 10) + 10) % 10;
      c.pita.style.transform = "translateY(" + (-f * hCell).toFixed(2) + "px)";
      c.pita.style.filter = sp > 2 ? "blur(" + Math.min(sp * 0.25, 7 * s).toFixed(1) + "px)" : "none";
      var hidup = P.style === "slot" || c.place <= dec || v >= Math.pow(10, c.place) - 0.5;
      c.el.style.opacity = hidup ? 1 : 0.2;
    });
  }, k.dur);
  tl.fromTo(w, { opacity: 0, y: 30 * s }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo(row, { scale: 1 }, { scale: 1.04, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + dh);
  tl.to(w, { opacity: 0, y: -20 * s, duration: 0.4, ease: "power2.in" }, k.dur - 0.45);
}, { font: true });
</script>
</div>
<script>
  window.__duration = 4.5;
  window.__timelines = window.__timelines || {};
  window.__timelines["example"] = gsap.timeline({ paused: true }).set({}, {}, 4.5);
</script>
