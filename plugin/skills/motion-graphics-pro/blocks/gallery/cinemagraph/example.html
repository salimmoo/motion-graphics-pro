<script>
BLOCK.mount("blk-cinemagraph", function (k) {
  var P = k.P, w = k.w, h = k.h, M = Math.min(w, h), r = k.random;
  var cx = w * P.steam_x / 100, cy = h * P.steam_y / 100, foto = k.root.querySelector(".blk-foto");

    gd.addColorStop(0, BLOCK.mix(P.wall_color, "#ffd9a8", 0.55)); gd.addColorStop(0.5, P.wall_color); gd.addColorStop(1, BLOCK.mix(P.wall_color, "#000000", 0.6));

    var gm = x.createLinearGradient(0, mejaY, 0, h); gm.addColorStop(0, "#6b4a35"); gm.addColorStop(1, "#2a1c15");
    x.fillStyle = gm; x.fillRect(0, mejaY, w, h - mejaY);
    for (var i = 0; i < 26; i++) { x.strokeStyle = "rgba(0,0,0," + r.range(0.04, 0.12) + ")"; x.lineWidth = r.range(1, 3) * k.s; var yy = mejaY + r() * (h - mejaY); x.beginPath(); x.moveTo(0, yy); x.bezierCurveTo(w * 0.3, yy + r.range(-8, 8), w * 0.7, yy + r.range(-8, 8), w, yy); x.stroke(); }
    x.fillStyle = "rgba(0,0,0,.35)"; x.beginPath(); x.ellipse(cx + 0.04 * M, mejaY + 0.01 * M, cw * 1.25, 0.035 * M, 0, 0, 7); x.fill();
    x.fillStyle = BLOCK.mix(P.cup_color, "#8a7a6a", 0.25); x.beginPath(); x.ellipse(cx, mejaY - 0.005 * M, cw * 1.05, 0.03 * M, 0, 0, 7); x.fill();
    var gc = x.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
    gc.addColorStop(0, BLOCK.mix(P.cup_color, "#000000", 0.25)); gc.addColorStop(0.35, P.cup_color); gc.addColorStop(1, BLOCK.mix(P.cup_color, "#000000", 0.45));
    x.strokeStyle = BLOCK.mix(P.cup_color, "#000000", 0.3); x.lineWidth = 0.022 * M; x.beginPath(); x.ellipse(cx + cw * 0.55, cy + ch * 0.45, cw * 0.2, ch * 0.24, 0, -1.4, 1.4); x.stroke();
    x.fillStyle = gc; x.beginPath(); x.moveTo(cx - cw / 2, cy); x.lineTo(cx + cw / 2, cy); x.bezierCurveTo(cx + cw / 2, cy + ch * 1.0, cx + cw * 0.3, cy + ch, cx, cy + ch); x.bezierCurveTo(cx - cw * 0.3, cy + ch, cx - cw / 2, cy + ch, cx - cw / 2, cy); x.fill();
    x.fillStyle = "#3a2015"; x.beginPath(); x.ellipse(cx, cy, cw / 2, 0.018 * M, 0, 0, 7); x.fill();
    x.strokeStyle = BLOCK.mix(P.cup_color, "#ffffff", 0.4); x.lineWidth = 2 * k.s; x.stroke();
    var vg = x.createRadialGradient(w / 2, h / 2, M * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");

  // wilayah hidup: gumpal uap periodik (periode membagi durasi -> render berulang mulus)
  var uap = BLOCK.canvas(k.root, w, h), u = uap.ctx, Np = Math.max(4, Math.round(P.blob_count));
  var T = k.dur / Math.max(1, Math.round(k.dur / P.period)), H = P.steam_height / 100 * h, R = P.window_width / 100 * M;
  var gump = []; for (var j = 0; j < Np; j++) gump.push({ f: j / Np, x: r.range(-0.3, 0.3), a: r.range(0.6, 1.4), s: r.range(0, 6.28), n: r.int(1, 2) });
  BLOCK.onTime(k.tl, function (t) {
    u.clearRect(0, 0, w, h); u.globalCompositeOperation = "source-over";
    var ph = t / T;
    for (var j = 0; j < Np; j++) {
      var g = gump[j], age = ((ph * g.n + g.f) % 1 + 1) % 1;

});
