<!-- Block gallery/shuffle-stack · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="gallery/shuffle-stack" data-start="0" data-duration="5.5" data-track-index="8" class="blk blk-gallery-shuffle-stack">
<script type="application/json" data-block-props>
{"image": [], "label": ["Ide", "Sketsa", "Rancang", "Rilis"], "count": 4, "gesture": [0.8, 2.0, 2.45, 3.8], "throw_duration": 0.95, "width": 360, "card_aspect": 0.78, "stack_gap": 38, "throw_height": 300, "side": 1, "position_x": 50, "position_y": 80, "font": "Inter:wght@600;800", "seed": 11}
</script>
<div class="blk-tumpuk"></div>
</div>
<style>
.blk-gallery-shuffle-stack{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-gallery-shuffle-stack .blk-tumpuk{position:absolute;width:0;height:0}
.blk-gallery-shuffle-stack .blk-kartu{position:absolute;overflow:hidden;box-sizing:border-box;padding:1.6em;transform-origin:50% 100%}
.blk-gallery-shuffle-stack .blk-kartu b{position:absolute;left:1.4em;bottom:1.1em;font-weight:800;font-size:3.2em;letter-spacing:-.02em;color:#fff}
.blk-gallery-shuffle-stack .blk-kartu i{position:absolute;left:1.6em;top:1.5em;font-style:normal;font-weight:600;font-size:1.1em;letter-spacing:.16em;color:rgba(255,255,255,.8)}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, st = k.root.querySelector(".blk-tumpuk");
  st.style.left = P.position_x + "%"; st.style.top = P.position_y + "%";
  var N = BLOCK.clamp(Math.round(P.count), 2, 6), W = P.width * k.s, H = W / (P.card_aspect || 0.78), gap = P.stack_gap * k.s;
  var PAL = [["#ff9a62", "#d9465f"], ["#7ee0d6", "#2d6cdf"], ["#ffd36e", "#ef7b45"], ["#b69cff", "#5b3fd1"], ["#a8e48a", "#2f8f6a"], ["#ff9cc2", "#a23d8a"]];
  var POLA = ["radial-gradient(circle at 78% 22%,rgba(255,255,255,.35) 0 12%,transparent 13%)", "repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 6%,transparent 6% 12%)", "radial-gradient(rgba(255,255,255,.25) 12%,transparent 14%) 0 0/14% 11%"];
  var g = P.image || [], off = k.random.int(0, 5), el = [];
  for (var i = 0; i < N; i++) {
    var p = PAL[(i + off) % PAL.length];
    var c = BLOCK.el("div", { class: "blk-kartu", style: "left:" + -W / 2 + "px;top:" + -H + "px;width:" + W + "px;height:" + H + "px;border-radius:" + 26 * k.s + "px;font-size:" + 16 * k.s + "px;font-family:" + BLOCK.family(P.font) +
      ";box-shadow:0 " + 20 * k.s + "px " + 50 * k.s + "px rgba(0,0,0,.35);background:" + (g.length ? "center/cover url('" + g[i % g.length] + "')" : POLA[i % POLA.length] + ",linear-gradient(155deg," + p[0] + "," + p[1] + ")") }, st,
      "<i>" + ("0" + (i + 1)).slice(-2) + "</i><b>" + BLOCK.esc((P.label || [])[i] || "") + "</b>");
    el.push(c);
  }
  // urutan diskret per isyarat: kartu paling belakang dilempar ke depan
  var cues = (P.gesture || []).slice().sort(function (a, b) { return a - b; }), order = [], lempar = [];
  for (i = 0; i < N; i++) order.push(i);
  cues.forEach(function (tc) { var b = order[N - 1]; lempar.push(b); order = [b].concat(order.slice(0, N - 1)); });
  var Dl = P.throw_duration, Ht = P.throw_height * k.s;
  function eLempar(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function ePegas(p) { return p <= 0 ? 0 : p >= 1 ? 1 : BLOCK.spring(p * 1.2, 1.6, 0.45) * (1 - p) + p; }
  BLOCK.onTime(k.tl, function (t) {
    var masuk = 1 - Math.pow(1 - BLOCK.clamp(t / 0.7, 0, 1), 3);
    for (var i = 0; i < N; i++) {
      // posisi slot kontinu = jumlah sumbangan semua isyarat (tumpang-tindih -> kecepatan tersambung)
      var slot = i, lift = 0, rot = 0, sx = 0, squash = 0, terbang = false;
      for (var c = 0; c < cues.length; c++) {
        var pp = (t - cues[c]) / Dl; if (pp <= 0) continue; var q = Math.min(pp, 1);
        if (lempar[c] === i) {
          slot -= (N - 1) * eLempar(q);
          if (pp < 1) { lift += Math.sin(Math.PI * q) * Ht; rot += Math.sin(Math.PI * q) * 14 * P.side; sx += Math.sin(Math.PI * q) * W * 0.55 * P.side; terbang = q > 0.45; }
          var lp = (t - cues[c] - Dl) / 0.5; if (lp > 0 && lp < 1) squash += Math.exp(-5 * lp) * Math.cos(lp * 14) * 0.08;
        } else {
          var e2 = ePegas(BLOCK.clamp((pp - 0.55) / 0.9, 0, 1)); slot += e2;
          var lp2 = (pp - 0.85) / 0.6; if (lp2 > 0 && lp2 < 1) squash += Math.sin(Math.PI * lp2) * 0.035 * Math.exp(-2 * lp2);
        }
      }
      var sc = 1 - slot * 0.055, d = BLOCK.clamp(slot / (N - 1), 0, 1);
      var e = el[i];
      e.style.transform = "translate(" + sx.toFixed(1) + "px," + (-slot * gap - lift + (1 - masuk) * 300 * k.s).toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + (sc * (1 + squash * 0.6)).toFixed(4) + "," + (sc * (1 - squash)).toFixed(4) + ")";
      e.style.zIndex = terbang ? 999 : Math.round(500 - slot * 100);
      e.style.filter = "brightness(" + (1 - 0.35 * d).toFixed(3) + ")";
      e.style.opacity = masuk.toFixed(3);
    }
  }, k.dur);
  k.tl.to(st, { autoAlpha: 0, y: 40 * k.s, duration: 0.45, ease: "power2.in" }, k.dur - 0.5);
}, { font: true });
</script>
