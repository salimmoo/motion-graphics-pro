<script type="application/json" data-block-props>
{"layout": "hero-two", "image": [], "label": ["Pagi di pasar", "Jalan pulang", "Senja di dermaga", "Kopi pertama", "Hujan sore", "Lampu kota"], "side_fill": "blur", "edge": 4, "gap": 1.6, "radius": 22, "pause": 0.12, "start_scale": 1.22, "grid_texture": true, "bg_color": "#101219", "seed": 8}
</script>
</div>
<style>
.blk-gallery-media-grid{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-gallery-media-grid .blk-sel{position:absolute;overflow:hidden}
.blk-gallery-media-grid .blk-media{position:absolute;inset:0;background-size:cover;background-position:center}
.blk-gallery-media-grid .blk-lb{position:absolute;left:1.2em;bottom:1em;font:600 1.6em/1.1 "Inter",system-ui,sans-serif;color:#fff;text-shadow:0 .1em .6em rgba(0,0,0,.35)}

</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, w = k.w, h = k.h, root = k.root;
  root.style.background = P.bg_color;
  var PAL = [["#ffb36b", "#d9465f", "#5a1f3a"], ["#8ee6dc", "#2d6cdf", "#10233f"], ["#ffe08a", "#ef7b45", "#6b2b1e"], ["#c6b2ff", "#5b3fd1", "#1f1650"], ["#b9ec9b", "#2f8f6a", "#123b2e"], ["#ffb3d0", "#a23d8a", "#3a1235"]];
  var off = k.random.int(0, 5), g = P.image || [];
  // media placeholder: langit bergradien + matahari + dua lapis bukit
  function media(i) {
    if (g.length) return "url('" + g[i % g.length] + "')";
    var p = PAL[(i + off) % PAL.length], sx = 25 + (i * 23) % 50;
    return "radial-gradient(circle at " + sx + "% 34%,rgba(255,255,255,.85) 0 5%,rgba(255,255,255,0) 5.5%)," +
      "radial-gradient(120% 60% at 30% 100%," + p[2] + " 0 55%,transparent 56%)," +
      "radial-gradient(110% 55% at 85% 100%," + BLOCK.mix(p[1], p[2], 0.5) + " 0 60%,transparent 61%)," +
      "linear-gradient(180deg," + p[0] + "," + p[1] + ")";
  }
  var sel = [], fs = 16 * k.s;
  function buatSel(x, y, ww, hh, i, isi) {
    var c = BLOCK.el("div", { class: "blk-sel", style: "left:" + x + "px;top:" + y + "px;width:" + ww + "px;height:" + hh + "px;border-radius:" + P.radius * k.s + "px;font-size:" + fs + "px" }, root);
    var m = BLOCK.el("div", { class: "blk-media", style: "background-image:" + (isi || media(i)) }, c);
    if (!g.length && P.label && P.label[i]) BLOCK.el("div", { class: "blk-lb" }, c, BLOCK.esc(P.label[i]));
    sel.push({ c: c, m: m }); return c;
  }
  if (P.layout === "vertical") {
    // media potret mengisi bingkai lebar: sisi diisi blur, cermin, atau salinan
    var pw = Math.min(w, h * 9 / 16), px = (w - pw) / 2, sm = media(0), gaya = P.side_fill;
    if (gaya === "blur") BLOCK.el("div", { class: "blk-media", style: "background-image:" + sm + ";filter:blur(" + 40 * k.s + "px) brightness(.6) saturate(1.2);transform:scale(1.15)" }, root);
    else for (var s = -2; s <= 2; s++) if (s) {
      var cp = BLOCK.el("div", { class: "blk-media", style: "left:" + (px + s * pw) + "px;width:" + pw + "px;right:auto;background-image:" + sm + ";filter:brightness(.55)" + (gaya === "mirror" && s % 2 ? ";transform:scaleX(-1)" : "") }, root);
    }
    if (P.grid_texture) BLOCK.el("div", { class: "blk-kisi", style: "background-size:" + 40 * k.s + "px " + 40 * k.s + "px" }, root);
    var fg = buatSel(px, 0, pw, h, 0, sm); fg.style.borderRadius = 0; fg.style.filter = "contrast(1.08) saturate(1.08)";
    fg.style.boxShadow = "0 0 " + 80 * k.s + "px rgba(0,0,0,.55)";
  } else {
    var T = { "2": [[0, 0, .5, 1], [.5, 0, .5, 1]], "3": [[0, 0, 1 / 3, 1], [1 / 3, 0, 1 / 3, 1], [2 / 3, 0, 1 / 3, 1]],
      "4": [[0, 0, .5, .5], [.5, 0, .5, .5], [0, .5, .5, .5], [.5, .5, .5, .5]],
      "3x2": [[0, 0, 1 / 3, .5], [1 / 3, 0, 1 / 3, .5], [2 / 3, 0, 1 / 3, .5], [0, .5, 1 / 3, .5], [1 / 3, .5, 1 / 3, .5], [2 / 3, .5, 1 / 3, .5]],
      "hero-two": [[0, 0, .62, 1], [.62, 0, .38, .5], [.62, .5, .38, .5]] }[P.layout] || [[0, 0, .5, 1], [.5, 0, .5, 1]];
    if (h > w && (P.layout === "2" || P.layout === "3")) T = T.map(function (r) { return [r[1], r[0], r[3], r[2]]; }); // potret: susun vertikal
    if (h > w && P.layout === "hero-two") T = [[0, 0, 1, .6], [0, .6, .5, .4], [.5, .6, .5, .4]];
    var tp = P.edge / 100 * Math.min(w, h), gp = P.gap / 100 * Math.min(w, h), aw = w - 2 * tp, ah = h - 2 * tp;
    T.forEach(function (r, i) {
      buatSel(tp + r[0] * aw + (r[0] > 0 ? gp / 2 : 0), tp + r[1] * ah + (r[1] > 0 ? gp / 2 : 0),
        r[2] * aw - (r[0] > 0 ? gp / 2 : 0) - (r[0] + r[2] < 0.999 ? gp / 2 : 0), r[3] * ah - (r[1] > 0 ? gp / 2 : 0) - (r[1] + r[3] < 0.999 ? gp / 2 : 0), i);
    });
  }
  // masuk berbingkai (clip menyapu keluar dari tengah), isi menyusut pelan lalu mengendap
  sel.forEach(function (o, i) {
    var t0 = 0.15 + i * P.pause;
    tl.fromTo(o.c, { clipPath: "inset(50% 50% 50% 50% round " + P.radius * k.s + "px)" }, { clipPath: "inset(0% 0% 0% 0% round " + P.radius * k.s + "px)", duration: 0.8, ease: "expo.out" }, t0);
    tl.fromTo(o.m, { scale: P.start_scale }, { scale: 1.06, duration: 1.0, ease: "power3.out" }, t0)
      .to(o.m, { scale: 1, duration: Math.max(0.5, k.dur - t0 - 1.6), ease: "sine.inOut" }, t0 + 1.0);
    var lb = o.c.querySelector(".blk-lb");
    if (lb) tl.fromTo(lb, { autoAlpha: 0, y: 14 * k.s }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, t0 + 0.45);
  });
  tl.to(sel.map(function (o) { return o.c; }), { autoAlpha: 0, duration: 0.4, ease: "power2.in", stagger: 0.05 }, k.dur - 0.6);
});
</script>
