<script>
BLOCK.mount("blk-media-grid", function (k) {

    return "radial-gradient(circle at " + sx + "% 34%,rgba(255,255,255,.85) 0 5%,rgba(255,255,255,0) 5.5%)," +
      "radial-gradient(120% 60% at 30% 100%," + p[2] + " 0 55%,transparent 56%)," +
      "radial-gradient(110% 55% at 85% 100%," + BLOCK.mix(p[1], p[2], 0.5) + " 0 60%,transparent 61%)," +
      "linear-gradient(180deg," + p[0] + "," + p[1] + ")";

      "4": [[0, 0, .5, .5], [.5, 0, .5, .5], [0, .5, .5, .5], [.5, .5, .5, .5]],
      "3x2": [[0, 0, 1 / 3, .5], [1 / 3, 0, 1 / 3, .5], [2 / 3, 0, 1 / 3, .5], [0, .5, 1 / 3, .5], [1 / 3, .5, 1 / 3, .5], [2 / 3, .5, 1 / 3, .5]],
      "hero-two": [[0, 0, .62, 1], [.62, 0, .38, .5], [.62, .5, .38, .5]] }[P.layout] || [[0, 0, .5, 1], [.5, 0, .5, 1]];
    if (h > w && (P.layout === "2" || P.layout === "3")) T = T.map(function (r) { return [r[1], r[0], r[3], r[2]]; }); // potret: susun vertikal
    if (h > w && P.layout === "hero-two") T = [[0, 0, 1, .6], [0, .6, .5, .4], [.5, .6, .5, .4]];

    T.forEach(function (r, i) {
      buatSel(tp + r[0] * aw + (r[0] > 0 ? gp / 2 : 0), tp + r[1] * ah + (r[1] > 0 ? gp / 2 : 0),
        r[2] * aw - (r[0] > 0 ? gp / 2 : 0) - (r[0] + r[2] < 0.999 ? gp / 2 : 0), r[3] * ah - (r[1] > 0 ? gp / 2 : 0) - (r[1] + r[3] < 0.999 ? gp / 2 : 0), i);
    });
  }
  // masuk berbingkai (clip menyapu keluar dari tengah), isi menyusut pelan lalu mengendap
  sel.forEach(function (o, i) {
    var t0 = 0.15 + i * P.pause;
