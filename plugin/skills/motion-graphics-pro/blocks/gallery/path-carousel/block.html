<!-- Block gallery/path-carousel · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="gallery/path-carousel" data-start="0" data-duration="6" data-track-index="8" class="blk blk-gallery-path-carousel">
<script type="application/json" data-block-props>
{"image": [], "label": [], "count": 12, "shape": "arc", "card_size": 260, "card_aspect": 0.75, "min_scale": 0.45, "tangent_tilt": 0.6, "period": 1.5, "swing": 0.85, "steps": 1, "direction": 1, "corner_radius": 14, "show_path": true, "path_color": "#ffffff", "seed": 5}
</script>
<svg class="blk-jalur" preserveAspectRatio="none"><path fill="none"/></svg>
<div class="blk-panggung"></div>
</div>
<style>
.blk-gallery-path-carousel{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-gallery-path-carousel .blk-jalur{position:absolute;inset:0;width:100%;height:100%}
.blk-gallery-path-carousel .blk-panggung{position:absolute;inset:0}
.blk-gallery-path-carousel .blk-kartu{position:absolute;left:0;top:0;overflow:hidden;box-shadow:0 1.2em 2.6em rgba(0,0,0,.35)}
.blk-gallery-path-carousel .blk-no{position:absolute;left:9%;bottom:7%;font:800 calc(var(--kw)*.22px)/1 "Inter",system-ui,sans-serif;color:rgba(255,255,255,.94)}
.blk-gallery-path-carousel .blk-lb{position:absolute;left:9%;top:8%;font:600 calc(var(--kw)*.075px)/1.1 "Inter",system-ui,sans-serif;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.12em}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, w = k.w, h = k.h, st = k.root.querySelector(".blk-panggung");
  var N = Math.max(3, Math.round(P.count)), kw = P.card_size * k.s, kh = kw / (P.card_aspect || 0.75);
  k.root.style.setProperty("--kw", kw);
  var PAL = [["#ff9a62", "#d9465f"], ["#7ee0d6", "#2d6cdf"], ["#ffd36e", "#ef7b45"], ["#b69cff", "#5b3fd1"], ["#a8e48a", "#2f8f6a"], ["#ff9cc2", "#a23d8a"], ["#93d8ff", "#3150a8"], ["#f6c28b", "#8a4b2e"]];
  var POLA = ["radial-gradient(circle at 72% 28%,rgba(255,255,255,.4) 0 14%,transparent 15%)", "repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 7%,transparent 7% 14%)",
    "radial-gradient(rgba(255,255,255,.3) 14%,transparent 16%) 0 0/16% 12%", "linear-gradient(170deg,transparent 58%,rgba(0,0,0,.2) 58%)"];
  var g = P.image || [], off = k.random.int(0, 7), kartu = [];
  for (var i = 0; i < N; i++) {
    var c = BLOCK.el("div", { class: "blk-kartu", style: "width:" + kw + "px;height:" + kh + "px;font-size:" + k.s * 16 + "px;border-radius:" + P.corner_radius * k.s + "px" }, st);
    if (g.length) c.style.background = "center/cover no-repeat url('" + g[i % g.length] + "')";
    else {
      var p = PAL[(i + off) % PAL.length];
      c.style.background = POLA[i % POLA.length] + ",linear-gradient(150deg," + p[0] + "," + p[1] + ")";
      BLOCK.el("span", { class: "blk-no" }, c, ("0" + (i + 1)).slice(-2));
      if (P.label && P.label[i]) BLOCK.el("span", { class: "blk-lb" }, c, BLOCK.esc(P.label[i]));
    }
    kartu.push(c);
  }
  // lintasan terbuka u 0..1 -> [x, y] (pecahan layar); kedalaman ikut bentuk
  function bez(u, a, b, c2, d) { var v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c2 + u * u * u * d; }
  var BENTUK = {
    arc: function (u) { return [0.04 + 0.92 * u, 0.74 - 0.4 * Math.sin(Math.PI * u), Math.sin(Math.PI * u)]; },
    V: function (u) { var q = 1 - Math.abs(2 * u - 1); return [0.04 + 0.92 * u, 0.2 + 0.56 * q, q]; },
    diagonal: function (u) { return [0.06 + 0.88 * u, 0.84 - 0.66 * u, 1 - u]; },
    wave: function (u) { return [0.03 + 0.94 * u, 0.5 + 0.2 * Math.sin(Math.PI * 3 * u), 0.5 + 0.5 * Math.sin(Math.PI * u)]; },
    S: function (u) { return [bez(u, 0.06, 0.95, 0.05, 0.94), bez(u, 0.2, 0.05, 0.95, 0.8), Math.sin(Math.PI * u)]; }
  };
  var fn = BENTUK[P.shape] || BENTUK.arc;
  if (P.show_path) {
    var d = "";
    for (var j = 0; j <= 80; j++) { var q = fn(j / 80); d += (j ? "L" : "M") + (q[0] * w).toFixed(1) + " " + (q[1] * h).toFixed(1); }
    var pth = k.root.querySelector(".blk-jalur path"), sv = k.root.querySelector(".blk-jalur");
    sv.setAttribute("viewBox", "0 0 " + w + " " + h);
    pth.setAttribute("d", d); pth.setAttribute("stroke", P.path_color); pth.setAttribute("stroke-opacity", ".22");
    pth.setAttribute("stroke-width", 2 * k.s); pth.setAttribute("stroke-dasharray", 3 * k.s + " " + 9 * k.s);
    k.tl.fromTo(sv, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0).to(sv, { opacity: 0, duration: 0.5 }, k.dur - 0.5);
  }
  function ayun(t) { var u = t / P.period, n = Math.floor(u), q = u - n; return n + q + P.swing * Math.sin(2 * Math.PI * q) / (2 * Math.PI); }
  BLOCK.onTime(k.tl, function (t) {
    var geser = ayun(t) * P.steps * (P.direction < 0 ? -1 : 1) / N;
    var masuk = BLOCK.smooth(t / 0.7), keluar = 1 - BLOCK.smooth((t - (k.dur - 0.5)) / 0.5);
    for (var i = 0; i < N; i++) {
      var u = ((i / N + geser) % 1 + 1) % 1, uu = -0.06 + 1.12 * u;
      var a = fn(BLOCK.clamp(uu, 0, 1)), b = fn(BLOCK.clamp(uu + 0.004, 0, 1)), a0 = fn(BLOCK.clamp(uu - 0.004, 0, 1));
      var dx = (b[0] - a0[0]) * w, dy = (b[1] - a0[1]) * h, L = Math.hypot(dx, dy) || 1;
      var rot = Math.asin(BLOCK.clamp(dy / L, -1, 1)) * 180 / Math.PI * (dx < 0 ? -1 : 1) * P.tangent_tilt;
      var dd = BLOCK.clamp(a[2], 0, 1), sc = (P.min_scale + (1 - P.min_scale) * dd) * (0.7 + 0.3 * masuk);
      var tepi = Math.min(BLOCK.smooth(u / 0.08), BLOCK.smooth((1 - u) / 0.08));
      var c = kartu[i];
      c.style.transform = "translate(" + (a[0] * w - kw / 2) + "px," + (a[1] * h - kh / 2) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
      c.style.zIndex = Math.round(dd * 1000);
      c.style.opacity = (tepi * masuk * keluar).toFixed(3);
    }
  }, k.dur);
});
</script>
