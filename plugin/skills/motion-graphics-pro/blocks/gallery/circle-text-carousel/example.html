<body>
<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="6.5">

<!-- Block gallery/circle-text-carousel · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-circle-text-carousel" data-block="gallery/circle-text-carousel" data-start="0" data-duration="6" data-track-index="8" class="blk blk-gallery-circle-text-carousel">
<script type="application/json" data-block-props>
{"text": "Semua cerita dimulai dari satu gambar", "text2": "Ceritamu berikutnya", "style": "ring", "image": [], "count": 12, "card_size": 170, "card_aspect": 0.75, "period": 1.4, "swing": 0.85, "gather_time": 3.4, "cut_time": 4.1, "second_scale": 1.4, "color": "#f5f3ee", "keyword_color": "#ffcf4a", "font": "Inter:wght@700;800;900", "size": 84, "weight": 800, "seed": 4}
</script>
<div class="blk-panggung"></div>
<div class="blk-baris blk-b1"></div>
<div class="blk-baris blk-b2"></div>
</div>
<style>
.blk-gallery-circle-text-carousel{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-gallery-circle-text-carousel .blk-panggung{position:absolute;inset:0}
.blk-gallery-circle-text-carousel .blk-kartu{position:absolute;left:0;top:0;overflow:hidden;box-shadow:0 1em 2.2em rgba(0,0,0,.4)}
.blk-gallery-circle-text-carousel .blk-no{position:absolute;left:9%;bottom:7%;font:800 calc(var(--kw)*.22px)/1 "Inter",system-ui,sans-serif;color:rgba(255,255,255,.94)}
.blk-gallery-circle-text-carousel .blk-baris{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);text-align:center;line-height:1.1;letter-spacing:-.02em;z-index:500}
.blk-gallery-circle-text-carousel .blk-topeng{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .08em}
.blk-gallery-circle-text-carousel .blk-kunci{color:var(--kunci)}
</style>
<script>
BLOCK.mount("blk-circle-text-carousel", function (k) {
  var P = k.P, tl = k.tl, w = k.w, h = k.h, st = k.root.querySelector(".blk-panggung");
  var b1 = k.root.querySelector(".blk-b1"), b2 = k.root.querySelector(".blk-b2");
  var css = ";color:" + P.color + ";--kunci:" + P.keyword_color + ";font-family:" + BLOCK.family(P.font) + ";font-weight:" + P.weight;
  b1.style.cssText += css + ";font-size:" + Math.round(P.size * k.s) + "px";
  b2.style.cssText += css + ";font-size:" + Math.round(P.size * P.second_scale * k.s) + "px";
  // topeng per kata: kata naik dari balik garis bawah topengnya
  var kata = BLOCK.split(b1, P.text, "words").map(function (u) {
    var m = document.createElement("span"); m.className = "blk-topeng"; u.parentNode.insertBefore(m, u); m.appendChild(u); return u;
  });
  BLOCK.split(b2, P.text2, "words");
  tl.fromTo(kata, { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "power4.out", stagger: 0.12 }, 0.3);
  BLOCK.initial(tl, b2, { autoAlpha: 0 });
  tl.set(b1, { autoAlpha: 0 }, P.cut_time).set(b2, { autoAlpha: 1 }, P.cut_time)
    .fromTo(b2, { scale: 1.12 }, { scale: 1, duration: 0.7, ease: "expo.out" }, P.cut_time)
    .to(b2, { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, k.dur - 0.45);

  var N = Math.max(4, Math.round(P.count)), kw = P.card_size * k.s, kh = kw / (P.card_aspect || 0.75);
  k.root.style.setProperty("--kw", kw);
  var PAL = [["#ff9a62", "#d9465f"], ["#7ee0d6", "#2d6cdf"], ["#ffd36e", "#ef7b45"], ["#b69cff", "#5b3fd1"], ["#a8e48a", "#2f8f6a"], ["#ff9cc2", "#a23d8a"], ["#93d8ff", "#3150a8"], ["#f6c28b", "#8a4b2e"]];
  var POLA = ["radial-gradient(circle at 72% 28%,rgba(255,255,255,.4) 0 14%,transparent 15%)", "repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 7%,transparent 7% 14%)",
    "radial-gradient(rgba(255,255,255,.3) 14%,transparent 16%) 0 0/16% 12%", "linear-gradient(170deg,transparent 58%,rgba(0,0,0,.2) 58%)"];
  var g = P.image || [], off = k.random.int(0, 7), kartu = [];
  for (var i = 0; i < N; i++) {
    var c = BLOCK.el("div", { class: "blk-kartu", style: "width:" + kw + "px;height:" + kh + "px;font-size:" + 16 * k.s + "px;border-radius:" + 14 * k.s + "px" }, st);
    if (g.length) c.style.background = "center/cover no-repeat url('" + g[i % g.length] + "')";
    else {
      var p = PAL[(i + off) % PAL.length];
      c.style.background = POLA[i % POLA.length] + ",linear-gradient(150deg," + p[0] + "," + p[1] + ")";
      BLOCK.el("span", { class: "blk-no" }, c, ("0" + (i + 1)).slice(-2));
    }
    kartu.push(c);
  }
  var GAYA = {
    ring: function (a) { return [0.42 * w * Math.sin(a), 0.24 * h * Math.cos(a), Math.cos(a), 0]; },
    wheel: function (a) { return [0.08 * w * Math.cos(a), 0.36 * h * Math.sin(a), Math.cos(a), -8 * Math.sin(a)]; },
    flat: function (a) { var r = 0.36 * Math.min(w, h); return [r * Math.sin(a), r * Math.cos(a), Math.cos(a), -a * 180 / Math.PI * 0.25]; },
    skew: function (a) { var x = 0.4 * w * Math.sin(a), y = 0.16 * h * Math.cos(a), q = -0.3; return [x * Math.cos(q) - y * Math.sin(q), x * Math.sin(q) + y * Math.cos(q), Math.cos(a), -10]; },
    fan: function (a) { return [0.42 * w * Math.sin(a), -0.24 * h * Math.cos(a), Math.cos(a), 22 * Math.sin(a)]; }
  };
  var fn = GAYA[P.style] || GAYA.ring;
  function ayun(t) { var u = t / P.period, n = Math.floor(u), q = u - n; return n + q + P.swing * Math.sin(2 * Math.PI * q) / (2 * Math.PI); }
  var T1 = P.gather_time, T2 = P.cut_time;
  BLOCK.onTime(k.tl, function (t) {
    // datang dari luar bingkai (radius 2.6x -> 1), lalu runtuh ke pusat sebelum potongan keras
    var dt = 1 - Math.pow(1 - BLOCK.clamp(t / 1.8, 0, 1), 3), rk = BLOCK.progress(t, T1, T2), kol = rk * rk * rk;
    var Rf = BLOCK.lerp(2.6, 1, dt) * (1 - kol), rot = ayun(t) * 2 * Math.PI / N + kol * 2.2;
    for (var i = 0; i < N; i++) {
      var a = 2 * Math.PI * i / N - rot, v = fn(a), d = (v[2] + 1) / 2, c = kartu[i];
      var sc = (0.42 + 0.58 * d * d) * (1 - 0.7 * kol);
      c.style.transform = "translate(" + (w / 2 + v[0] * Rf - kw / 2) + "px," + (h / 2 + v[1] * Rf - kh / 2) + "px) rotate(" + v[3] + "deg) scale(" + sc.toFixed(4) + ")";
      c.style.zIndex = Math.round(d * 1000);
      c.style.opacity = t >= T2 ? 0 : 1;
      c.style.filter = "brightness(" + (0.45 + 0.55 * d).toFixed(3) + ")";
    }
  }, k.dur);
}, { font: true });
</script>
</div>
