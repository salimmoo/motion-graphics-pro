  function aturan(bhs) {

    var bar = BLOCK.el("div", { style: "position:absolute;left:0;right:0;top:0;height:" + 44 * s + "px;background:" + T.panel + ";border-bottom:1px solid " + T.garis + ";display:flex;align-items:center;justify-content:center;color:" + T.redup + ";font:500 " + 16 * s + "px " + mono }, win, BLOCK.esc(judul));
    ["#ff5f57", "#febc2e", "#28c840"].forEach(function (c, i) { BLOCK.el("div", { style: "position:absolute;left:" + (18 + i * 22) * s + "px;top:50%;width:" + 12 * s + "px;height:" + 12 * s + "px;margin-top:" + (-6 * s) + "px;border-radius:50%;background:" + c }, bar); });

    var view = E("div", { style: "position:absolute;inset:" + pad + "px;overflow:hidden;font:" + fs + "px/" + lh + "px " + mono + ";color:" + T.teks }, j.isi);
    var box = E("div", { class: "isi" }, view), rows = [], chars = [], t = +P.start, prompts = [];
    function warnaKeluar(x) { return /^✓|selesai|built/i.test(x) ? T.tambah : /^(✗|error|gagal)/i.test(x) ? T.hapus : /^(!|warn)/i.test(x) ? T.atr : /^>/.test(x) ? T.redup : T.teks; }
    function promptRow(tm) {

      E("span", { style: "color:" + T.redup }, r, BLOCK.esc(P.prompt) + " ");
      rows.push({ el: r, t: tm }); prompts.push({ el: r, t: tm, ch: [] });
      return prompts[prompts.length - 1];

    P.session.forEach(function (S) {
      var pr = promptRow(t);
      t += 0.35;
      sorot(S.perintah, "bash")[0].forEach(function (tk) {
        Array.from(tk.t).forEach(function (ch) {
