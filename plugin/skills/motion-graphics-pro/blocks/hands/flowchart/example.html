  }
  function boil(t) { return Math.floor(t * 8 + 1e-6); } // bentuk berganti tiap 1/8 detik
  function kotak(x, y, ww, hh, n, lebih) { // keliling kotak mulai kiri atas searah jarum jam, ujung melewati awal sedikit

    for (var i = 0; i <= n; i++) {

  function elips(cx, cy, rx, ry, n, a0, putar, spiral) {
    var out = []; n = n || 36; putar = putar || 1.1; spiral = spiral == null ? 0.06 : spiral;
    for (var i = 0; i <= n; i++) { var a = a0 + (i / n) * putar * 2 * Math.PI, f = 1 + spiral * (i / n - 0.5); out.push([cx + rx * f * Math.cos(a), cy + ry * f * Math.sin(a)]); }

  function tekstur(svg, jenis, s, uid) { // polos | lembut | tajam | semprot -> {filter, lebar}

      var f = BLOCK.svg("filter", { id: id, x: "-20%", y: "-20%", width: "140%", height: "140%" }, df);

  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var S = k.s, vert = P.mode === "vertical", W = P.node_width * S, H = P.node_height * S, catatan = P.style === "note";
  var nodes = (P.node || []).map(function (n, i) { return { id: n.id, teks: n.teks, x: n.x, y: n.y, i: i, lv: 0 }; }), byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });
  var edges = (P.links || []).filter(function (e) { return byId[e[0]] && byId[e[1]]; });
  // tingkat = jalur terpanjang dari akar (tanpa siklus)
  for (var it = 0; it < nodes.length; it++) edges.forEach(function (e) { var a = byId[e[0]], b = byId[e[1]]; if (b.lv < a.lv + 1 && a.lv + 1 < nodes.length) b.lv = a.lv + 1; });
  var nLv = 0, perLv = {}; nodes.forEach(function (n) { nLv = Math.max(nLv, n.lv); (perLv[n.lv] = perLv[n.lv] || []).push(n); });

  nodes.forEach(function (n) {

    else { n.cx = w * tp + W / 2 + u * (w * (1 - 2 * tp) - W); n.cy = h / 2 + off; }

  var T0 = P.start, J = P.pause;

    if (catatan) {

    } else {

      n.p = goresan(svg, P.color, tb, tx);
      n.pts = kotak(n.cx - W / 2, n.cy - H / 2, W, H, 30, 0.07);
      n.el = BLOCK.el("div", { class: "blk-lb", style: css }, root);
      tl.fromTo(n.fill, { opacity: 0 }, { opacity: 1, duration: 0.4 }, n.t + 0.2);

    if (!catatan) tl.fromTo(n.span, { autoAlpha: 0, y: 8 * S }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, n.t + 0.45);
  });
  // konektor lengkung dari sisi keluar ke sisi masuk, kepala panah, label cabang
  edges.forEach(function (e) {
    var a = byId[e[0]], b = byId[e[1]], A, B, C1, C2;
    if (vert) { A = [a.cx, a.cy + H / 2 + 8 * S]; B = [b.cx, b.cy - H / 2 - 10 * S]; C1 = [A[0], (A[1] + B[1]) / 2]; C2 = [B[0], (A[1] + B[1]) / 2]; }

    var q = pts[16], ang = Math.atan2(B[1] - q[1], B[0] - q[0]), hk = 20 * S;

    if (e[2]) {
      var m = pts[9], sg = vert ? (b.cx < a.cx - 1 ? -1 : 1) : (b.cy > a.cy + 1 ? 1 : -1);
      var kl = BLOCK.el("div", { class: "blk-kl", style: "left:" + (m[0] + (vert ? sg * 40 * S : 0)) + "px;top:" + (m[1] + (vert ? 0 : sg * 32 * S)) + "px;font-family:" + fam + ";font-size:" + P.size * 0.8 * S + "px;color:" + P.label_color }, root);
      kl.textContent = e[2];
      tl.fromTo(kl, { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, ob.t + 0.35);

    tl.fromTo(kur, { x: w * 1.05, y: h * 1.05 }, { x: tg.cx + W * 0.25, y: tg.cy + H * 0.1, duration: 0.9, ease: "power3.inOut" }, Tk)

    });
    edges.forEach(function (e, i) {
      var o = e.ob; gambar(o.p, wob(o.pts, amp * 0.7, P.seed + 300 + i * 11 + b * 7), BLOCK.smooth((t - o.t) / 0.5));
