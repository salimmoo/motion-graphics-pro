<script>
BLOCK.mount("blk-circle", function (k) {
  var P = k.P, tl = k.tl, w = k.w, h = k.h, svg = k.root.querySelector(".blk-svg"), g = svg.querySelector(".blk-bentuk"), lb = k.root.querySelector(".blk-lb");
  // ---- helper tangan (lokal di blok ini): goresan bergoyang berseed, boil per 1/8 detik, tekstur goresan

    var q = pts.map(function (p, i) { return [p[0] + amp * BLOCK.noise(i * 0.83 + 0.3, seed), p[1] + amp * BLOCK.noise(i * 0.83 + 5.1, seed + 17)]; });

    }

  }
  function boil(t) { return Math.floor(t * 8 + 1e-6); } // bentuk berganti tiap 1/8 detik
  function kotak(x, y, ww, hh, n, lebih) { // keliling kotak mulai kiri atas searah jarum jam, ujung melewati awal sedikit

  var tx = tekstur(svg, P.texture, k.s, k.id), tb = P.thickness * k.s, amp = 5 * k.s * P.wobble;

    lb.style.translate = (BLOCK.boil(t, P.seed + 2) * k.s * P.wobble).toFixed(2) + "px " + (BLOCK.boil(t, P.seed + 4) * k.s * P.wobble).toFixed(2) + "px";
  }, k.dur);
  tl.to([svg, lb], { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, k.dur - 0.4);
}, { font: true });
