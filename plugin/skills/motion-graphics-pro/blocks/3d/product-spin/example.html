<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;--s:1;font-family:"Inter",system-ui,sans-serif}

.adegan{position:absolute;inset:0;overflow:hidden}
.ad-judul{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 calc(var(--s)*150px)/1 "Inter",system-ui,sans-serif;letter-spacing:-.02em}
.ad-sub{position:absolute;left:0;right:0;top:calc(50% + var(--s)*110px);text-align:center;font:500 calc(var(--s)*40px)/1.2 "Inter",system-ui,sans-serif;opacity:.75;letter-spacing:.2em;text-transform:uppercase}
.ad-a{background:radial-gradient(120% 90% at 30% 20%,#ffb347 0%,#e8553d 45%,#5a1f3a 100%);color:#fff7ea}
.ad-b{background:radial-gradient(120% 90% at 70% 30%,#7ee0d6 0%,#2d6cdf 50%,#10233f 100%);color:#f2fbff}
.ad-gelap{background:radial-gradient(110% 80% at 50% 35%,#2b2f45 0%,#12131c 70%);color:#f5f3ee}
.ad-terang{background:linear-gradient(160deg,#f7f3ea 0%,#e9e2d3 100%);color:#1d1b18}
.ad-kertas{background:#efe6d2;color:#2a2420}

.ad-foto{background:linear-gradient(180deg,#8fc3e8 0%,#f6d7b0 58%,#d98c5f 59%,#7a4b3a 100%)}

.ad-foto .bk1{position:absolute;left:-10%;right:-10%;bottom:28%;height:30%;background:#5f7f6a;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .bk2{position:absolute;left:30%;right:-30%;bottom:20%;height:34%;background:#3f5f52;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .tanah{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2f463d,#1f2e29)}
.ad-foto .sosok{position:absolute;left:40%;bottom:18%;width:calc(var(--s)*120px);height:calc(var(--s)*330px);background:#18201d;border-radius:calc(var(--s)*60px) calc(var(--s)*60px) calc(var(--s)*14px) calc(var(--s)*14px)}
.ad-foto .sosok::before{content:"";position:absolute;left:18%;top:-26%;width:64%;height:26%;border-radius:50%;background:#18201d}

<body>
<div id="stage" data-composition-id="example" data-width="1920" data-height="1080" data-duration="6.5">

<!-- Block 3d/product-spin · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-product-spin" data-block="3d/product-spin" data-start="0" data-duration="6" data-track-index="4" class="blk blk-3d-product-spin">
<script type="application/json" data-block-props>
{"shape": "can", "label": "SEGAR", "sub": "teh melati dingin", "product_color": "#e2483d", "label_color": "#fff4e0", "accent_color": "#ffcc4d", "bg_color": "#232838", "plinth_color": "#e9e3d7", "turns": 1, "skew": 10, "size": 1, "position_x": 50, "font": "Archivo Black:wght@400", "font2": "Inter:wght@500;700"}
</script>
</div>
<style>
.blk-3d-product-spin{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-3d-product-spin .blk-pan{position:absolute;inset:0}
.blk-3d-product-spin .blk-pan *{position:absolute;box-sizing:border-box}
.blk-3d-product-spin .blk-badan{transform-style:preserve-3d}
.blk-3d-product-spin .blk-sisi{overflow:hidden;backface-visibility:hidden}
.blk-3d-product-spin .blk-lbl{top:0;height:100%}
.blk-3d-product-spin .blk-lbl b{white-space:nowrap;line-height:1;text-align:center}
</style>
<script>
BLOCK.mount("blk-product-spin", function (k) {
var P = k.P, s = k.s * (+P.size || 1), tl = k.tl, W = k.w, H = k.h;
  var cx = W * P.position_x / 100, base = H * 0.74, tilt = +P.skew;
  k.root.style.background = "radial-gradient(90% 70% at 50% 38%," + BLOCK.mix(P.bg_color, "#ffffff", 0.16) + "," + P.bg_color + " 60%," + BLOCK.mix(P.bg_color, "#000000", 0.45) + ")";
  var pan = BLOCK.el("div", { class: "blk-pan" }, k.root), fam = BLOCK.family(P.font), fam2 = BLOCK.family(P.font2);
  var sinT = Math.sin(tilt * Math.PI / 180);
  // panggung (plinth): statis karena simetris putar
  var pr = 330 * s, ph = 70 * s, el = Math.max(10 * s, pr * sinT * 2.2);
  BLOCK.el("div", { style: "left:" + (cx - pr) + "px;top:" + (base) + "px;width:" + 2 * pr + "px;height:" + (ph + el / 2) + "px;border-radius:0 0 50% 50%/0 0 " + el / 2 + "px " + el / 2 + "px;background:linear-gradient(90deg," + BLOCK.mix(P.plinth_color, "#000", 0.42) + "," + BLOCK.mix(P.plinth_color, "#000", 0.12) + " 40%," + BLOCK.mix(P.plinth_color, "#000", 0.3) + ")" }, pan);
  BLOCK.el("div", { style: "left:" + (cx - pr) + "px;top:" + (base - el / 2) + "px;width:" + 2 * pr + "px;height:" + el + "px;border-radius:50%;background:radial-gradient(60% 80% at 45% 40%," + BLOCK.mix(P.plinth_color, "#fff", 0.35) + "," + P.plinth_color + " 70%," + BLOCK.mix(P.plinth_color, "#000", 0.1) + ")" }, pan);
  var kotak = P.shape === "box", botol = P.shape === "bottle";
  var r = (botol ? 105 : kotak ? 120 : 112) * s, h = (botol ? 330 : kotak ? 380 : 400) * s, top = base - h - (botol ? 0 : 0);
  BLOCK.el("div", { style: "left:" + (cx - r * 1.5) + "px;top:" + (base - el * 0.28) + "px;width:" + r * 3 + "px;height:" + el * 0.56 + "px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0));" }, pan);
  var prod = BLOCK.el("div", { style: "left:0;top:0;width:100%;height:100%" }, pan);
  // isi label (satu lembar selebar keliling)
  var circ = 2 * Math.PI * r, lw = kotak ? 2 * r : circ;
  function isiLabel(w, hh) {
    return "<div style='left:0;top:0;width:" + w + "px;height:" + hh + "px;background:" + P.product_color + "'>" +
      "<div style='left:0;right:0;top:" + hh * 0.14 + "px;height:" + hh * 0.035 + "px;background:" + P.accent_color + "'></div>" +
      "<div style='left:0;right:0;bottom:" + hh * 0.14 + "px;height:" + hh * 0.035 + "px;background:" + P.accent_color + "'></div>" +
      "<b style='left:0;width:" + (kotak ? w : w * 0.5) + "px;top:" + hh * 0.36 + "px;font:" + Math.round(hh * 0.15) + "px/1 " + fam + ";color:" + P.label_color + ";letter-spacing:.02em'>" + BLOCK.esc(P.label) + "</b>" +
      "<b style='left:0;width:" + (kotak ? w : w * 0.5) + "px;top:" + hh * 0.55 + "px;font:500 " + Math.round(hh * 0.05) + "px/1 " + fam2 + ";color:" + P.label_color + ";letter-spacing:.18em;text-transform:uppercase;opacity:.9'>" + BLOCK.esc(P.sub) + "</b>" +
      (kotak ? "" : "<b style='left:" + w * 0.5 + "px;width:" + w * 0.5 + "px;top:" + hh * 0.4 + "px;font:700 " + Math.round(hh * 0.045) + "px/1.5 " + fam2 + ";color:" + P.label_color + ";opacity:.8'>350 ml · tanpa pengawet<br>dingin lebih nikmat</b>") + "</div>";
  }
  var cyl = BLOCK.el("div", { style: "left:0;top:0;width:100%;height:100%;perspective:" + 2400 * s + "px;perspective-origin:" + cx + "px " + (top + h / 2) + "px" }, prod);
  var badan = BLOCK.el("div", { class: "blk-badan", style: "left:" + cx + "px;top:" + (top + h / 2) + "px;width:0;height:0" }, cyl);
  var faces = [];
  if (kotak) {
    var d = r * 1.3;
    [[0, 2 * r, true], [90, d, false], [180, 2 * r, true], [270, d, false]].forEach(function (f, i) {
      var fw = f[1], dz = (i % 2 ? r : d / 2);
      var e = BLOCK.el("div", { class: "blk-sisi", style: "left:" + (-fw / 2) + "px;top:" + (-h / 2) + "px;width:" + fw + "px;height:" + h + "px;transform:rotateY(" + f[0] + "deg) translateZ(" + dz + "px)" }, badan);
      e.innerHTML = f[2] ? isiLabel(fw, h) : "<div style='inset:0;background:" + BLOCK.mix(P.product_color, "#000", 0.08) + "'><div style='left:0;right:0;top:" + h * 0.14 + "px;height:" + h * 0.035 + "px;background:" + P.accent_color + "'></div></div>";
      var sh = BLOCK.el("div", { style: "inset:0;background:#000;opacity:0" }, e);
      faces.push({ a: f[0], sh: sh });
    });
    var tp = BLOCK.el("div", { style: "left:" + (-r) + "px;top:" + (-d / 2) + "px;width:" + 2 * r + "px;height:" + d + "px;background:" + BLOCK.mix(P.product_color, "#fff", 0.18) + ";transform:rotateX(90deg) translateZ(" + h / 2 + "px)" }, badan);
  } else {
    var N = 40, sw = circ / N;
    var bh = botol ? h * 0.78 : h, by = botol ? h * 0.22 : 0;
    for (var i = 0; i < N; i++) {
      var e = BLOCK.el("div", { class: "blk-sisi", style: "left:" + (-sw / 2 - 0.5) + "px;top:" + (-h / 2 + by) + "px;width:" + (sw + 1.2) + "px;height:" + bh + "px;transform:rotateY(" + (i * 360 / N) + "deg) translateZ(" + (r - 0.5) + "px)" }, badan);
      var lb = BLOCK.el("div", { class: "blk-lbl", style: "left:" + (-i * sw) + "px;width:" + circ + "px" }, e);
      lb.innerHTML = isiLabel(circ, bh);
    }
    // bayangan studio di ruang layar (siluet silinder tetap)
    var shade = "linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 18%,rgba(255,255,255,.28) 30%,rgba(255,255,255,0) 40%,rgba(0,0,0,0) 62%,rgba(0,0,0,.35) 88%,rgba(0,0,0,.6) 100%)";
    BLOCK.el("div", { style: "left:" + (cx - r) + "px;top:" + (top + by) + "px;width:" + 2 * r + "px;height:" + bh + "px;background:" + shade }, prod);
    var ey = r * sinT * 2;
    if (botol) {
      // bahu, leher, tutup: bentuk statis 2D
      var nk = r * 0.36;
      BLOCK.el("div", { style: "left:" + (cx - r) + "px;top:" + (top + h * 0.06) + "px;width:" + 2 * r + "px;height:" + (h * 0.17 + ey / 2) + "px;border-radius:50% 50% 0 0/80% 80% 0 0;background:" + shade + "," + BLOCK.mix(P.product_color, "#fff", 0.25) }, prod);
      BLOCK.el("div", { style: "left:" + (cx - nk) + "px;top:" + (top - h * 0.05) + "px;width:" + 2 * nk + "px;height:" + h * 0.14 + "px;background:" + shade + "," + BLOCK.mix(P.product_color, "#fff", 0.3) }, prod);
      BLOCK.el("div", { style: "left:" + (cx - nk * 1.12) + "px;top:" + (top - h * 0.12) + "px;width:" + 2.24 * nk + "px;height:" + h * 0.08 + "px;border-radius:" + 6 * s + "px;background:" + shade + "," + P.accent_color }, prod);
    } else {
      // bibir dan tutup kaleng
      BLOCK.el("div", { style: "left:" + (cx - r) + "px;top:" + (top - ey / 2) + "px;width:" + 2 * r + "px;height:" + ey + "px;border-radius:50%;background:radial-gradient(70% 90% at 45% 40%,#f2f2f2,#a9adb3 60%,#7d828a);box-shadow:inset 0 0 0 " + 4 * s + "px #c9ccd1" }, prod);
      BLOCK.el("div", { style: "left:" + (cx - r) + "px;top:" + (top + h - ey / 2) + "px;width:" + 2 * r + "px;height:" + ey + "px;border-radius:50%;background:" + shade + "," + BLOCK.mix(P.product_color, "#000", 0.15) + "" }, prod);
    }
  }
  // putaran mulus + sedikit melayang; masuk dengan pegas
  var rev = +P.turns || 1;
  BLOCK.onTime(tl, function (t) {
    var a = -180 - 360 * rev * (t / k.dur);
    badan.style.transform = "rotateX(" + (-tilt) + "deg) rotateY(" + a + "deg)";
    faces.forEach(function (f) { var c = Math.cos((f.a + a) * Math.PI / 180 + 0.35); f.sh.style.opacity = (0.5 - 0.45 * Math.max(0, c)).toFixed(3); });
  }, k.dur);
  tl.fromTo(prod, { y: -60 * s, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.8, ease: "blockSpringSoft", immediateRender: true }, 0)
    .to(prod, { y: -8 * s, duration: (k.dur - 0.8) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8);
}, { font: true });
</script>
</div>
<script>
  window.__duration = 6.5;
  window.__timelines = window.__timelines || {};
  window.__timelines["example"] = gsap.timeline({ paused: true }).set({}, {}, 6.5);
</script>
