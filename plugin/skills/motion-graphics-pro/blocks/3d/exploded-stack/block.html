<script>
BLOCK.mount("__ID__", function (k) {
var P = k.P, s = k.s, tl = k.tl, W = k.w, H = k.h, fam = BLOCK.family(P.font);

  var RX = 56, RZ = -45, cx = W * (W < H ? Math.min(+P.position_x, 30) : +P.position_x) / 100, cy = H * 0.56;
  var pan = BLOCK.el("div", { class: "blk-pan", style: "left:" + cx + "px;top:" + cy + "px;transform:rotateX(" + RX + "deg) rotateZ(" + RZ + "deg)" }, k.root);

  function layar(x, y, z) { var x1 = x * Math.cos(a) - y * Math.sin(a), y1 = x * Math.sin(a) + y * Math.cos(a); return [cx + x1, cy + y1 * Math.cos(b) - z * Math.sin(b)]; }

  var zs = function (i, buka) { var mid = (n - 1) / 2; return (mid - i) * (th + (buka ? gap : 2 * s)); };
  L.forEach(function (l, i) {
    var c = l.warna || "#5b8cff", lp = BLOCK.el("div", { class: "blk-lp", style: "left:" + (-S0 / 2) + "px;top:" + (-S0 / 2) + "px;width:" + S0 + "px;height:" + S0 + "px" }, pan);

    BLOCK.el("div", { style: "left:" + (-th) + "px;top:0;width:" + th + "px;height:" + S0 + "px;transform-origin:100% 50%;transform:rotateY(90deg);background:" + BLOCK.mix(c, "#000", 0.22) }, lp);

    BLOCK.el("b", { style: "font-size:" + Math.round(40 * s) + "px" }, lb).textContent = l.judul || "";

    var ln = BLOCK.svg("path", { fill: "none", stroke: c, "stroke-width": 2.5 * s }, svg), dot = BLOCK.svg("circle", { r: 5 * s, fill: c }, svg);
    var st = { z: zs(i, false) + 900 * s, o: 0 };
    function upd() {

    }
    upd();
    var d0 = 0.15 + (n - 1 - i) * 0.12, tb = 1.3, tc = Math.max(tb + 2, k.dur - 1.4);
    tl.fromTo(st, { z: zs(i, false) + 900 * s, o: 0 }, { z: zs(i, false), duration: 0.7, ease: "power3.out", onUpdate: upd, immediateRender: true }, d0)
      .to(st, { z: zs(i, true), duration: 0.9, ease: "blockSpringSoft", onUpdate: upd }, tb + i * 0.05)
      .to(st, { o: 1, duration: 0.45, ease: "power2.out", onUpdate: upd }, tb + 0.45 + i * 0.12)

      .to(st, { o: 0, duration: 0.3, ease: "power1.in", onUpdate: upd }, tc - 0.1)
      .to(st, { z: zs(i, false), duration: 0.8, ease: "power3.inOut", onUpdate: upd }, tc + (n - 1 - i) * 0.04);
  });
}, { font: true });
</script>
