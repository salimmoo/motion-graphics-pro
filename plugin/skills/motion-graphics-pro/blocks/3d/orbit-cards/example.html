  var inti = null;

    BLOCK.el("i", { style: "background:" + (c.warna || P.core_color) }, e);
    BLOCK.el("small", {}, e).textContent = c.judul || "";
    BLOCK.el("b", { style: "color:" + BLOCK.mix(c.warna || P.core_color, "#000", 0.25) }, e).textContent = c.angka || "";

      c.g.style.opacity = (0.42 * (0.5 - z * 0.5)).toFixed(3);
      c.e.style.opacity = BLOCK.clamp(li * 3, 0, 1).toFixed(3);
    });
    if (inti) { var ip = BLOCK.spring(BLOCK.clamp(t / 1.1, 0, 1) * 1.1, 1.1, 0.45); inti.style.zIndex = 1000; inti.style.transform = "scale(" + (ip * (1 + 0.03 * Math.sin(t * 2.2))).toFixed(3) + ")"; }
