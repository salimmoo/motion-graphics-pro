<style>

<script>

    var inn = E("div", { class: "in", style: "width:" + fw + "px;height:" + fh + "px" }, kt);
    var gb = E("div", { style: "left:0;top:0;width:" + fw + "px;height:" + hx + "px;background:" + gam + ";transform-origin:0 0" }, inn);

    var dt = E("div", { style: "left:" + px(28) + ";right:" + px(28) + ";top:" + (hx + 84 * u) + "px;color:" + ink }, inn);
    E("div", { style: "font-size:" + px(22) + ";opacity:.6;margin-bottom:" + px(14) }, dt, BLOCK.esc(P.sub));
    P.rows.forEach(function (b) { E("div", { class: "rw", style: "height:" + px(54) + ";font-size:" + px(21) }, dt, BLOCK.esc(b)); });
