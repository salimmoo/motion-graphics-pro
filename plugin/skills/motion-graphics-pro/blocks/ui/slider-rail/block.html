<!-- Block ui/slider-rail · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="ui/slider-rail" data-start="0" data-duration="4" data-track-index="40" class="blk blk-ui-slider-rail">
<script type="application/json" data-block-props>
{"mode": "rail", "card": ["Pagi di pasar", "Senja di dermaga", "Kopi pertama", "Hujan di kota", "Jalan pulang"], "select": 3, "select_label": "Terpilih", "accent_color": "#ffcf4a", "bg": "#11131c", "font": "Inter:wght@500;600;700;800"}

<div class="blk-rel"></div>
</div>
<style>
.blk-ui-slider-rail{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-ui-slider-rail .blk-rel{position:absolute;left:0;top:0;width:100%;height:100%}
.blk-ui-slider-rail .blk-kr{position:absolute;left:0;top:50%;overflow:hidden;color:#fff;font-weight:700;box-shadow:0 30px 60px rgba(0,0,0,.4)}

.blk-ui-slider-rail .blk-kp{position:absolute;left:0;right:0;bottom:0}
.blk-ui-slider-rail .blk-no{position:absolute;opacity:.75;font-weight:600}
.blk-ui-slider-rail .blk-tag{position:absolute;color:#111;font-weight:800;border-radius:999px;white-space:nowrap}
.blk-ui-slider-rail .blk-tc{position:absolute;left:0;top:0;border-radius:50%;background:rgba(255,255,255,.32);border:2px solid rgba(255,255,255,.9);box-sizing:border-box}
.blk-ui-slider-rail .blk-dt{position:absolute;left:50%;display:flex}
.blk-ui-slider-rail .blk-dt i{display:block;border-radius:99px;background:rgba(255,255,255,.35)}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, R = k.root, W = k.w, H = k.h, K = P.card || [], n = K.length, A = P.accent_color;
  R.style.fontFamily = BLOCK.family(P.font); R.style.background = P.bg;
  var rel = R.querySelector(".blk-rel"), ch = Math.min(H * 0.62, W * 0.62 / 0.75), cw = ch * 0.75, gp = cw * 0.1, step = cw + gp;
  var C = K.map(function (nm, i) {
    var hu = 15 + i * 47, e = BLOCK.el("div", { class: "blk-kr", style: "width:" + cw + "px;height:" + ch + "px;margin-top:" + -ch / 2 + "px;border-radius:" + 34 * s + "px;background:linear-gradient(170deg,hsl(" + hu + ",75%,72%),hsl(" + (hu + 35) + ",60%,38%))" }, rel);
    e.innerHTML = '<svg viewBox="0 0 100 55" preserveAspectRatio="none"><path d="M0 55 L0 30 L24 12 L44 30 L62 18 L100 40 L100 55Z" fill="hsla(' + hu + ',50%,22%,.5)"/><circle cx="74" cy="8" r="6" fill="rgba(255,255,255,.7)"/></svg>' +
      '<div class="blk-no" style="left:' + 28 * s + 'px;top:' + 24 * s + 'px;font-size:' + 24 * s + 'px">' + ("0" + (i + 1)).slice(-2) + " / " + ("0" + n).slice(-2) + '</div><div class="blk-kp" style="padding:' + 30 * s + 'px;font-size:' + 38 * s + 'px">' + BLOCK.esc(nm) + "</div>";
    return e;
  });
  var dt = BLOCK.el("div", { class: "blk-dt", style: "bottom:" + (H - ch) / 4 + "px;gap:" + 10 * s + "px" }, R), dots = K.map(function () { return BLOCK.el("i", { style: "width:" + 14 * s + "px;height:" + 14 * s + "px" }, dt); });
  var E = function (n) { return gsap.parseEase(n); }, KEY, tc = null, hero = BLOCK.clamp(P.select | 0, 0, n - 1);
  // posisi rel = indeks kartu di tengah (pecahan), sebagai fungsi murni waktu
  if (P.mode === "throw") {
    KEY = [[0, -1.6, "none"], [1.35, hero + 0.32, "expo.out"], [1.95, hero, "back.out(2.2)"]];
    var tg = BLOCK.el("div", { class: "blk-tag", style: "background:" + A + ";font-size:" + 24 * s + "px;padding:" + 10 * s + "px " + 22 * s + "px;right:" + 24 * s + "px;top:" + 22 * s + "px" }, C[hero], BLOCK.esc(P.select_label));
    tl.fromTo(tg, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2.5)" }, 2.0)
      .fromTo(C[hero], { boxShadow: "0 30px 60px rgba(0,0,0,.4), 0 0 0 0px " + BLOCK.rgba(A, 0) }, { boxShadow: "0 30px 60px rgba(0,0,0,.4), 0 0 0 " + 8 * s + "px " + BLOCK.rgba(A, 1), duration: 0.3 }, 1.95);
  } else {
    // dua gestur: seret 0.55 kartu, lepas, momentum membawa dan menjepret ke kartu berikutnya
    KEY = [[0, 0, "none"], [0.75, 0, "none"], [1.1, 0.5, "power1.in"], [1.75, 1, "back.out(1.3)"], [2.25, 1, "none"], [2.6, 1.5, "power1.in"], [3.25, 2, "back.out(1.3)"]];
    tc = BLOCK.el("div", { class: "blk-tc", style: "width:" + 80 * s + "px;height:" + 80 * s + "px" }, R);
  }
  KEY.forEach(function (q) { q[2] = E(q[2]); });
  function X(t) {
    if (t <= KEY[0][0]) return KEY[0][1];
    for (var i = 1; i < KEY.length; i++) if (t <= KEY[i][0]) { var a = KEY[i - 1], b = KEY[i]; return BLOCK.lerp(a[1], b[1], b[2](BLOCK.progress(t, a[0], b[0]))); }
    return KEY[KEY.length - 1][1];
  }
  var gy = H / 2;
  BLOCK.onTime(tl, function (t) {
    var x = X(t), v = (X(t + 1 / 60) - x) * 60, bl = P.mode === "throw" ? BLOCK.clamp(Math.abs(v) * 1.6 * s, 0, 14) : 0;
    C.forEach(function (e, i) {
      var d = i - x, ad = Math.abs(d), sc = 1 - 0.1 * Math.min(ad, 1.5), op = P.mode === "throw" && t > 1.9 ? 1 - 0.45 * BLOCK.clamp(ad, 0, 1) * BLOCK.progress(t, 1.9, 2.3) : 1;
      e.style.transform = "translate(" + (W / 2 - cw / 2 + d * step).toFixed(1) + "px,0) scale(" + sc.toFixed(4) + ")";
      e.style.filter = (bl > 0.3 ? "blur(" + bl.toFixed(1) + "px) " : "") + "brightness(" + (op * (1 - 0.25 * Math.min(ad, 1))).toFixed(3) + ")";
    });
    var ai = Math.round(BLOCK.clamp(x, 0, n - 1));
    dots.forEach(function (d, i) { d.style.background = i === ai ? "#fff" : "rgba(255,255,255,.35)"; d.style.width = (i === ai ? 34 : 14) * s + "px"; });
    if (tc) {
      // lingkaran sentuh memimpin seretan, lepas saat momentum mengambil alih
      var gs = [[0.75, 1.1], [2.25, 2.6]], on = 0, gx = W * 0.72;
      gs.forEach(function (g) {
        var a = BLOCK.progress(t, g[0] - 0.15, g[0]), b = BLOCK.progress(t, g[1], g[1] + 0.2);
        if (t >= g[0] - 0.15 && t < g[1] + 0.2) { on = a * (1 - b); gx = W * 0.72 - (Math.min(t, g[1]) > g[0] ? X(Math.min(t, g[1])) - X(g[0]) : 0) * step - b * 60 * s; }
      });
      tc.style.opacity = on.toFixed(3); tc.style.transform = "translate(" + (gx - 40 * s).toFixed(1) + "px," + (gy - 40 * s).toFixed(1) + "px) scale(" + (1.3 - 0.3 * on).toFixed(3) + ")";
    }
  }, k.dur);
}, { font: true });
</script>
