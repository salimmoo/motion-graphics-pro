<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, D = k.dur, E = BLOCK.el, R = k.root;
  var gelap = P.theme !== "light", bg = gelap ? "rgba(18,18,20,.86)" : "rgba(255,255,255,.94)", fg = gelap ? "#f1f1f1" : "#111";
  var aks = { youtube: "#ff3d3d", tiktok: "#fe2c55", instagram: "#e1306c", x: "#1d9bf0" }[P.platform] || "#ff3d3d";
  R.style.cssText += ";--s:" + s;
  var tempat = { "bottom-left": "left:6%;bottom:9%", "bottom-right": "right:6%;bottom:9%", center: "left:50%;top:50%;transform:translate(-50%,-50%)", "top-left": "left:6%;top:9%" };
  var tp = E("div", { class: "blk-tumpuk", style: (tempat[P.position] || tempat["bottom-left"]) + ";width:" + Math.min(P.width * s, k.w * 0.88) + "px;font-family:" + BLOCK.family(P.font) + ";color:" + fg }, R);
  var warnaAv = ["#e0703a", "#3a8be0", "#43a35d", "#9b51e0", "#d6a520"];
  var ic = { suka: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2 3l-1 3h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.8 20H7"/></svg>' };
  function fmt(v) { v = Math.round(v); return v >= 1e4 ? (v / 1e3).toFixed(1).replace(".", ",") + " rb" : v.toLocaleString("id-ID"); }
  var daftar = Array.isArray(P.comments) ? P.comments : [], t = 0.2, tulisan = [];
  daftar.forEach(function (c, i) {
    var kom = E("div", { class: "blk-kom", style: "background:" + bg }, tp);
    var ini = String(c.nama || "?").replace(/^@/, "").slice(0, 1).toUpperCase();
    var av = E("div", { class: "blk-av", style: c.avatar ? "background-image:url(" + c.avatar + ")" : "background:" + warnaAv[i % warnaAv.length] }, kom, c.avatar ? "" : BLOCK.esc(ini));
    var isi = E("div", { class: "blk-isi" }, kom);
    var kep = E("div", { class: "blk-kep" }, isi, "<b>" + BLOCK.esc(c.nama) + "</b><span>" + BLOCK.esc(c.waktu || "") + "</span>");
    var tx = E("div", { class: "blk-tx", style: "position:relative" }, isi);
    E("span", { style: "visibility:hidden" }, tx, BLOCK.esc(c.teks || ""));
    var lap = E("div", { style: "position:absolute;left:0;top:0;right:0" }, tx), isiT = E("span", null, lap), krt = E("span", { class: "blk-krt" }, lap);
    var baris = E("div", { class: "blk-baris" }, isi), sk = E("span", { style: "color:" + aks }, baris, ic.suka), skn = E("span", null, sk);
    E("span", { style: "font-weight:700" }, baris, "Balas");
    var teks = String(c.teks || ""), lama = teks.length / Math.max(1, P.kps);
    tl.fromTo(kom, { y: 40 * s, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, t);
    tl.fromTo(av, { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, t + 0.1);
    tl.fromTo(kep, { x: -14 * s, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, t + 0.2);
    var mulai = t + 0.45;
    tulisan.push({ el: isiT, krt: krt, teks: teks, mulai: mulai, lama: lama });
    tl.fromTo(baris, { autoAlpha: 0, y: 8 * s }, { autoAlpha: 0.75, y: 0, duration: 0.4 }, mulai + lama + 0.1);
    var o = { v: 0 };
    tl.fromTo(o, { v: 0 }, { v: +c.suka || 0, duration: 0.9, ease: "power2.out", onUpdate: function () { skn.textContent = fmt(o.v); } }, mulai + lama + 0.1);
    skn.textContent = "0";
    t = mulai + lama + P.pause + 0.4;
  });
  // mesin ketik per karakter + kursor berkedip, fungsi murni dari waktu
  BLOCK.onTime(tl, function (tt) {
    tulisan.forEach(function (w, i) {
      var n = Math.floor(BLOCK.clamp((tt - w.mulai) / (w.lama || 1), 0, 1) * w.teks.length + 1e-6);
      w.el.textContent = w.teks.slice(0, n);
      var aktif = tt >= w.mulai - 0.2 && (i === tulisan.length - 1 || tt < tulisan[i + 1].mulai - 0.6);
      w.krt.style.opacity = aktif && (n < w.teks.length || Math.floor(tt * 2.2) % 2 === 0) ? 1 : 0;
    });
  }, D);
  tl.to(tp.children, { autoAlpha: 0, y: 20 * s, duration: 0.4, ease: "power2.in", stagger: 0.05 }, D - 0.5);
}, { font: true });
</script>
