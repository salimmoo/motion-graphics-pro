<!-- Block subtitles/wipe · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="subtitles/wipe" data-start="0" data-duration="5" data-track-index="30" class="blk blk-subtitles-wipe">
<script type="application/json" data-block-props>
{"text": "Setiap langkah kecil tetap membawa kita maju", "words": [], "kps": 2.0, "max_words": 3, "font": "Montserrat:wght@800;900", "size": 76, "color": "#ffffff", "bottom": 16, "uppercase": true, "accent_color": "#36d6ff", "line": true, "wipe_duration": 0.26, "ease": "power3.inOut"}
</script>
<div class="blk-cap"></div>
</div>
<style>
.blk-subtitles-wipe{position:absolute;inset:0;pointer-events:none}
.blk-subtitles-wipe .blk-cap{position:absolute;left:5%;right:5%;text-align:center;line-height:1.2}
.blk-subtitles-wipe .blk-hal{position:absolute;left:0;right:0;bottom:0}
.blk-subtitles-wipe .blk-w{position:relative;display:inline-block;margin:0 .12em}
.blk-subtitles-wipe .blk-t{display:inline-block}
.blk-subtitles-wipe .blk-bar{position:absolute;top:8%;bottom:8%;width:.09em;margin-left:-.045em;border-radius:.05em}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, cap = k.root.querySelector(".blk-cap");
  cap.style.cssText += ";bottom:" + P.bottom + "%;color:" + P.color + ";font-family:" + BLOCK.family(P.font) + ";font-weight:900;font-size:" +
    Math.round(P.size * s) + "px;text-shadow:0 " + Math.round(4 * s) + "px " + Math.round(14 * s) + "px rgba(0,0,0,.45)" + (P.uppercase ? ";text-transform:uppercase" : "");
  var d = +P.wipe_duration || 0.26;
  BLOCK.pages(BLOCK.words(P), P.max_words).forEach(function (pg) {
    var h = BLOCK.el("div", { class: "blk-hal" }, cap);
    BLOCK.initial(tl, h, { autoAlpha: 0 }).set(h, { autoAlpha: 1 }, pg.mulai).set(h, { autoAlpha: 0 }, pg.akhir);
    pg.kata.forEach(function (w) {
      var e = BLOCK.el("span", { class: "blk-w" }, h), t = BLOCK.el("span", { class: "blk-t" }, e);
      t.textContent = String(w.teks).replace(/\*/g, "");
      // usap kiri -> kanan dengan clip-path; inset negatif menyisakan ruang untuk bayangan
      tl.fromTo(t, { clipPath: "inset(-30% 100% -30% -4%)" }, { clipPath: "inset(-30% -6% -30% -4%)", duration: d, ease: P.ease }, w.mulai);
      if (P.line) {
        var b = BLOCK.el("span", { class: "blk-bar", style: "background:" + P.accent_color + ";box-shadow:0 0 " + Math.round(12 * s) + "px " + P.accent_color }, e);
        tl.fromTo(b, { left: "0%", opacity: 1, scaleY: 1 }, { left: "100%", duration: d, ease: P.ease }, w.mulai)
          .to(b, { opacity: 0, scaleY: 0.2, duration: 0.18, ease: "power2.in" }, w.mulai + d);
      }
    });
  });
}, { font: true });
</script>
