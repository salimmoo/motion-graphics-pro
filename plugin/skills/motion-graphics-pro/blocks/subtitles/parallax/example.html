<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;--s:1;font-family:"Inter",system-ui,sans-serif}

.adegan{position:absolute;inset:0;overflow:hidden}
.ad-judul{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 calc(var(--s)*150px)/1 "Inter",system-ui,sans-serif;letter-spacing:-.02em}
.ad-sub{position:absolute;left:0;right:0;top:calc(50% + var(--s)*110px);text-align:center;font:500 calc(var(--s)*40px)/1.2 "Inter",system-ui,sans-serif;opacity:.75;letter-spacing:.2em;text-transform:uppercase}
.ad-a{background:radial-gradient(120% 90% at 30% 20%,#ffb347 0%,#e8553d 45%,#5a1f3a 100%);color:#fff7ea}
.ad-b{background:radial-gradient(120% 90% at 70% 30%,#7ee0d6 0%,#2d6cdf 50%,#10233f 100%);color:#f2fbff}
.ad-gelap{background:radial-gradient(110% 80% at 50% 35%,#2b2f45 0%,#12131c 70%);color:#f5f3ee}
.ad-terang{background:linear-gradient(160deg,#f7f3ea 0%,#e9e2d3 100%);color:#1d1b18}
.ad-kertas{background:#efe6d2;color:#2a2420}
.ad-kertas::after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(90,60,30,.25) 1px,transparent 1.4px);background-size:7px 7px}
.ad-foto{background:linear-gradient(180deg,#8fc3e8 0%,#f6d7b0 58%,#d98c5f 59%,#7a4b3a 100%)}
.ad-foto .mth{position:absolute;width:calc(var(--s)*260px);height:calc(var(--s)*260px);border-radius:50%;left:62%;top:22%;background:radial-gradient(circle,#fff6d8 0%,#ffd27a 60%,rgba(255,210,122,0) 72%)}
.ad-foto .bk1{position:absolute;left:-10%;right:-10%;bottom:28%;height:30%;background:#5f7f6a;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .bk2{position:absolute;left:30%;right:-30%;bottom:20%;height:34%;background:#3f5f52;border-radius:50% 50% 0 0/100% 100% 0 0}
.ad-foto .tanah{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2f463d,#1f2e29)}
.ad-foto .sosok{position:absolute;left:40%;bottom:18%;width:calc(var(--s)*120px);height:calc(var(--s)*330px);background:#18201d;border-radius:calc(var(--s)*60px) calc(var(--s)*60px) calc(var(--s)*14px) calc(var(--s)*14px)}
.ad-foto .sosok::before{content:"";position:absolute;left:18%;top:-26%;width:64%;height:26%;border-radius:50%;background:#18201d}
.ad-ui{background:#eef1f6;color:#1b2333;font-family:"Inter",system-ui,sans-serif}
.ad-ui .bar{position:absolute;left:0;right:0;top:0;height:7%;background:#fff;border-bottom:1px solid #d9dee8}
.ad-ui .side{position:absolute;left:0;top:7%;bottom:0;width:18%;background:#f7f8fb;border-right:1px solid #d9dee8}
.ad-ui .kartu{position:absolute;background:#fff;border-radius:calc(var(--s)*18px);box-shadow:0 calc(var(--s)*6px) calc(var(--s)*24px) rgba(20,30,60,.08)}
.ad-ui .tombol{position:absolute;background:#2d6cdf;color:#fff;border-radius:calc(var(--s)*12px);font:600 calc(var(--s)*30px)/1 "Inter",sans-serif;display:flex;align-items:center;justify-content:center}

<body>
<div id="stage" data-composition-id="example" data-width="1080" data-height="1920" data-duration="5.5">
<div id="adegan" class="adegan ad-foto"><div class="mth"></div><div class="bk1"></div><div class="bk2"></div><div class="tanah"></div><div class="sosok"></div></div>
<!-- Block subtitles/parallax · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-parallax" data-block="subtitles/parallax" data-start="0" data-duration="5" data-track-index="30" class="blk blk-subtitles-parallax">
<script type="application/json" data-block-props>
{"text": "Mimpi besar dimulai dari sini", "words": [], "kps": 1.6, "max_words": 2, "font": "Anton:wght@400", "size": 250, "color": "#ffffff", "bottom": 24, "uppercase": true, "figure": "#adegan .sosok", "layer_color": "#ffd23f", "stretch": 2.4, "depth": 1}
</script>
<div class="blk-cap"></div>
<div class="blk-topeng"></div>
</div>
<style>
.blk-subtitles-parallax{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blk-subtitles-parallax .blk-cap{position:absolute;left:0;right:0;text-align:center;line-height:.9;z-index:1}
.blk-subtitles-parallax .blk-hal{position:absolute;left:0;right:0;bottom:0}
.blk-subtitles-parallax .blk-lapis{position:absolute;left:0;right:0;bottom:0;color:transparent}
.blk-subtitles-parallax .blk-w{display:inline-block;margin:0 .05em;transform-origin:50% 100%}
.blk-subtitles-parallax .blk-topeng{position:absolute;z-index:2;left:0;top:0}
.blk-subtitles-parallax .blk-topeng div{position:absolute}
</style>
<script>
BLOCK.mount("blk-parallax", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, cap = root.querySelector(".blk-cap"), mask = root.querySelector(".blk-topeng");
  cap.style.cssText += ";bottom:" + P.bottom + "%;color:" + P.color + ";font-family:" + BLOCK.family(P.font, "Impact, sans-serif") + ";font-size:" +
    Math.round(P.size * s) + "px" + (P.uppercase ? ";text-transform:uppercase" : "");
  BLOCK.pages(BLOCK.words(P), P.max_words).forEach(function (pg) {
    var grup = BLOCK.el("div", { class: "blk-hal" }, cap);
    // lapis belakang: garis luar lebih besar, bergerak lebih lambat (kedalaman)
    var lap = BLOCK.el("div", { class: "blk-lapis", style: "-webkit-text-stroke:" + (3 * s).toFixed(1) + "px " + P.layer_color + ";opacity:.85" }, grup);
    var dep = BLOCK.el("div", { style: "position:relative;text-shadow:0 " + Math.round(18 * s) + "px " + Math.round(40 * s) + "px rgba(0,0,0,.35)" }, grup);
    BLOCK.initial(tl, grup, { autoAlpha: 0 }).set(grup, { autoAlpha: 1 }, pg.mulai).set(grup, { autoAlpha: 0 }, pg.akhir);
    var lama = Math.max(0.4, pg.akhir - pg.mulai);
    tl.fromTo(lap, { y: -0.1 * P.size * s, scale: 1.12 }, { y: -0.22 * P.size * s * P.depth, scale: 1.16, duration: lama, ease: "none" }, pg.mulai)
      .fromTo(dep, { y: 0 }, { y: -0.06 * P.size * s * P.depth, duration: lama, ease: "none" }, pg.mulai);
    pg.kata.forEach(function (w) {
      var t = String(w.teks).replace(/\*/g, "");
      [lap, dep].forEach(function (ly, li) {
        var e = BLOCK.el("span", { class: "blk-w" }, ly); e.textContent = t;
        // regangan vertikal: tinggi berlipat lalu mendarat ke bentuk normal
        tl.fromTo(e, { opacity: 0, scaleY: P.stretch, scaleX: 0.85, y: 30 * s }, { opacity: 1, scaleY: 1, scaleX: 1, y: 0, duration: 0.6, ease: "expo.out" }, w.mulai - 0.04 + li * 0.05);
      });
    });
  });
  // topeng: salinan siluet sosok di atas teks (z-index di dalam blok), mengikuti posisi sosok tiap frame
  var tg = BLOCK.find(P.figure);
  if (tg) {
    var badan = BLOCK.el("div", null, mask), parts = [[tg, badan, null]];
    ["::before", "::after"].forEach(function (ps) {
      var cs = getComputedStyle(tg, ps);
      if (cs.content && cs.content !== "none") parts.push([tg, BLOCK.el("div", null, badan), ps]);
    });
    var salin = function (src, dst, ps) {
      var cs = getComputedStyle(src, ps);
      ["backgroundColor", "backgroundImage", "borderTopLeftRadius", "borderTopRightRadius", "borderBottomLeftRadius", "borderBottomRightRadius", "transform", "opacity"].forEach(function (p) { dst.style[p] = cs[p]; });
      if (ps) ["left", "top", "width", "height"].forEach(function (p) { dst.style[p] = cs[p]; });
    };
    BLOCK.onTime(tl, function () {
      var rr = root.getBoundingClientRect(), r = tg.getBoundingClientRect(), sk = rr.width / (root.offsetWidth || rr.width) || 1;
      badan.style.left = ((r.left - rr.left) / sk).toFixed(1) + "px"; badan.style.top = ((r.top - rr.top) / sk).toFixed(1) + "px";
      badan.style.width = (r.width / sk).toFixed(1) + "px"; badan.style.height = (r.height / sk).toFixed(1) + "px";
      parts.forEach(function (p) { salin(p[0], p[1], p[2]); });
      badan.style.transform = "none";
      var vis = getComputedStyle(tg).visibility !== "hidden";
      mask.style.visibility = vis ? "inherit" : "hidden";
    }, k.dur);
  }
}, { font: true });
</script>
</div>
<script>
  window.__duration = 5.5;
  window.__timelines = window.__timelines || {};
  window.__timelines["example"] = gsap.timeline({ paused: true }).set({}, {}, 5.5);
</script>
