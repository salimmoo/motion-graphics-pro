<!-- Block subtitles/particles · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="blk-particles" data-block="subtitles/particles" data-start="0" data-duration="5" data-track-index="30" class="blk blk-subtitles-particles">
<script type="application/json" data-block-props>
{"text": "Hasil akhirnya *luar biasa* dan semua orang *bangga*", "words": [], "kps": 2.0, "max_words": 3, "font": "Poppins:wght@800;900", "size": 80, "color": "#ffffff", "bottom": 17, "uppercase": true, "keywords": [], "accent_color": "#ffd84a", "palette": ["#ffd84a", "#ff5d73", "#5ce1ff", "#9b7bff", "#ffffff"], "count": 40, "strength": 1, "seed": 3}

<style>
.blk-subtitles-particles{position:absolute;inset:0;pointer-events:none}
.blk-subtitles-particles .blk-kanvas{z-index:0}
.blk-subtitles-particles .blk-cap{position:absolute;left:5%;right:5%;text-align:center;line-height:1.2;z-index:1}
.blk-subtitles-particles .blk-hal{position:absolute;left:0;right:0;bottom:0}
.blk-subtitles-particles .blk-w{display:inline-block;margin:0 .12em}
</style>
<script>
BLOCK.mount("blk-particles", function (k) {
  var P = k.P, tl = k.tl, s = k.s, root = k.root, cap = root.querySelector(".blk-cap");
  var KL = (P.keywords || []).map(function (x) { return String(x).toLowerCase(); });
  var polos = function (t) { return String(t).replace(/\*/g, ""); };
  var kunci = function (t) { return /\*/.test(t) || KL.indexOf(polos(t).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "")) >= 0; };
  cap.style.cssText += ";bottom:" + P.bottom + "%;color:" + P.color + ";font-family:" + BLOCK.family(P.font) + ";font-weight:900;font-size:" +
    Math.round(P.size * s) + "px;text-shadow:0 " + Math.round(5 * s) + "px " + Math.round(16 * s) + "px rgba(0,0,0,.45)" + (P.uppercase ? ";text-transform:uppercase" : "");
  var kv = BLOCK.canvas(root, k.w, k.h), ctx = kv.ctx, acak = k.random, ledak = [], anim = [];
  BLOCK.pages(BLOCK.words(P), P.max_words).forEach(function (pg) {
    var h = BLOCK.el("div", { class: "blk-hal" }, cap);
    pg.kata.forEach(function (w) {
      var e = BLOCK.el("span", { class: "blk-w" }, h); e.textContent = polos(w.teks);
      var kk = kunci(w.teks); if (kk) e.style.color = P.accent_color;
      anim.push(function () {
        if (kk) tl.fromTo(e, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)" }, w.mulai);
        else tl.fromTo(e, { opacity: 0, y: 16 * s }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, w.mulai);
      });
      if (kk) ledak.push({ e: e, t0: w.mulai + 0.05 });
    });
    anim.push(function () { BLOCK.initial(tl, h, { autoAlpha: 0 }).set(h, { autoAlpha: 1 }, pg.mulai).set(h, { autoAlpha: 0 }, pg.akhir); });
  });
  // ukur pusat kata kunci sebelum tween apa pun menggeser layout, lalu buat partikel berseed
  var rr = root.getBoundingClientRect();
  ledak.forEach(function (b) {
    var r = b.e.getBoundingClientRect(); b.x = r.left - rr.left + r.width / 2; b.y = r.top - rr.top + r.height / 2; b.lebar = r.width;
    b.p = [];
    for (var i = 0; i < P.count; i++) {
      var a = acak() * Math.PI * 2, v = acak.range(380, 1250) * s * P.strength;
      b.p.push({ ox: (acak() - 0.5) * b.lebar * 0.8, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 260 * s, kd: acak.range(2.2, 3.6),
        hidup: acak.range(0.7, 1.3), uk: acak.range(5, 13) * s, c: acak.pick(P.palette), bentuk: acak.int(0, 2), rot: acak() * 6, spin: acak.range(-12, 12) });
    }
  });
  anim.forEach(function (f) { f(); });
  var g = 1500 * s;
  // posisi tertutup: hambatan linear + gravitasi, murni dari t
  BLOCK.onTime(tl, function (t) {
    ctx.clearRect(0, 0, kv.w, kv.h);
    ledak.forEach(function (b) {
      var dt = t - b.t0; if (dt < 0 || dt > 1.4) return;
      if (dt < 0.35) { // cincin kejut
        ctx.globalAlpha = 1 - dt / 0.35; ctx.strokeStyle = P.accent_color; ctx.lineWidth = 6 * s * (1 - dt / 0.35);
        ctx.beginPath(); ctx.ellipse(b.x, b.y, b.lebar * 0.3 + dt * 900 * s, (b.lebar * 0.15 + dt * 500 * s), 0, 0, Math.PI * 2); ctx.stroke();
      }
      b.p.forEach(function (p) {
        if (dt > p.hidup) return;
        var e = 1 - Math.exp(-p.kd * dt), x = b.x + p.ox + p.vx * e / p.kd;
        var y = b.y + (g / p.kd) * dt + (p.vy - g / p.kd) * e / p.kd, f = dt / p.hidup;
        ctx.globalAlpha = 1 - f * f; ctx.fillStyle = p.c;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.spin * dt);
        if (p.bentuk === 0) { ctx.beginPath(); ctx.arc(0, 0, p.uk * 0.5, 0, Math.PI * 2); ctx.fill(); }
        else if (p.bentuk === 1) ctx.fillRect(-p.uk * 0.5, -p.uk * 0.3, p.uk, p.uk * 0.6);
        else { ctx.beginPath(); ctx.moveTo(0, -p.uk * 0.7); ctx.lineTo(p.uk * 0.6, p.uk * 0.5); ctx.lineTo(-p.uk * 0.6, p.uk * 0.5); ctx.fill(); }
        ctx.restore();
      });
    });
    ctx.globalAlpha = 1;
  }, k.dur);
}, { font: true });
</script>
