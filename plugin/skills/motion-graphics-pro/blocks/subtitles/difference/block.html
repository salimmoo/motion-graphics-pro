<!-- Block subtitles/difference · Motion Graphics Pro. Props: see block.json. -->
<div data-composition-id="__ID__" data-block="subtitles/difference" data-start="0" data-duration="5" data-track-index="30" class="blk blk-subtitles-difference">
<script type="application/json" data-block-props>
{"text": "Terang atau gelap pesannya tetap terbaca", "words": [], "kps": 1.8, "max_words": 2, "font": "Archivo Black:wght@400", "size": 150, "color": "#ffffff", "bottom": 37, "uppercase": true, "mode": "difference", "slide": 6}
</script>
<div class="blk-cap"></div>
</div>
<style>
.blk-subtitles-difference{position:absolute;inset:0;pointer-events:none}
.blk-subtitles-difference .blk-cap{position:absolute;left:0;right:0;text-align:center;line-height:1}
.blk-subtitles-difference .blk-hal{position:absolute;left:0;right:0;bottom:0}
.blk-subtitles-difference .blk-w{display:inline-block;margin:0 .07em}
</style>
<script>
BLOCK.mount("__ID__", function (k) {
  var P = k.P, tl = k.tl, s = k.s, cap = k.root.querySelector(".blk-cap");
  // tanpa z-index/opacity/transform pada akar & cap supaya halaman bisa berbaur dengan adegan di bawahnya
  cap.style.cssText += ";bottom:" + P.bottom + "%;color:" + P.color + ";font-family:" + BLOCK.family(P.font, "Arial Black, sans-serif") + ";font-size:" +
    Math.round(P.size * s) + "px" + (P.uppercase ? ";text-transform:uppercase" : "");
  BLOCK.pages(BLOCK.words(P), P.max_words).forEach(function (pg, i) {
    var h = BLOCK.el("div", { class: "blk-hal", style: "mix-blend-mode:" + (P.mode === "exclusion" ? "exclusion" : "difference") }, cap);
    BLOCK.initial(tl, h, { autoAlpha: 0 }).set(h, { autoAlpha: 1 }, pg.mulai).set(h, { autoAlpha: 0 }, pg.akhir);
    // geser pelan melintasi batas terang/gelap supaya inversi per piksel terlihat
    var g = (i % 2 ? -1 : 1) * P.slide;
    tl.fromTo(h, { xPercent: g, y: 0 }, { xPercent: -g, y: 0, duration: Math.max(0.3, pg.akhir - pg.mulai), ease: "none" }, pg.mulai);
    pg.kata.forEach(function (w) {
      var e = BLOCK.el("span", { class: "blk-w" }, h); e.textContent = String(w.teks).replace(/\*/g, "");
      tl.fromTo(e, { opacity: 0, scale: 1.35, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, w.mulai - 0.04);
    });
  });
}, { font: true });
</script>
