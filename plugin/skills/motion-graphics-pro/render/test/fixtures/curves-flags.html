<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>html,body{margin:0;background:#222}.b{position:absolute;width:80px;height:80px;background:#fc0;top:100px}</style></head><body>
<div id="root" data-composition-id="main" data-duration="3" data-fps="24" data-width="800" data-height="400">
<div class="b" id="uni" style="left:40px"></div>
<div class="b" id="flip" style="left:180px"></div>
<div class="b" id="sq" style="left:320px"></div>
<div class="b" id="pop" style="left:460px;display:none"></div>
<div class="b" id="ry" style="left:600px"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#uni", { scale: 0.2 }, { scale: 1.3, duration: 1.2, ease: "power2.inOut" }, 0.2)
  .to("#uni", { scale: 1, duration: 0.8, ease: "power2.inOut" }, 1.5)
  .fromTo("#flip", { scaleX: -1, scaleY: 1 }, { scaleY: 1.4, scaleX: -1.4, duration: 1.5, ease: "sine.inOut" }, 0.3)
  .to("#sq", { scaleX: 1.3, scaleY: 0.6, duration: 0.5, ease: "power2.out" }, 0.5)
  .to("#sq", { scaleX: 1, scaleY: 1, duration: 0.6, ease: "power2.inOut" }, 1.0)
  .set("#pop", { display: "block" }, 1.0)
  .fromTo("#pop", { y: 0 }, { y: 1500, duration: 1.8, ease: "power2.inOut" }, 0.5)
  .set("#pop", { display: "none" }, 2.6)
  .fromTo("#ry", { rotateY: 0 }, { rotateY: 60, duration: 1.5, ease: "sine.inOut", transformPerspective: 600 }, 0.5);
window.__timelines = { main: tl };
window.__curves = (t) => t < 1.2 ? { a: t * 100 } : { a: t * 100, b: Math.min(1, (t - 1.2) * 2) * 300 };
</script></body></html>
