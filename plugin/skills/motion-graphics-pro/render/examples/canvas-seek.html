<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kanvas seek</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Adegan kanvas murni: setiap frame dihitung dari t saja (tanpa rAF, tanpa jam).
  const W = 1920, H = 1080, D = 4;
  const ctx = document.getElementById("c").getContext("2d");

  // acak berseed (mulberry32) agar posisi bintang sama di setiap render
  function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const r = rng(7);
  const stars = Array.from({ length: 220 }, () => ({ x: r() * W, y: r() * H * 0.7, s: 0.6 + r() * 2.2, p: r() * 6.28 }));
  const ease = (u) => (u = Math.min(1, Math.max(0, u)), u * u * (3 - 2 * u));

  function draw(t) {
    const u = t / D;
    // langit: fajar bergeser
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${230 - 25 * u}, 60%, ${8 + 14 * u}%)`);
    g.addColorStop(1, `hsl(${20 + 10 * u}, 80%, ${20 + 35 * u}%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // bintang berkelip, memudar saat fajar
    for (const s of stars) {
      ctx.globalAlpha = (1 - u) * (0.55 + 0.45 * Math.sin(t * 5 + s.p));
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // matahari terbit
    const sy = H * 0.95 - ease(u * 1.1) * H * 0.45;
    const sg = ctx.createRadialGradient(W / 2, sy, 10, W / 2, sy, 260);
    sg.addColorStop(0, "#fff6d5"); sg.addColorStop(0.35, "#ffb347"); sg.addColorStop(1, "rgba(255,120,40,0)");
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W / 2, sy, 260, 0, 6.283); ctx.fill();
    // tiga lapis bukit paralaks
    [["#1b1b3a", 0.78, 60, 0.6], ["#2d1e4a", 0.84, 90, 1.0], ["#120d24", 0.9, 120, 1.6]].forEach(([col, base, amp, sp], i) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) ctx.lineTo(x, H * base - amp * Math.sin((x / W) * 6.283 * (1 + i * 0.5) + t * sp * 0.5) - amp * 0.4 * Math.sin(x / 97 + i));
      ctx.lineTo(W, H); ctx.fill();
    });
    // judul
    const a = ease((t - 0.6) / 0.8) * (1 - ease((t - 3.4) / 0.5));
    ctx.globalAlpha = a; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "800 120px system-ui, 'Segoe UI', Arial, sans-serif";
    ctx.fillText("FAJAR", W / 2, 300 - 30 * (1 - a));
    ctx.font = "500 40px system-ui, 'Segoe UI', Arial, sans-serif";
    ctx.fillText("kanvas · window.__seek(t)", W / 2, 370);
    ctx.globalAlpha = 1;
    // penanda waktu
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "28px ui-monospace, Consolas, monospace"; ctx.textAlign = "left";
    ctx.fillText(t.toFixed(3) + " s", 40, H - 40);
  }

  // Kontrak Rekam
  window.__duration = D;
  window.__fps = 30;
  window.__size = { width: W, height: H };
  window.__seek = (t) => draw(t);
  draw(0);
</script>
</body>
</html>
