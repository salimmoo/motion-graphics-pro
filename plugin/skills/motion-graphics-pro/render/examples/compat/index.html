<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Contoh kompatibel HyperFrames</title>
<style>body{margin:0;background:#000}</style>
<!-- Mesin animasi: HyperFrames TIDAK menyediakan gsap global (0.9.16 gagal "Cannot read properties of null
     (reading 'timeline')" tanpa baris ini), jadi komposisi memuatnya sendiri dari CDN. Rekam mengalihkan URL
     GSAP dari jsDelivr/unpkg/cdnjs ke Gerak lokal (tanpa internet); tanpa baris ini Rekam tetap menyuntik Gerak. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script></head>
<body>
<!-- Struktur sama dengan T7 skill: root + host scene + audio. Gaya <style> di tiap scene dilingkup ke
     host-nya (Rekam dan HyperFrames): #root milik s01 tidak mengenai s02 atau root utama. -->
<div id="root" data-composition-id="main" data-start="0" data-duration="4"
  data-fps="24" data-width="1080" data-height="1080">
  <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html"
    data-start="0" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
    data-width="1080" data-height="1080" style="z-index:1"></div>
  <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html"
    data-start="2" data-duration="2" data-track-index="2" data-track-kind="graphics"
    data-width="1080" data-height="1080" style="z-index:2"></div>
  <audio id="klik" class="clip" src="assets/klik.wav" data-start="1.5" data-track-index="9" data-volume="1"></audio>
</div>
<script>window.__timelines["main"] = gsap.timeline({ paused: true });</script>
</body>
</html>
