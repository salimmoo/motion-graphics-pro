<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>MGP wajah · kepala 2.5D + FACS + lip-sync</title>
<style>html,body{margin:0;background:#efe6d2}#stage{position:relative;width:1280px;height:720px;overflow:hidden}</style>
<script src="../motion/motion.js"></script>
<script src="../core/mgp-core.js"></script>
<script src="../lipsync.js"></script>
<script src="../face.js"></script>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-fps="24"></div>
<script>
// Joystick menyapu 5 pose ekstrem (tengah, kanan, kiri, atas, bawah); ekspresi = gabungan AU; bicara = visem lip-sync.
const w = MGP.face.create("#stage", { duration: 10,
  joystick: [[0, [0, 0]], [1.2, [1, 0]], [2.4, [1, 0]], [3.4, [-1, 0]], [4.6, [-1, 0]], [5.6, [0, -1]], [6.6, [0, 1]], [7.6, [0.6, 0.4]], [8.6, [0, 0]]],
  expression: [[0, "neutral"], [1.4, "happy"], [3.6, "surprised"], [5.2, "sad"], [6.8, "angry"], [8.4, "smile"]],
  text: "Halo! Ini wajah dua setengah dimensi.", lead: 7.6 });
window.__curves = () => w.state.kurva;
MGP.core.expose(w);
</script>
</body>
</html>
